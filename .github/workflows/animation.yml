          // ------------------------------------------------------------------
          // CHARACTER 1: THE OVERTHINKER (Skinny noodle-limbed protagonist)
          // ------------------------------------------------------------------
          export interface OverthinkerProps {
            position?: [number, number, number];
            rotation?: [number, number, number];
            frame: number;
            pose: "hunch" | "shy" | "grabbar" | "squatstrain" | "overheadpress" | "crushed" | "realityempty" | "zipout";
            mood: FaceProps["mood"];
            sweating?: boolean;
            waterfall?: boolean;
            tremble?: number;
            meltFactor?: number;
          }

          export const Overthinker: React.FC<OverthinkerProps> = ({
            position = [0, 0, 0],
            rotation = [0, 0, 0],
            frame,
            pose,
            mood,
            sweating = false,
            waterfall = false,
            tremble = 0,
            meltFactor = 0,
          }) => {
            const tx = tremble > 0 ? Math.sin(frame * 3.8) * tremble : 0;
            const tz = tremble > 0 ? Math.cos(frame * 4.2) * tremble * 0.5 : 0;

            const isSquat = pose === "squatstrain";
            const isPress = pose === "overheadpress";
            const isShy = pose === "shy";
            const isGrab = pose === "grabbar" || pose === "realityempty";
            const isCrushed = pose === "crushed";

            const hipY = isSquat ? 0.62 : isCrushed ? 0.72 : pose === "hunch" ? 0.88 : 0.94;
            const torsoTilt = pose === "hunch" ? 0.34 : isSquat ? 0.16 : isCrushed ? -0.65 : 0;

            // Arm angles by pose
            let leftArmRot: [number, number, number] = [0.2, 0, 0.14];
            let rightArmRot: [number, number, number] = [0.2, 0, -0.14];
            if (isShy) {
              leftArmRot = [-0.55, 0.45, -0.75];
              rightArmRot = [-0.55, -0.45, 0.75];
            } else if (isGrab || isSquat) {
              leftArmRot = [-0.35, 0, 1.38];
              rightArmRot = [-0.35, 0, -1.38];
            } else if (isPress) {
              leftArmRot = [0, 0, 2.85];
              rightArmRot = [0, 0, -2.85];
            } else if (isCrushed) {
              leftArmRot = [-0.8, 0, 1.1];
              rightArmRot = [-0.8, 0, -1.1];
            }

            return (
              <group position={[position[0] + tx, position[1], position[2] + tz]} rotation={rotation}>
                {/* Legs (Noodle style) */}
                {[-0.17, 0.17].map((x, idx) => {
                  const sgn = idx === 0 ? -1 : 1;
                  const kneeOut = isSquat ? sgn * 0.45 : isGrab ? sgn * 0.22 : sgn * 0.08;
                  return (
                    <group key={idx} position={[x, hipY, 0]} rotation={[isCrushed ? -1.1 : 0, 0, kneeOut]}>
                      {/* Thigh */}
                      <InkCapsule args={[0.058, 0.34, 6, 12]} position={[0, -0.21, 0]} color={PALETTE.skinWhite} outline={0.022} frame={frame} seed={100 + idx} />
                      {/* Shin */}
                      <group position={[0, -0.42, 0]} rotation={[0, 0, -kneeOut * 1.15]}>
