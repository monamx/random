# ==============================================================================
# GitHub Actions Workflow: "Overthinker at the Gym" Studio 2D Cel + Rich SFX (v6)
# Stack: Remotion 4 + Three.js (3-Tone Anime Cel Shader + Tapered Anatomical Limbs
#        + Formant Scream Synth + Rich Gym Props)
# Output: 1080x1920 (9:16 Vertical Short), 30fps, 32s (960 frames), H.264 MP4
# ==============================================================================

name: Render Funny Gym Overthinker Animation (Studio 2D Cel + SFX v6)

on:
  workflow_dispatch:
    inputs:
      quality_crf:
        description: "FFmpeg H.264 CRF quality (14=ultra, 18=high, 23=standard)"
        required: false
        default: "18"
      concurrency:
        description: "Remotion render worker concurrency (auto-capped to runner cores)"
        required: false
        default: "2"
      include_audio:
        description: "Include synced procedural comedy SFX, formant screams & gym foley"
        type: boolean
        required: false
        default: true

jobs:
  render-overthinker-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install headless Chromium, WebGL (SwiftShader/ANGLE) & FFmpeg libs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            fonts-noto-color-emoji \
            fonts-dejavu-core
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Scaffold Studio 2D Cel + Rich SFX Remotion Project (v6)
        run: |
          rm -rf gym-anim
          mkdir -p gym-anim/src/scene gym-anim/src/components gym-anim/src/utils gym-anim/scripts gym-anim/public gym-anim/out

          # --------------------------------------------------------------------
          # 1. package.json, tsconfig.json & remotion.config.ts
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/package.json
          {
            "name": "overthinker-at-the-gym-v6",
            "version": "6.0.0",
            "private": true,
            "scripts": {
              "audio": "node scripts/generate-audio.mjs",
              "render": "remotion render src/index.ts OverthinkerAtGym out/overthinker-at-gym.mp4"
            },
            "dependencies": {
              "@react-three/fiber": "8.17.10",
              "@remotion/bundler": "4.0.242",
              "@remotion/cli": "4.0.242",
              "@remotion/three": "4.0.242",
              "react": "18.3.1",
              "react-dom": "18.3.1",
              "remotion": "4.0.242",
              "three": "0.169.0"
            },
            "devDependencies": {
              "@types/react": "18.3.12",
              "@types/three": "0.169.0",
              "typescript": "5.6.3"
            }
          }
          EOF

          cat << 'EOF' > gym-anim/tsconfig.json
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "ESNext",
              "moduleResolution": "bundler",
              "jsx": "react-jsx",
              "strict": false,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "forceConsistentCasingInFileNames": true,
              "lib": ["DOM", "ES2022"]
            },
            "include": ["src"]
          }
          EOF

          cat << 'EOF' > gym-anim/remotion.config.ts
          import { Config } from "@remotion/cli/config";
          Config.setVideoImageFormat("jpeg");
          Config.setOverwriteOutput(true);
          Config.setChromiumOpenGlRenderer("swangle");
          Config.setPixelFormat("yuv420p");
          EOF

          # --------------------------------------------------------------------
          # 2. Rich Comedy SFX + Formant Scream Synthesizer (scripts/generate-audio.mjs)
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/scripts/generate-audio.mjs
          import fs from "node:fs";
          import path from "node:path";

          const SR = 44100;
          const DURATION = 32;
          const TOTAL = SR * DURATION;
          const left = new Float32Array(TOTAL);
          const right = new Float32Array(TOTAL);
          const clamp = (v, min = -1, max = 1) => Math.max(min, Math.min(max, v));
          const addSample = (idx, l, r = l) => { if (idx >= 0 && idx < TOTAL) { left[idx] += l; right[idx] += r; } };

          let rngState = 1337420;
          const rand = () => { rngState = (rngState * 1664525 + 1013904223) >>> 0; return (rngState / 4294967296) * 2 - 1; };

          // Biquad Bandpass Resonator for Vocal Formant Screams & Cartoon Laughs
          function createBiquadBP(freq, Q) {
            const w0 = (2 * Math.PI * freq) / SR;
            const alpha = Math.sin(w0) / (2 * Q);
            const b0 = alpha, b1 = 0, b2 = -alpha;
            const a0 = 1 + alpha, a1 = -2 * Math.cos(w0), a2 = 1 - alpha;
            let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
            return (x) => {
              const y = (b0 / a0) * x + (b1 / a0) * x1 + (b2 / a0) * x2 - (a1 / a0) * y1 - (a2 / a0) * y2;
              x2 = x1; x1 = x; y2 = y1; y1 = y;
              return y;
            };
          }

          // Expressive Vocal Formant Synthesizer (Screams, Grunts, Yelps!)
          function addVocalFormant({
            startSec, durSec, f0Start, f0End, vibratoHz = 18, vibratoDepth = 20,
            formants = [[780, 6], [1300, 8], [2650, 10]], breath = 0.25, gain = 0.6
          }) {
            const s = Math.floor(startSec * SR), len = Math.floor(durSec * SR);
            const filters = formants.map(([f, q]) => createBiquadBP(f, q));
            let phase = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SR, prog = n / len;
              const f0 = f0Start + (f0End - f0Start) * prog + Math.sin(2 * Math.PI * vibratoHz * t) * vibratoDepth;
              phase += (2 * Math.PI * Math.max(80, f0)) / SR;
              // Harmonic glottal pulse + breath turbulence
              const glottal = Math.sin(phase) + 0.65 * Math.sin(phase * 2) + 0.42 * Math.sin(phase * 3) + 0.28 * Math.sin(phase * 4) + 0.18 * Math.sin(phase * 5);
              const exc = glottal * 0.55 + rand() * breath;
              const shaped = filters[0](exc) * 1.45 + filters[1](exc) * 1.05 + filters[2](exc) * 0.7;
              const env = Math.min(1, t * 28) * Math.min(1, (durSec - t) * 18);
              const v = Math.tanh(shaped * 1.8) * env * gain;
              addSample(s + n, v, v);
            }
          }

          // Sharp Comic Panic Gasp ("HUH?!")
          function addPanicGasp(timeSec, gain = 0.44) {
            const s = Math.floor(timeSec * SR), len = Math.floor(0.28 * SR);
            const bp1 = createBiquadBP(920, 4.5), bp2 = createBiquadBP(2150, 5.5);
            let ph = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SR, pr = n / len;
              ph += (2 * Math.PI * (340 + pr * 290)) / SR;
              const src = rand() * 0.85 + Math.sin(ph) * 0.35;
              const env = Math.sin(pr * Math.PI) * Math.exp(-pr * 1.2);
              const v = Math.tanh((bp1(src) * 1.3 + bp2(src) * 1.1) * 1.6) * env * gain;
              addSample(s + n, v, v);
            }
          }

          // Classic Cartoon Swallow / Gulp
          function addCartoonGulp(timeSec, gain = 0.45) {
            const s = Math.floor(timeSec * SR), len = Math.floor(0.32 * SR);
            let ph = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SR, pr = n / len;
              const freq = pr < 0.45 ? 520 - pr * 620 : 180 + (pr - 0.45) * 950;
              ph += (2 * Math.PI * freq) / SR;
              const env = Math.sin(pr * Math.PI);
              const v = Math.tanh(Math.sin(ph) * 1.5) * env * gain;
              addSample(s + n, v, v);
            }
          }

          // Thought / Speech Bubble Pop
          function addBubblePop(timeSec, baseFreq = 580, gain = 0.26) {
            const s = Math.floor(timeSec * SR), len = Math.floor(0.08 * SR);
            let ph = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SR, pr = n / len;
              ph += (2 * Math.PI * (baseFreq + pr * 980)) / SR;
              const v = Math.sin(ph) * Math.sin(pr * Math.PI) * gain;
              addSample(s + n, v, v);
            }
          }

          // Rubber Gym Sneaker Squeak
          function addShoeSqueak(timeSec, gain = 0.18) {
            const s = Math.floor(timeSec * SR), len = Math.floor(0.14 * SR);
            let ph = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SR, pr = n / len;
              ph += (2 * Math.PI * (2350 + Math.sin(pr * Math.PI * 3) * 420)) / SR;
              const v = Math.sin(ph) * Math.sin(pr * Math.PI) * gain;
              addSample(s + n, v, v);
            }
          }

          function addLofiSegment(startSec, endSec, gain = 0.24) {
            const chords = [
              [261.63, 329.63, 392.0, 493.88], [220.0, 261.63, 329.63, 392.0],
              [174.61, 220.0, 261.63, 329.63], [196.0, 246.94, 293.66, 349.23],
            ];
            const s = Math.floor(startSec * SR), e = Math.floor(endSec * SR);
            for (let i = s; i < e; i++) {
              const t = i / SR, lt = t - startSec;
              const ci = Math.floor(lt / 1.2) % chords.length, ct = lt % 1.2;
              const env = Math.min(1, ct * 18) * Math.exp(-ct * 1.45);
              let sig = 0;
              for (const f of chords[ci]) {
                const vib = 1 + 0.003 * Math.sin(2 * Math.PI * 4.5 * t);
                sig += Math.sin(2 * Math.PI * f * vib * t) * 0.65 + Math.sin(2 * Math.PI * f * 2 * vib * t) * 0.15 * Math.exp(-ct * 5);
              }
              const bt = lt % 0.6;
              const kick = Math.sin(2 * Math.PI * (110 * Math.exp(-bt * 28) + 42) * bt) * Math.exp(-bt * 12) * 0.45;
              const fade = Math.min(1, lt * 6, (endSec - t) * 10);
              const val = (sig * 0.25 * env + kick) * gain * Math.max(0, fade);
              addSample(i, val * 0.96, val * 1.04);
            }
          }

          function addWeightClank(timeSec, gain = 0.22) {
            const s = Math.floor(timeSec * SR), len = Math.floor(0.26 * SR);
            for (let n = 0; n < len; n++) {
              const t = n / SR, env = Math.min(1, t * 400) * Math.exp(-t * 24);
              const m = Math.sin(2 * Math.PI * 385 * t) * 0.55 + Math.sin(2 * Math.PI * 742 * t) * 0.38 + Math.sin(2 * Math.PI * 1290 * t) * 0.25 + rand() * 0.2 * Math.exp(-t * 45);
              addSample(s + n, m * env * gain, m * env * gain * 0.94);
            }
          }

          function addSnapWhoosh(timeSec, gain = 0.26) {
            const s = Math.floor(timeSec * SR), len = Math.floor(0.2 * SR);
            let lp = 0;
            for (let n = 0; n < len; n++) {
              const p = n / len; lp = lp * 0.72 + rand() * 0.28;
              const v = (lp * 0.9 + Math.sin(2 * Math.PI * (240 + p * 950) * (n / SR)) * 0.22) * Math.sin(p * Math.PI) * gain;
              addSample(s + n, v, v);
            }
          }

          function addVineBoom(timeSec, intensity = 0.82) {
            const s = Math.floor(timeSec * SR), len = Math.floor(1.35 * SR);
            let ph = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SR; ph += (2 * Math.PI * (142 * Math.exp(-t * 9.5) + 33)) / SR;
              const env = Math.min(1, t * 250) * Math.exp(-t * 2.95);
              const v = Math.tanh((Math.sin(ph) * 1.55 + Math.sin(ph * 2) * 0.32 + rand() * 0.16 * Math.exp(-t * 24)) * 1.45) * env * intensity;
              addSample(s + n, v, v);
            }
          }

          function addAnxiousHeartbeat(startSec, endSec, startBpm = 108, endBpm = 180, gain = 0.44) {
            let t = startSec;
            while (t < endSec) {
              const prog = (t - startSec) / Math.max(0.01, endSec - startSec);
              const bi = 60 / (startBpm + (endBpm - startBpm) * prog);
              for (const p of [{ o: 0, f0: 95, a: 1 }, { o: Math.min(0.14, bi * 0.3), f0: 118, a: 0.72 }]) {
                const ps = Math.floor((t + p.o) * SR), len = Math.floor(0.14 * SR);
                for (let n = 0; n < len; n++) {
                  const nt = n / SR;
                  const v = Math.sin(2 * Math.PI * (p.f0 * Math.exp(-nt * 16) + 38) * nt) * Math.min(1, nt * 160) * Math.exp(-nt * 22) * gain * p.a;
                  addSample(ps + n, v, v);
                }
              }
              t += bi;
            }
            const s = Math.floor(startSec * SR), e = Math.floor(endSec * SR);
            for (let i = s; i < e; i++) {
              const lt = (i - s) / SR, fade = Math.min(1, lt * 6, (endSec - startSec - lt) * 8);
              const v = Math.sin(2 * Math.PI * (440 + 38 * Math.sin(2 * Math.PI * 16 * lt)) * lt) * 0.04 * Math.max(0, fade);
              addSample(i, v, v);
            }
          }

          function addTensionDrone(startSec, endSec, gain = 0.3) {
            const s = Math.floor(startSec * SR), e = Math.floor(endSec * SR), dur = endSec - startSec;
            let p1 = 0, p2 = 0, p3 = 0;
            for (let i = s; i < e; i++) {
              const pr = (i - s) / (e - s);
              p1 += (2 * Math.PI * (65 + pr * 42)) / SR;
              p2 += (2 * Math.PI * (98 + pr * 68)) / SR;
              p3 += (2 * Math.PI * (131 + pr * 148)) / SR;
              const env = Math.min(1, pr * 5) * Math.min(1, (1 - pr) * 12) * (0.78 + 0.22 * Math.sin(2 * Math.PI * (3 + pr * 8) * (pr * dur)));
              const v = Math.tanh((Math.sin(p1) + 0.7 * Math.sin(p2) + 0.45 * Math.sin(p3)) * 1.35) * env * gain;
              addSample(i, v, v);
            }
          }

          function addWaterfall(startSec, endSec, gain = 0.34) {
            const s = Math.floor(startSec * SR), e = Math.floor(endSec * SR);
            let lp = 0;
            for (let i = s; i < e; i++) {
              const pr = (i - s) / (e - s); lp = lp * 0.82 + rand() * 0.18;
              const env = Math.min(1, pr * 12) * Math.min(1, (1 - pr) * 8);
              const v = (lp * 1.65 + Math.sin(2 * Math.PI * (310 + 160 * Math.sin(pr * 44)) * (i / SR)) * 0.14) * env * gain;
              addSample(i, v, v * 0.92);
            }
          }

          function addBarbellCrash(timeSec) {
            const s = Math.floor(timeSec * SR), len = Math.floor(1.1 * SR);
            let lp = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SR; lp = lp * 0.65 + rand() * 0.35;
              const thud = Math.sin(2 * Math.PI * (90 * Math.exp(-t * 16) + 28) * t) * Math.exp(-t * 5.5) * 0.78;
              const clang = (Math.sin(2 * Math.PI * 412 * t) + Math.sin(2 * Math.PI * 637 * t) + Math.sin(2 * Math.PI * 981 * t)) * Math.exp(-t * 7.5) * 0.24;
              const boing = Math.sin(2 * Math.PI * (180 + 95 * Math.sin(2 * Math.PI * 11 * t)) * t) * Math.exp(-t * 3.8) * 0.2;
              const v = clamp(thud + clang + lp * Math.
              exp(-t * 10) * 0.42 + boing);
              addSample(s + n, v, v);
            }
          }
              
              
          function addFeverDreamLaugh(startSec, endSec, gain = 0.32) {
            const s = Math.floor(startSec * SR), e = Math.floor(endSec * SR);
            const bp1 = createBiquadBP(850, 4.5), bp2 = createBiquadBP(1650, 6.0);
            let ph = 0;
            for (let i = s; i < e; i++) {
              const t = (i - s) / SR, pr = (i - s) / (e - s), hr = 7.2 + pr * 4.4;
              const he = Math.pow(Math.max(0, Math.sin(Math.PI * hr * t)), 1.6);
              ph += (2 * Math.PI * Math.max(120, (440 - pr * 95) + 175 * Math.sin(2 * Math.PI * (hr * 0.5) * t))) / SR;
              const raw = Math.sin(ph) + 0.6 * Math.sin(ph * 2.02) + 0.3 * Math.sin(ph * 3.01);
              const w = Math.tanh((bp1(raw) * 1.4 + bp2(raw) * 0.9 + raw * 0.35) * 1.3);
              const pan = 0.5 + 0.45 * Math.sin(2 * Math.PI * 3.2 * t);
              const v = w * he * gain * Math.max(0, Math.min(1, t * 8, (endSec - startSec - t) * 14));
              addSample(i, v * (1.4 - pan), v * (0.6 + pan));
            }
          }
    
          function addRecordScratch(timeSec) {
            const s = Math.floor(timeSec * SR), len = Math.floor(0.28 * SR);
            let ph = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SR; ph += (2 * Math.PI * (1400 - 1100 * Math.sin((t / 0.28) * Math.PI * 1.5))) / SR;
              const v = (Math.sin(ph) * 0.5 + rand() * 0.25) * Math.sin((n / len) * Math.PI) * 0.52;
              addSample(s + n, v, v);
            }
          }
    
          function addPoliteChime(timeSec) {
            for (const note of [{ o: 0, f: 880 }, { o: 0.14, f: 1174.66 }]) {
              const s = Math.floor((timeSec + note.o) * SR), len = Math.floor(0.65 * SR);
              for (let n = 0; n < len; n++) {
                const t = n / SR, env = Math.min(1, t * 90) * Math.exp(-t * 6.5);
                const v = (Math.sin(2 * Math.PI * note.f * t) + 0.25 * Math.sin(2 * Math.PI * note.f * 2 * t)) * env * 0.35;
                addSample(s + n, v, v);
              }
            }
          }
    
          function addCartoonZipOut(timeSec) {
            const s = Math.floor(timeSec * SR), len = Math.floor(0.52 * SR);
            let ph = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SR; ph += (2 * Math.PI * (2450 * Math.exp(-t * 6.4) + 120)) / SR;
              const v = Math.sin(ph) * Math.min(1, t * 65) * Math.exp(-t * 3.6) * 0.48 + rand() * Math.exp(-t * 9) * 0.26;
              addSample(s + n, v, v);
            }
            addVineBoom(timeSec + 0.22, 0.72);
          }
    
          // =====================================================================
          // FULL 32s COMEDY SFX & SCREAM ARRANGEMENT (Synced to 30fps / 960f)
          // =====================================================================
          addLofiSegment(0.0, 2.12, 0.24);
          addWeightClank(0.75, 0.2); addWeightClank(1.5, 0.22);
          addSnapWhoosh(1.92, 0.26); addVineBoom(2.15, 0.82);
          addPanicGasp(2.32, 0.46);                                       // GASP! Girl glared!
          addBubblePop(2.68, 560, 0.26);                                  // "Don't look..." bubble
          addAnxiousHeartbeat(2.45, 4.45, 112, 170, 0.44);
          addSnapWhoosh(4.32, 0.25); addVineBoom(4.45, 0.8);
          addShoeSqueak(5.3, 0.18); addWeightClank(6.1, 0.18);
          addSnapWhoosh(6.72, 0.26); addVineBoom(6.85, 0.78);
          addPanicGasp(7.05, 0.42);                                       // GASP! Buff Bro side-eye!
          addCartoonGulp(7.95, 0.46);                                     // Nervous cartoon GULP!
          addAnxiousHeartbeat(7.9, 10.6, 128, 195, 0.46);
          addBubblePop(9.15, 590, 0.26);                                  // "Are they judging..."
          addBubblePop(10.88, 660, 0.28);                                 // "ACT COOL!!"
          addTensionDrone(10.6, 17.8, 0.28);
          addVineBoom(12.55, 0.88);                                       // Giant plates SLAM!
          // Straining Lift Grunt ("HNNNGH!!")
          addVocalFormant({
            startSec: 12.95, durSec: 1.55, f0Start: 155, f0End: 215,
            vibratoHz: 24, vibratoDepth: 16, formants: [[520, 5], [1150, 7], [2400, 9]], breath: 0.35, gain: 0.56
          });
          // PEAK COMEDY SCREAM ("AAAAHHHHH!!") during Overhead Press & Tear Waterfall!
          addWaterfall(15.65, 18.0, 0.3);
          addVocalFormant({
            startSec: 15.72, durSec: 2.18, f0Start: 360, f0End: 540,
            vibratoHz: 20, vibratoDepth: 28, formants: [[820, 6], [1340, 8], [2750, 10]], breath: 0.25, gain: 0.74
          });
          // Crash Impact + Panicked Falling Yelp ("WAAAHH!!")
          addBarbellCrash(18.0);
          addVocalFormant({
            startSec: 18.06, durSec: 0.95, f0Start: 560, f0End: 290,
            vibratoHz: 16, vibratoDepth: 24, formants: [[760, 6], [1220, 8], [2600, 10]], breath: 0.22, gain: 0.66
          });
          addSnapWhoosh(19.55, 0.26); addVineBoom(19.65, 0.85);
          addFeverDreamLaugh(19.75, 23.9, 0.34);
          // Despair muffled scream inside Fever Dream
          addVocalFormant({
            startSec: 21.1, durSec: 1.85, f0Start: 420, f0End: 350,
            vibratoHz: 25, vibratoDepth: 32, formants: [[780, 5], [1300, 7], [2650, 9]], breath: 0.28, gain: 0.44
          });
          addRecordScratch(24.0);                                         // Snap back to reality!
          addLofiSegment(24.3, 28.9, 0.24);
          addWeightClank(26.1, 0.18);
          addVineBoom(27.0, 0.76);                                        // Empty barbell reveal!
          addBubblePop(27.22, 460, 0.26);                                 // "...it's literally empty."
          addShoeSqueak(28.45, 0.16);
          addPoliteChime(28.6);                                           // Helper Girl "NEED HELP?"
          addBubblePop(28.85, 720, 0.24);
          // Punchline: Rocket-Drop Slide Whistle + Doppler Vanishing Scream ("EEEEEEK—!")
          addCartoonZipOut(30.0);
          addVocalFormant({
            startSec: 29.98, durSec: 0.55, f0Start: 690, f0End: 260,
            vibratoHz: 26, vibratoDepth: 22, formants: [[580, 7], [2150, 9], [2950, 10]], breath: 0.18, gain: 0.58
          });
    
          const dataSize = TOTAL * 4, buffer = Buffer.alloc(44 + dataSize);
          buffer.write("RIFF", 0); buffer.writeUInt32LE(36 + dataSize, 4); buffer.write("WAVE", 8);
          buffer.write("fmt ", 12); buffer.writeUInt32LE(16, 16); buffer.writeUInt16LE(1, 20); buffer.writeUInt16LE(2, 22);
          buffer.writeUInt32LE(SR, 24); buffer.writeUInt32LE(SR * 4, 28); buffer.writeUInt16LE(4, 32); buffer.writeUInt16LE(16, 34);
          buffer.write("data", 36); buffer.writeUInt32LE(dataSize, 40);
          let off = 44;
          for (let i = 0; i < TOTAL; i++) {
            buffer.writeInt16LE(Math.round(clamp(Math.tanh(left[i] * 0.92)) * 32767), off);
