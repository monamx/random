                        fontFamily: "'DejaVu Sans', sans-serif", fontWeight: 900, fontSize: item.size, color: item.col,
                        WebkitTextStroke: `4px ${PALETTE.ink}`, textShadow: `6px 6px 0px ${PALETTE.ink}`, letterSpacing: "2px",
                      }}
                    >
                      {item.text}
                    </div>
                  ))}

                {showAngerMark && (
                  <svg viewBox="0 0 120 120" style={{ position: "absolute", top: 650, right: 235, width: 92, height: 92 }}>
                    <path d="M25,45 Q45,45 45,25 M75,25 Q75,45 95,45 M95,75 Q75,75 75,95 M45,95 Q45,75 25,75" fill="none" stroke="#DC3B2F" strokeWidth="11" strokeLinecap="round" />
                  </svg>
