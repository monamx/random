# ==============================================================================
# GitHub Actions Workflow: "Overthinker at the Gym" Funny 2D-Style 3D Animation (v3)
# Stack: Remotion 4 + Three.js (LatheGeometry + Smooth TubeGeometry Limbs + NoToneMapping)
#        + Synced Procedural Comedy WAV SFX
# Output: 1080x1920 (9:16 Vertical Short), 30fps, 32s (960 frames), H.264 MP4
# ==============================================================================

name: Render Funny Gym Overthinker Animation (Three.js + Remotion v3)

on:
  workflow_dispatch:
    inputs:
      quality_crf:
        description: "FFmpeg H.264 CRF quality (14=ultra, 18=high, 23=standard)"
        required: false
        default: "18"
      concurrency:
        description: "Remotion render worker concurrency (2-4 recommended on GHA)"
        required: false
        default: "2"
      include_audio:
        description: "Include synced procedural comedy SFX & lo-fi soundtrack"
        type: boolean
        required: false
        default: true

jobs:
  render-overthinker-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install headless Chromium, WebGL (SwiftShader/ANGLE) & FFmpeg libs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            fonts-noto-color-emoji \
            fonts-dejavu-core
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Scaffold Optimized Remotion + Three.js Project (v3)
        run: |
          rm -rf gym-anim
          mkdir -p gym-anim/src/scene gym-anim/src/components gym-anim/src/utils gym-anim/scripts gym-anim/public gym-anim/out

          # --------------------------------------------------------------------
          # 1. package.json
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/package.json
          {
            "name": "overthinker-at-the-gym-v3",
            "version": "3.0.0",
            "private": true,
            "scripts": {
              "audio": "node scripts/generate-audio.mjs",
              "render": "remotion render src/index.ts OverthinkerAtGym out/overthinker-at-gym.mp4"
            },
            "dependencies": {
              "@react-three/fiber": "8.17.10",
              "@remotion/bundler": "4.0.242",
              "@remotion/cli": "4.0.242",
              "@remotion/three": "4.0.242",
              "react": "18.3.1",
              "react-dom": "18.3.1",
              "remotion": "4.0.242",
              "three": "0.169.0"
            },
            "devDependencies": {
              "@types/react": "18.3.12",
              "@types/three": "0.169.0",
              "typescript": "5.6.3"
            }
          }
          EOF

          # --------------------------------------------------------------------
          # 2. tsconfig.json
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/tsconfig.json
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "ESNext",
              "moduleResolution": "bundler",
              "jsx": "react-jsx",
              "strict": false,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "forceConsistentCasingInFileNames": true,
              "lib": ["DOM", "ES2022"]
            },
            "include": ["src"]
          }
          EOF

          # --------------------------------------------------------------------
          # 3. remotion.config.ts
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/remotion.config.ts
          import { Config } from "@remotion/cli/config";

          Config.setVideoImageFormat("jpeg");
          Config.setOverwriteOutput(true);
          Config.setChromiumOpenGlRenderer("swangle");
          Config.setPixelFormat("yuv420p");
          EOF

          # --------------------------------------------------------------------
          # 4. Synced Procedural Comedy Audio Synthesizer (scripts/generate-audio.mjs)
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/scripts/generate-audio.mjs
          import fs from "node:fs";
          import path from "node:path";

          const SAMPLE_RATE = 44100;
          const DURATION = 32;
          const TOTAL_SAMPLES = SAMPLE_RATE * DURATION;

          const left = new Float32Array(TOTAL_SAMPLES);
          const right = new Float32Array(TOTAL_SAMPLES);

          const clamp = (v, min = -1, max = 1) => Math.max(min, Math.min(max, v));

          function addSample(idx, l, r = l) {
            if (idx >= 0 && idx < TOTAL_SAMPLES) {
              left[idx] += l;
              right[idx] += r;
            }
          }

          let rngState = 1337420;
          function rand() {
            rngState = (rngState * 1664525 + 1013904223) >>> 0;
            return (rngState / 4294967296) * 2 - 1;
          }

          function addLofiSegment(startSec, endSec, gain = 0.22) {
            const chords = [
              [261.63, 329.63, 392.0, 493.88],
              [220.0, 261.63, 329.63, 392.0],
              [174.61, 220.0, 261.63, 329.63],
              [196.0, 246.94, 293.66, 349.23],
            ];
            const startIdx = Math.floor(startSec * SAMPLE_RATE);
            const endIdx = Math.floor(endSec * SAMPLE_RATE);
            for (let i = startIdx; i < endIdx; i++) {
              const t = i / SAMPLE_RATE;
              const localT = t - startSec;
              const chordIdx = Math.floor(localT / 1.2) % chords.length;
              const chordTime = localT % 1.2;
              const env = Math.min(1, chordTime * 18) * Math.exp(-chordTime * 1.45);
              let sig = 0;
              for (const freq of chords[chordIdx]) {
                const vibrato = 1 + 0.003 * Math.sin(2 * Math.PI * 4.5 * t);
                sig += Math.sin(2 * Math.PI * freq * vibrato * t) * 0.65;
                sig += Math.sin(2 * Math.PI * freq * 2 * vibrato * t) * 0.15 * Math.exp(-chordTime * 5);
              }
              const beatT = localT % 0.6;
              const kick = Math.sin(2 * Math.PI * (110 * Math.exp(-beatT * 28) + 42) * beatT) * Math.exp(-beatT * 12) * 0.45;
              const fade = Math.min(1, localT * 6, (endSec - t) * 10);
              const val = (sig * 0.25 * env + kick) * gain * Math.max(0, fade);
              addSample(i, val * 0.96, val * 1.04);
            }
          }

          function addVineBoom(timeSec, intensity = 0.85) {
            const startIdx = Math.floor(timeSec * SAMPLE_RATE);
            const len = Math.floor(1.4 * SAMPLE_RATE);
            let phase = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SAMPLE_RATE;
              const freq = 145 * Math.exp(-t * 9.5) + 33;
              phase += (2 * Math.PI * freq) / SAMPLE_RATE;
              const env = Math.min(1, t * 250) * Math.exp(-t * 2.9);
              const raw = Math.sin(phase) * 1.6 + Math.sin(phase * 2) * 0.35 + rand() * 0.18 * Math.exp(-t * 22);
              const saturated = Math.tanh(raw * 1.5) * env * intensity;
              addSample(startIdx + n, saturated, saturated);
            }
          }

          function addPanicTicks(startSec, endSec, rateHz = 14, gain = 0.28) {
            for (let t = startSec; t < endSec; t += 1 / rateHz) {
              const startIdx = Math.floor(t * SAMPLE_RATE);
              const dur = Math.floor(0.045 * SAMPLE_RATE);
              const baseF = 550 + ((Math.floor(t * 37) % 5) * 110);
              for (let n = 0; n < dur; n++) {
                const nt = n / SAMPLE_RATE;
                const f = baseF + nt * 3200;
                const env = Math.exp(-nt * 65);
                const s = Math.sin(2 * Math.PI * f * nt) * env * gain;
                const pan = (Math.floor(t * 10) % 2 === 0) ? 0.8 : 1.2;
                addSample(startIdx + n, s * pan, s * (2 - pan));
              }
            }
          }

          function addTensionDrone(startSec, endSec, gain = 0.32) {
            const startIdx = Math.floor(startSec * SAMPLE_RATE);
            const endIdx = Math.floor(endSec * SAMPLE_RATE);
            const dur = endSec - startSec;
            let p1 = 0, p2 = 0, p3 = 0;
            for (let i = startIdx; i < endIdx; i++) {
              const prog = (i - startIdx) / (endIdx - startIdx);
              const f1 = 65 + prog * 45;
              const f2 = 98 + prog * 72;
              const f3 = 131 + prog * 160;
              p1 += (2 * Math.PI * f1) / SAMPLE_RATE;
              p2 += (2 * Math.PI * f2) / SAMPLE_RATE;
              p3 += (2 * Math.PI * f3) / SAMPLE_RATE;
              const env = Math.min(1, prog * 5) * Math.min(1, (1 - prog) * 12);
              const pulse = 0.75 + 0.25 * Math.sin(2 * Math.PI * (3 + prog * 9) * (prog * dur));
              const brass = Math.tanh((Math.sin(p1) + 0.7 * Math.sin(p2) + 0.5 * Math.sin(p3)) * 1.4);
              const v = brass * env * pulse * gain;
              addSample(i, v, v);
            }
          }

          function addWaterfall(startSec, endSec, gain = 0.35) {
            const startIdx = Math.floor(startSec * SAMPLE_RATE);
            const endIdx = Math.floor(endSec * SAMPLE_RATE);
            let lp = 0;
            for (let i = startIdx; i < endIdx; i++) {
              const prog = (i - startIdx) / (endIdx - startIdx);
              const n = rand();
              lp = lp * 0.82 + n * 0.18;
              const env = Math.min(1, prog * 12) * Math.min(1, (1 - prog) * 8);
              const bubble = Math.sin(2 * Math.PI * (320 + 180 * Math.sin(prog * 45)) * (i / SAMPLE_RATE)) * 0.15;
              const v = (lp * 1.7 + bubble) * env * gain;
              addSample(i, v, v * 0.92);
            }
          }

          function addBarbellCrash(timeSec) {
            const startIdx = Math.floor(timeSec * SAMPLE_RATE);
            const len = Math.floor(1.1 * SAMPLE_RATE);
            let lp = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SAMPLE_RATE;
              const thud = Math.sin(2 * Math.PI * (90 * Math.exp(-t * 16) + 28) * t) * Math.exp(-t * 5.5) * 0.8;
              const clang = (Math.sin(2 * Math.PI * 412 * t) + Math.sin(2 * Math.PI * 637 * t) + Math.sin(2 * Math.PI * 981 * t)) * Math.exp(-t * 7.5) * 0.25;
              lp = lp * 0.65 + rand() * 0.35;
              const crunch = lp * Math.exp(-t * 10) * 0.45;
              const boing = Math.sin(2 * Math.PI * (180 + 95 * Math.sin(2 * Math.PI * 11 * t)) * t) * Math.exp(-t * 3.8) * 0.22;
              const v = clamp(thud + clang + crunch + boing);
              addSample(startIdx + n, v, v);
            }
          }

          function addFeverDreamLaugh(startSec, endSec, gain = 0.34) {
            const startIdx = Math.floor(startSec * SAMPLE_RATE);
            const endIdx = Math.floor(endSec * SAMPLE_RATE);
            let phase = 0;
            for (let i = startIdx; i < endIdx; i++) {
              const t = (i - startIdx) / SAMPLE_RATE;
              const prog = (i - startIdx) / (endIdx - startIdx);
              const haRate = 7.5 + prog * 4.5;
              const haEnv = Math.pow(Math.max(0, Math.sin(Math.PI * haRate * t)), 1.6);
              const pitch = (480 - prog * 110) + 190 * Math.sin(2 * Math.PI * (haRate * 0.5) * t) + 70 * Math.sin(2 * Math.PI * 22 * t);
              phase += (2 * Math.PI * Math.max(120, pitch)) / SAMPLE_RATE;
              const wave = Math.tanh((Math.sin(phase) + 0.6 * Math.sin(phase * 2.02) + 0.3 * Math.sin(phase * 3.01)) * 1.3);
              const pan = 0.5 + 0.45 * Math.sin(2 * Math.PI * 3.2 * t);
              const fade = Math.min(1, t * 8, (endSec - startSec - t) * 14);
              const v = wave * haEnv * gain * Math.max(0, fade);
              addSample(i, v * (1.4 - pan), v * (0.6 + pan));
            }
          }

          function addRecordScratch(timeSec) {
            const startIdx = Math.floor(timeSec * SAMPLE_RATE);
            const len = Math.floor(0.28 * SAMPLE_RATE);
            let phase = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SAMPLE_RATE;
              const freq = 1400 - 1100 * Math.sin((t / 0.28) * Math.PI * 1.5);
              phase += (2 * Math.PI * freq) / SAMPLE_RATE;
              const env = Math.sin((n / len) * Math.PI);
              const v = (Math.sin(phase) * 0.5 + rand() * 0.25) * env * 0.5;
              addSample(startIdx + n, v, v);
            }
          }

          function addPoliteChime(timeSec) {
            const notes = [
              { offset: 0.0, freq: 880 },
              { offset: 0.14, freq: 1174.66 },
            ];
            for (const note of notes) {
              const startIdx = Math.floor((timeSec + note.offset) * SAMPLE_RATE);
              const len = Math.floor(0.65 * SAMPLE_RATE);
              for (let n = 0; n < len; n++) {
                const t = n / SAMPLE_RATE;
                const env = Math.min(1, t * 90) * Math.exp(-t * 6.5);
                const s = (Math.sin(2 * Math.PI * note.freq * t) + 0.25 * Math.sin(2 * Math.PI * note.freq * 2 * t)) * env * 0.35;
                addSample(startIdx + n, s, s);
              }
            }
          }

          function addCartoonZipOut(timeSec) {
            const startIdx = Math.floor(timeSec * SAMPLE_RATE);
            const len = Math.floor(0.55 * SAMPLE_RATE);
            let phase = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SAMPLE_RATE;
              const freq = 2400 * Math.exp(-t * 6.2) + 120;
              phase += (2 * Math.PI * freq) / SAMPLE_RATE;
              const env = Math.min(1, t * 60) * Math.exp(-t * 3.5);
              const whistle = Math.sin(phase) * env * 0.52;
              const whoosh = rand() * Math.exp(-t * 9) * 0.25;
              addSample(startIdx + n, whistle + whoosh, whistle + whoosh);
            }
            addVineBoom(timeSec + 0.22, 0.72);
          }

          // Synced Timeline Audio Arrangement (30fps / 960 frames)
          addLofiSegment(0.0, 2.25, 0.26);
          addVineBoom(2.2, 0.85);
          addPanicTicks(2.5, 4.7, 15, 0.24);
          addVineBoom(4.5, 0.82);
          addVineBoom(6.85, 0.78);
          addPanicTicks(7.9, 10.6, 17, 0.26);
          addTensionDrone(10.6, 17.8, 0.35);
          addVineBoom(12.6, 0.9);
          addWaterfall(15.6, 18.0, 0.38);
          addBarbellCrash(18.0);
          addVineBoom(19.65, 0.88);
          addFeverDreamLaugh(20.1, 23.9, 0.36);
          addRecordScratch(24.0);
          addLofiSegment(24.3, 28.9, 0.25);
          addVineBoom(27.0, 0.78);
          addPoliteChime(28.55);
          addCartoonZipOut(30.0);

          const dataSize = TOTAL_SAMPLES * 4;
          const buffer = Buffer.alloc(44 + dataSize);
          buffer.write("RIFF", 0);
          buffer.writeUInt32LE(36 + dataSize, 4);
          buffer.write("WAVE", 8);
          buffer.write("fmt ", 12);
          buffer.writeUInt32LE(16, 16);
          buffer.writeUInt16LE(1, 20);
          buffer.writeUInt16LE(2, 22);
          buffer.writeUInt32LE(SAMPLE_RATE, 24);
          buffer.writeUInt32LE(SAMPLE_RATE * 4, 28);
          buffer.writeUInt16LE(4, 32);
          buffer.writeUInt16LE(16, 34);
          buffer.write("data", 36);
          buffer.writeUInt32LE(dataSize, 40);

          let offset = 44;
          for (let i = 0; i < TOTAL_SAMPLES; i++) {
            const l = Math.round(clamp(Math.tanh(left[i] * 0.92)) * 32767);
            const r = Math.round(clamp(Math.tanh(right[i] * 0.92)) * 32767);
            buffer.writeInt16LE(l, offset);
            buffer.writeInt16LE(r, offset + 2);
            offset += 4;
          }

          const outPath = path.join("public", "soundtrack.wav");
          fs.writeFileSync(outPath, buffer);
          console.log(`Generated soundtrack WAV: ${outPath} (${(buffer.length / 1024 / 1024).toFixed(2)} MB)`);
          EOF

          # --------------------------------------------------------------------
          # 5. Clean Warm Doodle Palette & Motion Helpers (src/utils/animation.ts)
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/src/utils/animation.ts
          export const PALETTE = {
            // Warm cozy paper/comic background (matches Dood Happens vibe)
            bgPaper: "#F0E5C8",
            bgFloor: "#E5D6B2",
            bgFloorLine: "#D4C29A",
            bgWall: "#E6D9B8",
            bgWindow: "#FAF4E4",
            cityFar: "#EAE0C3",
            cityNear: "#DDD0AE",

            // Gym steel & weights (soft warm contrast so characters pop!)
            machineFrame: "#D5C59D",
            machinePad: "#9B8D73",
            barSteel: "#C6C2B7",
            plateDark: "#4B505B",
            plateRim: "#393D46",
            ink: "#1E1A17",

            // Bright crisp character colors (renders pure white with NoToneMapping!)
            skin: "#FFFFFF",
            blush: "#F6A7A7",
            heroShirt: "#FAFAF5",
            heroShorts: "#4A5568",
            heroShoes: "#FFFFFF",
            heroSole: "#596272",

            girlHair: "#2A2522",
            girlTop: "#EB8B82",
            girlLeggings: "#3B4252",
            girlTowel: "#FFFFFF",

            broHair: "#2A2522",
            broTank: "#424957",
            broShorts: "#2E333E",
            broShoes: "#F4F2EC",

            helperHair: "#5E4234",
            helperTop: "#7FC0AA",
            helperShorts: "#3B4252",

            sweatBlue: "#5BC8FF",
            sweatLight: "#BBEAFF",
            speedRed: "#D83C30",
          } as const;

          export function clamp01(v: number): number {
            return Math.max(0, Math.min(1, v));
          }

          export function segProgress(frame: number, start: number, end: number): number {
            return clamp01((frame - start) / Math.max(1, end - start));
          }

          export function smoothStep(t: number): number {
            const x = clamp01(t);
            return x * x * (3 - 2 * x);
          }

          export function easeOutBack(t: number): number {
            const x = clamp01(t);
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
          }

          export function lerp(a: number, b: number, t: number): number {
            return a + (b - a) * clamp01(t);
          }

          export function boilJitter(frame: number, seed: number, amp = 0.0018): number {
            const step = Math.floor(frame / 3);
            const raw = Math.sin(step * 12.9898 + seed * 78.233) * 43758.5453;
            return ((raw - Math.floor(raw)) * 2 - 1) * amp;
          }

          export function cameraShake(frame: number, intensity: number): [number, number, number] {
            if (intensity <= 0.0001) return [0, 0, 0];
            const x = Math.sin(frame * 2.71) * Math.cos(frame * 4.33) * intensity;
            const y = Math.cos(frame * 3.17) * Math.sin(frame * 5.19) * intensity;
            const r = Math.sin(frame * 3.89) * intensity * 0.08;
            return [x, y, r];
          }
          EOF

          # --------------------------------------------------------------------
          # 6. Smooth Sculpted 2D-Ink Primitives (src/scene/ToonMaterial.tsx)
          #    Includes SmoothTube (seamless rubber-hose limbs!) & SmoothLathe (organic torsos/hair!)
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/src/scene/ToonMaterial.tsx
          import React, { useEffect, useMemo } from "react";
          import * as THREE from "three";
          import { PALETTE, boilJitter } from "../utils/animation";

          let cachedGradientMap: THREE.DataTexture | null = null;

          export function useToonGradient(): THREE.DataTexture {
            return useMemo(() => {
              if (cachedGradientMap) return cachedGradientMap;
              // Soft 2-tone bright illustration shading (minimal dark shadow muddiness)
              const colors = new Uint8Array([228, 255]);
              const tex = new THREE.DataTexture(colors, 2, 1, THREE.RedFormat);
              tex.minFilter = THREE.NearestFilter;
              tex.magFilter = THREE.NearestFilter;
              tex.needsUpdate = true;
              cachedGradientMap = tex;
              return tex;
            }, []);
          }

          interface BaseInkProps {
            position?: [number, number, number];
            rotation?: [number, number, number];
            scale?: [number, number, number];
            color?: string;
            outline?: number;
            outlineColor?: string;
            frame?: number;
            seed?: number;
          }

          export const InkBox: React.FC<BaseInkProps & { args: [number, number, number] }> = ({
            args,
            position = [0, 0, 0],
            rotation = [0, 0, 0],
            scale = [1, 1, 1],
            color = PALETTE.machineFrame,
            outline = 0.013,
            outlineColor = PALETTE.ink,
            frame = 0,
            seed = 1,
          }) => {
            const grad = useToonGradient();
            const j = boilJitter(frame, seed, 0.0014);
            return (
              <group position={position} rotation={rotation} scale={scale}>
                <mesh>
                  <boxGeometry args={args} />
                  <meshToonMaterial color={color} gradientMap={grad} />
                </mesh>
                {outline > 0 && (
                  <mesh position={[j, -j, 0]}>
                    <boxGeometry args={[args[0] + outline * 2, args[1] + outline * 2, args[2] + outline * 2]} />
                    <meshBasicMaterial color={outlineColor} side={THREE.BackSide} />
                  </mesh>
                )}
              </group>
            );
          };

          export const InkSphere: React.FC<BaseInkProps & { args: [number, number?, number?] }> = ({
            args,
            position = [0, 0, 0],
            rotation = [0, 0, 0],
            scale = [1, 1, 1],
            color = PALETTE.skin,
            outline = 0.014,
            outlineColor = PALETTE.ink,
            frame = 0,
            seed = 2,
          }) => {
            const grad = useToonGradient();
            const [r, w = 26, h = 20] = args;
            const j = boilJitter(frame, seed, 0.0014);
            return (
              <group position={position} rotation={rotation} scale={scale}>
                <mesh>
                  <sphereGeometry args={[r, w, h]} />
                  <meshToonMaterial color={color} gradientMap={grad} />
                </mesh>
                {outline > 0 && (
                  <mesh position={[j, -j, 0]}>
                    <sphereGeometry args={[r + outline, w, h]} />
                    <meshBasicMaterial color={outlineColor} side={THREE.BackSide} />
                  </mesh>
                )}
              </group>
            );
          };

          export const InkCylinder: React.FC<BaseInkProps & { args: [number, number, number, number?] }> = ({
            args,
            position = [0, 0, 0],
            rotation = [0, 0, 0],
            scale = [1, 1, 1],
            color = PALETTE.skin,
            outline = 0.013,
            outlineColor = PALETTE.ink,
            frame = 0,
            seed = 3,
          }) => {
            const grad = useToonGradient();
            const [rt, rb, h, seg = 20] = args;
            const j = boilJitter(frame, seed, 0.0013);
            return (
              <group position={position} rotation={rotation} scale={scale}>
                <mesh>
                  <cylinderGeometry args={[rt, rb, h, seg]} />
                  <meshToonMaterial color={color} gradientMap={grad} />
                </mesh>
                {outline > 0 && (
                  <mesh position={[j, 0, 0]}>
                    <cylinderGeometry args={[rt + outline, rb + outline, h + outline * 1.1, seg]} />
                    <meshBasicMaterial color={outlineColor} side={THREE.BackSide} />
                  </mesh>
                )}
              </group>
            );
          };

          export const InkCapsule: React.FC<BaseInkProps & { args: [number, number, number?, number?] }> = ({
            args,
            position = [0, 0, 0],
            rotation = [0, 0, 0],
            scale = [1, 1, 1],
            color = PALETTE.skin,
            outline = 0.013,
            outlineColor = PALETTE.ink,
            frame = 0,
            seed = 4,
          }) => {
            const grad = useToonGradient();
            const [r, len, capSeg = 8, radSeg = 16] = args;
            const j = boilJitter(frame, seed, 0.0013);
            return (
              <group position={position} rotation={rotation} scale={scale}>
                <mesh>
                  <capsuleGeometry args={[r, len, capSeg, radSeg]} />
                  <meshToonMaterial color={color} gradientMap={grad} />
                </mesh>
                {outline > 0 && (
                  <mesh position={[j, -j, 0]}>
                    <capsuleGeometry args={[r + outline, len + outline * 0.2, capSeg, radSeg]} />
                    <meshBasicMaterial color={outlineColor} side={THREE.BackSide} />
                  </mesh>
                )}
              </group>
            );
          };

          // Smooth Continuous Curved Noodle Limb (ZERO broken elbow/knee seams!)
          export const SmoothTube: React.FC<{
            points: [number, number, number][];
            radius: number;
            color?: string;
            outline?: number;
            segments?: number;
            endCap?: boolean;
            startCap?: boolean;
          }> = ({
            points,
            radius,
            color = PALETTE.skin,
            outline = 0.013,
            segments = 18,
            endCap = true,
            startCap = true,
          }) => {
            const grad = useToonGradient();
            const key = points.map((p) => p.map((n) => n.toFixed(3)).join(",")).join("|");

            const { mainGeo, outGeo } = useMemo(() => {
              const vecs = points.map((p) => new THREE.Vector3(p[0], p[1], p[2]));
              const curve = new THREE.CatmullRomCurve3(vecs);
              return {
                mainGeo: new THREE.TubeGeometry(curve, segments, radius, 14, false),
                outGeo: outline > 0 ? new THREE.TubeGeometry(curve, segments, radius + outline, 14, false) : null,
              };
            }, [key, radius, outline, segments]);

            useEffect(() => {
              return () => {
                mainGeo.dispose();
                outGeo?.dispose();
              };
            }, [mainGeo, outGeo]);

            const first = points[0];
            const last = points[points.length - 1];

            return (
              <group>
                <mesh geometry={mainGeo}>
                  <meshToonMaterial color={color} gradientMap={grad} />
                </mesh>
                {outGeo && (
                  <mesh geometry={outGeo}>
                    <meshBasicMaterial color={PALETTE.ink} side={THREE.BackSide} />
                  </mesh>
                )}
                {startCap && (
                  <group position={first}>
                    <mesh>
                      <sphereGeometry args={[radius, 12, 10]} />
                      <meshToonMaterial color={color} gradientMap={grad} />
                    </mesh>
                    {outline > 0 && (
                      <mesh>
                        <sphereGeometry args={[radius + outline, 12, 10]} />
                        <meshBasicMaterial color={PALETTE.ink} side={THREE.BackSide} />
                      </mesh>
                    )}
                  </group>
                )}
                {endCap && (
                  <group position={last}>
                    <mesh>
                      <sphereGeometry args={[radius, 12, 10]} />
                      <meshToonMaterial color={color} gradientMap={grad} />
                    </mesh>
                    {outline > 0 && (
                      <mesh>
                        <sphereGeometry args={[radius + outline, 12, 10]} />
                        <meshBasicMaterial color={PALETTE.ink} side={THREE.BackSide} />
                      </mesh>
                    )}
                  </group>
                )}
              </group>
            );
          };

          // Smooth Organic Sculpted Torso / Hair / Shorts using LatheGeometry!
          export const SmoothLathe: React.FC<{
            profile: [number, number][]; // [radius, y] pairs from bottom to top
            position?: [number, number, number];
            rotation?: [number, number, number];
            scale?: [number, number, number];
            color?: string;
            outline?: number;
            radialSegments?: number;
          }> = ({
            profile,
            position = [0, 0, 0],
            rotation = [0, 0, 0],
            scale = [1, 1, 1],
            color = PALETTE.heroShirt,
            outline = 0.014,
            radialSegments = 24,
          }) => {
            const grad = useToonGradient();
            const key = profile.map((p) => `${p[0].toFixed(3)},${p[1].toFixed(3)}`).join("|");

            const { mainGeo, outGeo } = useMemo(() => {
              const pts = profile.map(([r, y]) => new THREE.Vector2(Math.max(0.001, r), y));
              const outPts = profile.map(([r, y], idx) => {
                const yShift = idx === 0 ? -outline * 0.7 : idx === profile.length - 1 ? outline * 0.7 : 0;
                return new THREE.Vector2(r <= 0.003 ? 0.001 : r + outline, y + yShift);
              });
              return {
                mainGeo: new THREE.LatheGeometry(pts, radialSegments),
                outGeo: outline > 0 ? new THREE.LatheGeometry(outPts, radialSegments) : null,
              };
            }, [key, outline, radialSegments]);

            useEffect(() => {
              return () => {
                mainGeo.dispose();
                outGeo?.dispose();
              };
            }, [mainGeo, outGeo]);

            return (
              <group position={position} rotation={rotation} scale={scale}>
                <mesh geometry={mainGeo}>
                  <meshToonMaterial color={color} gradientMap={grad} />
                </mesh>
                {outGeo && (
                  <mesh geometry={outGeo}>
                    <meshBasicMaterial color={PALETTE.ink} side={THREE.BackSide} />
                  </mesh>
                )}
              </group>
            );
          };
