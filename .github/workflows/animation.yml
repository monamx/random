                girlPos = [-0.82, -0.05, 1.38];
                girlRot = [0, 2.55, 0];
                broMode = "glare";
                broPos = [0.85, -0.05, 1.42];
                broRot = [0, -2.55, 0];
                heroPose = "grabbar";
                heroMood = frame < 350 ? "fakegrin" : "angry";
                heroBarPos = [0, 1.56, 0.08];
                cam = { pos: [0, 1.48, 3.05], target: [0, 1.42, 0.2], fov: 42, roll: 0, shake: 0.015 };
              } else {
                // MASSIVE imaginary barbell plates slam onto bar!
                const drop = easeOutBack(segProgress(frame, 375, 392));
                heroPose = "squatstrain";
                heroMood = "panic";
                heroTremble = 0.045;
                heroPlateScale = 2.15 * drop;
                heroBarPos = [0, 1.24, 0.08];
                heroBarBend = 0.14;
                cam = { pos: [0, 1.32, 4.15], target: [0, 1.22, 0.08], fov: 42, roll: 0, shake: 0.05 };
              }
            }
            // --- SHOT 6 (430 - 540): Buff Bro Spots Smugly -> Tear Waterfall Overhead Press ---
            else if (frame < 540) {
              heroSweat = true;
              broMode = "spot";
              broPos = [0.05, 0, -0.45];
              broRot = [0, 0, 0];
              heroPlateScale = 2.15;
              if (frame < 475) {
                heroPose = "squatstrain";
                heroMood = "panic";
                heroTremble = 0.055;
                heroBarPos = [0, 1.22, 0.1];
                heroBarBend = 0.16;
                cam = {
                  pos: [0.15, 1.38, lerp(4.1, 3.25, segProgress(frame, 430, 470))],
                  target: [0, 1.32, 0],
                  fov: 40,
                  roll: 0,
                  shake: 0.04,
                };
              } else {
                // PANIC OVERHEAD PRESS + ANIME WATERFALL!
                const liftT = easeOutBack(segProgress(frame, 475, 495));
                heroPose = "overheadpress";
                heroMood = "scream";
                heroWaterfall = true;
                heroTremble = 0.065;
                heroBarPos = [0, lerp(1.25, 2.38, liftT), 0.1];
                heroBarBend = 0.18;
                cam = { pos: [0, 1.52, 4.2], target: [0, 1.48, 0.05], fov: 44, roll: 0, shake: 0.075 };
              }
            }
            // --- SHOT 7 (540 - 615): Barbell Crash onto Buff Bro Lap + Girl Points & Laughs ---
            else if (frame < 615) {
              if (frame < 588) {
                broMode = "crushedunder";
                broPos = [0, 0, -0.15];
                broRot = [0, 0.18, 0];
                heroPose = "crushed";
                heroPos = [0.05, 0.05, 0.25];
                heroMood = "scream";
                heroTremble = 0.04;
                heroPlateScale = 2.15;
                heroBarPos = [0, 1.28 + Math.sin(frame * 0.9) * 0.04, 0.35];
                heroBarRot = [0, 0, 0.12];
                cam = { pos: [0.6, 1.45, 3.55], target: [0, 1.15, 0.15], fov: 42, roll: -0.12, shake: 0.06 };
              } else {
                // Close-up of Gym Girl laughing maniacally and pointing into lens
                girlMode = "pointlaugh";
                girlPos = [-0.25, 0, 0.2];
                girlRot = [0, 0.1, 0];
                cam = { pos: [-0.2, 1.48, 2.05], target: [-0.22, 1.42, 0.2], fov: 38, roll: 0.08, shake: 0.05 };
              }
            }
            // --- SHOT 8 (615 - 720): Trippy Fever-Dream Meltdown ---
            else if (frame < 720) {
              const t = segProgress(frame, 615, 720);
              feverIntensity = Math.min(1, t * 2.5);
              broMode = "crushedunder";
              broPos = [0, 0, -0.15];
              heroPose = "crushed";
              heroPos = [0.05, 0.05, 0.25];
              heroMood = "panic";
              heroMelt = 0.45 * Math.sin(frame * 0.45);
              heroTremble = 0.07;
              heroPlateScale = 2.15;
              heroBarPos = [0, 1.25, 0.35];
              heroBarRot = [0, 0, Math.sin(frame * 0.35) * 0.22];
              cam = {
                pos: [Math.sin(frame * 0.22) * 0.55, 1.42 + Math.cos(frame * 0.28) * 0.22, 3.2 - t * 0.55],
                target: [0, 1.32, 0.2],
                fov: 46 + Math.sin(frame * 0.5) * 5,
                roll: Math.sin(frame * 0.25) * 0.28,
                shake: 0.085,
              };
            }
            // --- SHOT 9 (720 - 850): Reality Snap! Nobody Watching -> EMPTY BARBELL Reveal ---
            else if (frame < 850) {
              heroPose = "realityempty";
              heroBarPos = [0, 1.54, 0.05];
              heroPlateScale = 0; // ZERO WEIGHTS!
              if (frame < 746) {
                // Overthinker eyes squeezed shut, then snaps open
                heroMood = frame < 735 ? "blink" : "pinprick";
                cam = { pos: [0, 1.65, 1.9], target: [0, 1.65, 0.1], fov: 34, roll: 0, shake: 0 };
              } else if (frame < 778) {
                // Reality check: Buff Bro peacefully squatting, completely ignoring him
                broMode = "squat";
                cam = { pos: [3.2, 1.42, 3.7], target: [3.6, 1.28, 0.35], fov: 40, roll: 0, shake: 0 };
              } else if (frame < 808) {
                // Reality check: Lat Pulldown Girl peacefully exercising
                girlMode = "pulldown";
                cam = { pos: [-3.1, 1.45, 3.45], target: [-3.35, 1.32, 0.25], fov: 40, roll: 0, shake: 0 };
              } else {
                // Dramatic zoom-out revealing empty barbell!
                const zoomOut = smoothStep(segProgress(frame, 808, 845));
                heroMood = "pinprick";
                cam = {
                  pos: [0, lerp(1.62, 1.42, zoomOut), lerp(2.0, 4.35, zoomOut)],
                  target: [0, lerp(1.62, 1.36, zoomOut), 0.1],
                  fov: 38,
                  roll: 0,
                  shake: frame >= 810 && frame <= 822 ? 0.04 : 0,
                };
              }
            }
            // --- SHOT 10 (850 - 960): Friendly Girl "NEED HELP?" -> Rocket Zip Exit! ---
            else {
              showHelper = true;
              const walkIn = smoothStep(segProgress(frame, 850, 878));
              helperPos = [lerp(2.2, 1.05, walkIn), 0, 0.22];
              heroPose = "realityempty";
              heroBarPos = [0, 1.54, 0.05];
              heroPlateScale = 0;
              heroMood = "pinprick";

              // At frame 900 (30.0s), Overthinker instantly rockets straight downward out of existence!
              if (frame >= 900) {
                const zipT = segProgress(frame, 900, 907);
                heroPos = [0, lerp(0, -5.5, zipT), 0.1];
                if (frame > 907) heroVisible = false;
                helperSurprised = true;
              }
              cam = {
                pos: [0.28, 1.42, 4.35],
                target: [0.28, 1.36, 0.12],
                fov: 38,
                roll: 0,
                shake: frame >= 900 && frame <= 914 ? 0.07 : 0,
              };
            }

            return (
              <>
                <color attach="background" args={[PALETTE.bgPaper]} />
                <ambientLight intensity={1.15} />
                <directionalLight position={[4, 8, 6]} intensity={0.85} />

                <CameraRig state={cam} frame={frame} />

                {/* Gym Background & Equipment */}
                <GymEnvironment frame={frame} pulldownProgress={pulldownVal} />

                {/* Buff Bro's permanent heavy barbell (visible when he squats at his rack) */}
                {(broMode === "squat" || broMode === "glare") && (
                  <Barbell
                    position={[broPos[0], 1.58 - broSquatVal * 0.34, broPos[2] - 0.08]}
                    rotation={[0, broRot[1], 0]}
                    plateScale={1.08}
                    frame={frame}
                  />
                )}

                {/* Overthinker's Barbell (empty in reality, gigantic in imagination) */}
                <Barbell
                  position={heroBarPos}
                  rotation={heroBarRot}
                  plateScale={heroPlateScale}
                  bend={heroBarBend}
                  frame={frame}
                />

                {/* Characters */}
                {heroVisible && (
                  <Overthinker
                    position={heroPos}
                    rotation={heroRot}
                    frame={frame}
                    pose={heroPose}
                    mood={heroMood}
                    sweating={heroSweat}
                    waterfall={heroWaterfall}
                    tremble={heroTremble}
                    meltFactor={heroMelt}
                  />
                )}

                <GymGirl
                  position={girlPos}
                  rotation={girlRot}
                  frame={frame}
                  mode={girlMode}
                  pulldownProgress={pulldownVal}
                />

                <BuffBro
                  position={broPos}
                  rotation={broRot}
                  frame={frame}
                  mode={broMode}
                  squatDepth={broSquatVal}
                />

                {showHelper && <HelperGirl position={helperPos} frame={frame} surprised={helperSurprised} />}

                {/* Fever-dream orbiting laughing faces */}
                <FloatingMockingFaces frame={frame} intensity={feverIntensity} />
              </>
            );
          };
          EOF

          # --------------------------------------------------------------------
          # 10. 2D Hand-Drawn Comic Overlay (src/components/ComicOverlay.tsx)
          #     "NEED HELP?" lettering, impact flashes, speed lines, sepia grain
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/src/components/ComicOverlay.tsx
          import React from "react";
          import { AbsoluteFill } from "remotion";
          import { PALETTE, boilJitter, segProgress } from "../utils/animation";

          export const ComicOverlay: React.FC<{ frame: number }> = ({ frame }) => {
            // Brief comic negative-flash impact frames on big Vine Booms
            const boomFrames = [67, 142, 207, 376, 541, 591, 810, 901];
            const isImpactFlash = boomFrames.some((bf) => frame === bf || frame === bf + 1);

            // Fever-dream wave wobble CSS filter during Shot 8
            const isFever = frame >= 615 && frame < 720;
            const feverHue = isFever ? Math.sin(frame * 0.45) * 18 : 0;

            // "NEED HELP?" floating comic lettering (Shot 10: frames 865-960)
            const showNeedHelp = frame >= 865;
            const needHelpPop = Math.min(1, segProgress(frame, 865, 874) * 1.15);
            const jx = boilJitter(frame, 99, 3.2);
            const jy = boilJitter(frame, 107, 3.2);

            // Rocket zip-out red/black vertical comic speed lines (frames 900-932)
            const showSpeedLines = frame >= 900 && frame <= 936;
            const speedFade = showSpeedLines ? Math.max(0, 1 - segProgress(frame, 912, 936)) : 0;

            // Anime panic radial action lines during extreme panic & overhead press
            const showActionLines =
              (frame >= 72 && frame <= 155) ||
              (frame >= 475 && frame <= 540) ||
              (frame >= 615 && frame <= 720);

            return (
              <AbsoluteFill style={{ pointerEvents: "none" }}>
                {/* Radial Manga Panic Action Lines */}
                {showActionLines && (
                  <svg viewBox="0 0 1080 1920" style={{ width: "100%", height: "100%", opacity: 0.24 }}>
                    {Array.from({ length: 28 }).map((_, i) => {
                      const angle = (i / 28) * Math.PI * 2 + (frame % 3) * 0.04;
                      const x1 = 540 + Math.cos(angle) * 430;
                      const y1 = 960 + Math.sin(angle) * 650;
                      const x2 = 540 + Math.cos(angle) * 1150;
                      const y2 = 960 + Math.sin(angle) * 1450;
                      return (
                        <line
                          key={i}
                          x1={x1}
                          y1={y1}
                          x2={x2}
                          y2={y2}
                          stroke={PALETTE.ink}
                          strokeWidth={i % 3 === 0 ? 7 : 3}
                        />
                      );
                    })}
                  </svg>
                )}

                {/* Vertical Rocket-Drop Speed Lines + Dust Puff (Punchline!) */}
                {showSpeedLines && (
                  <svg
                    viewBox="0 0 1080 1920"
                    style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: speedFade }}
                  >
                    <line x1="415" y1="620" x2="415" y2="1480" stroke={PALETTE.speedRed} strokeWidth="10" strokeLinecap="round" />
                    <line x1="452" y1="740" x2="452" y2="1520" stroke={PALETTE.ink} strokeWidth="6" strokeLinecap="round" />
                    <line x1="505" y1="690" x2="505" y2="1490" stroke={PALETTE.speedRed} strokeWidth="8" strokeLinecap="round" />
                    <ellipse
                      cx="460"
                      cy="1480"
                      rx={80 + (frame - 900) * 6}
                      ry={28 + (frame - 900) * 2}
                      fill="#FBFBF8"
                      stroke={PALETTE.ink}
                      strokeWidth="6"
                      opacity={Math.max(0, 1 - (frame - 900) / 18)}
                    />
                  </svg>
                )}

                {/* Hand-lettered "NEED HELP?" Comic Text */}
                {showNeedHelp && (
                  <div
                    style={{
                      position: "absolute",
                      right: 110,
                      top: 675,
                      transform: `translate(${jx}px, ${jy}px) scale(${needHelpPop}) rotate(-4deg)`,
                      fontFamily: "'DejaVu Sans', 'Comic Sans MS', sans-serif",
                      fontWeight: 900,
                      fontSize: 64,
                      lineHeight: 1.05,
                      color: PALETTE.ink,
                      textAlign: "center",
                      letterSpacing: "3px",
                      textShadow: "3px 3px 0px #FBFBF8",
                    }}
                  >
                    NEED
                    <br />
                    HELP?
                  </div>
                )}

                {/* Subtle Warm Paper Vignette & Fever Tint */}
                <div
                  style={{
                    position: "absolute",
                    inset: 0,
                    background:
                      "radial-gradient(circle at 50% 48%, rgba(0,0,0,0) 62%, rgba(72,56,28,0.22) 100%)",
                    filter: isFever ? `hue-rotate(${feverHue}deg)` : undefined,
                  }}
                />

                {/* Impact Frame Flash */}
                {isImpactFlash && (
                  <div
                    style={{
                      position: "absolute",
                      inset: 0,
                      backgroundColor: "rgba(255, 255, 255, 0.42)",
                      mixBlendMode: "difference",
                    }}
                  />
                )}
              </AbsoluteFill>
            );
          };
          EOF

          # --------------------------------------------------------------------
          # 11. Main Remotion Video Composition (src/Video.tsx)
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/src/Video.tsx
          import React from "react";
          import { AbsoluteFill, Audio, staticFile, useCurrentFrame, useVideoConfig } from "remotion";
          import { ThreeCanvas } from "@remotion/three";
          import { OverthinkerScene } from "./scene/OverthinkerScene";
          import { ComicOverlay } from "./components/ComicOverlay";
          import { PALETTE } from "./utils/animation";

          export interface VideoProps {
            includeAudio?: boolean;
          }

          export const OverthinkerVideo: React.FC<VideoProps> = ({ includeAudio = true }) => {
            const frame = useCurrentFrame();
            const { width, height, fps } = useVideoConfig();

            return (
              <AbsoluteFill style={{ backgroundColor: PALETTE.bgPaper }}>
                {includeAudio && <Audio src={staticFile("soundtrack.wav")} volume={1.0} />}
                <ThreeCanvas
                  width={width}
                  height={height}
                  shadows={false}
                  dpr={1}
                  camera={{ fov: 38, near: 0.1, far: 80, position: [0, 1.45, 4.4] }}
                >
                  <OverthinkerScene frame={frame} fps={fps} />
                </ThreeCanvas>
                <ComicOverlay frame={frame} />
              </AbsoluteFill>
            );
          };
          EOF

          # --------------------------------------------------------------------
          # 12. Remotion Root & Entrypoint (src/Root.tsx & src/index.ts)
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/src/Root.tsx
          import React from "react";
          import { Composition } from "remotion";
          import { OverthinkerVideo } from "./Video";

          export const RemotionRoot: React.FC = () => {
            const fps = Number(process.env.ANIM_FPS || 30);
            const includeAudio = process.env.INCLUDE_AUDIO !== "false";

            return (
              <Composition
                id="OverthinkerAtGym"
                component={OverthinkerVideo}
                durationInFrames={32 * fps}
                fps={fps}
                width={1080}
                height={1920}
                defaultProps={{ includeAudio }}
              />
            );
          };
          EOF

          cat << 'EOF' > gym-anim/src/index.ts
          import { registerRoot } from "remotion";
          import { RemotionRoot } from "./Root";

          registerRoot(RemotionRoot);
          EOF

      - name: Install Node Dependencies & Ensure Remotion Browser
        working-directory: gym-anim
        run: |
          npm install --legacy-peer-deps
          npx remotion browser ensure

      - name: Synthesize Synced Comedy SFX & Soundtrack WAV
        working-directory: gym-anim
        run: |
          node scripts/generate-audio.mjs

      - name: Render 1080x1920 Funny Animation MP4 (Three.js + Remotion)
        working-directory: gym-anim
        env:
          ANIM_FPS: ${{ github.event.inputs.fps || '30' }}
          INCLUDE_AUDIO: ${{ github.event.inputs.include_audio || 'true' }}
        run: |
          npx remotion render src/index.ts OverthinkerAtGym out/overthinker-at-gym.mp4 \
            --gl=swangle \
            --codec=h264 \
            --crf=${{ github.event.inputs.quality_crf || '18' }} \
            --concurrency=${{ github.event.inputs.concurrency || '2' }} \
            --log=info
          ls -lh out/overthinker-at-gym.mp4
          ffprobe -v error -show_format -show_streams out/overthinker-at-gym.mp4

      - name: Upload Rendered Animation MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: overthinker-at-gym-short-mp4
          path: gym-anim/out/overthinker-at-gym.mp4
          retention-days: 14
