# ==============================================================================
# GitHub Actions Workflow: "Overthinker at the Gym" Funny 2D-Style 3D Animation (v4)
# Stack: Remotion 4 + Three.js (Unlit Crisp 2D Ink + Smooth Tube/Lathe + Gym Props)
#        + Synced Heartbeat, Gym Foley & Procedural Comedy WAV SFX
# Output: 1080x1920 (9:16 Vertical Short), 30fps, 32s (960 frames), H.264 MP4
# ==============================================================================

name: Render Funny Gym Overthinker Animation (Three.js + Remotion v4)

on:
  workflow_dispatch:
    inputs:
      quality_crf:
        description: "FFmpeg H.264 CRF quality (14=ultra, 18=high, 23=standard)"
        required: false
        default: "18"
      concurrency:
        description: "Remotion render worker concurrency (2-4 recommended on GHA)"
        required: false
        default: "2"
      include_audio:
        description: "Include synced procedural comedy SFX, heartbeat & gym foley"
        type: boolean
        required: false
        default: true

jobs:
  render-overthinker-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install headless Chromium, WebGL (SwiftShader/ANGLE) & FFmpeg libs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            fonts-noto-color-emoji \
            fonts-dejavu-core
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Scaffold Optimized Remotion + Three.js Project (v4)
        run: |
          rm -rf gym-anim
          mkdir -p gym-anim/src/scene gym-anim/src/components gym-anim/src/utils gym-anim/scripts gym-anim/public gym-anim/out

          # --------------------------------------------------------------------
          # 1. package.json
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/package.json
          {
            "name": "overthinker-at-the-gym-v4",
            "version": "4.0.0",
            "private": true,
            "scripts": {
              "audio": "node scripts/generate-audio.mjs",
              "render": "remotion render src/index.ts OverthinkerAtGym out/overthinker-at-gym.mp4"
            },
            "dependencies": {
              "@react-three/fiber": "8.17.10",
              "@remotion/bundler": "4.0.242",
              "@remotion/cli": "4.0.242",
              "@remotion/three": "4.0.242",
              "react": "18.3.1",
              "react-dom": "18.3.1",
              "remotion": "4.0.242",
              "three": "0.169.0"
            },
            "devDependencies": {
              "@types/react": "18.3.12",
              "@types/three": "0.169.0",
              "typescript": "5.6.3"
            }
          }
          EOF

          # --------------------------------------------------------------------
          # 2. tsconfig.json
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/tsconfig.json
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "ESNext",
              "moduleResolution": "bundler",
              "jsx": "react-jsx",
              "strict": false,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "forceConsistentCasingInFileNames": true,
              "lib": ["DOM", "ES2022"]
            },
            "include": ["src"]
          }
          EOF

          # --------------------------------------------------------------------
          # 3. remotion.config.ts
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/remotion.config.ts
          import { Config } from "@remotion/cli/config";

          Config.setVideoImageFormat("jpeg");
          Config.setOverwriteOutput(true);
          Config.setChromiumOpenGlRenderer("swangle");
          Config.setPixelFormat("yuv420p");
          EOF

          # --------------------------------------------------------------------
          # 4. Synced Comedy SFX, Heartbeat & Gym Foley Synthesizer (scripts/generate-audio.mjs)
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/scripts/generate-audio.mjs
          import fs from "node:fs";
          import path from "node:path";

          const SAMPLE_RATE = 44100;
          const DURATION = 32;
          const TOTAL_SAMPLES = SAMPLE_RATE * DURATION;

          const left = new Float32Array(TOTAL_SAMPLES);
          const right = new Float32Array(TOTAL_SAMPLES);

          const clamp = (v, min = -1, max = 1) => Math.max(min, Math.min(max, v));

          function addSample(idx, l, r = l) {
            if (idx >= 0 && idx < TOTAL_SAMPLES) {
              left[idx] += l;
              right[idx] += r;
            }
          }

          let rngState = 1337420;
          function rand() {
            rngState = (rngState * 1664525 + 1013904223) >>> 0;
            return (rngState / 4294967296) * 2 - 1;
          }

          // 1. Dreamy Lo-Fi Electric Piano (Peaceful Gym BGM)
          function addLofiSegment(startSec, endSec, gain = 0.25) {
            const chords = [
              [261.63, 329.63, 392.0, 493.88],
              [220.0, 261.63, 329.63, 392.0],
              [174.61, 220.0, 261.63, 329.63],
              [196.0, 246.94, 293.66, 349.23],
            ];
            const startIdx = Math.floor(startSec * SAMPLE_RATE);
            const endIdx = Math.floor(endSec * SAMPLE_RATE);
            for (let i = startIdx; i < endIdx; i++) {
              const t = i / SAMPLE_RATE;
              const localT = t - startSec;
              const chordIdx = Math.floor(localT / 1.2) % chords.length;
              const chordTime = localT % 1.2;
              const env = Math.min(1, chordTime * 18) * Math.exp(-chordTime * 1.45);
              let sig = 0;
              for (const freq of chords[chordIdx]) {
                const vibrato = 1 + 0.003 * Math.sin(2 * Math.PI * 4.5 * t);
                sig += Math.sin(2 * Math.PI * freq * vibrato * t) * 0.65;
                sig += Math.sin(2 * Math.PI * freq * 2 * vibrato * t) * 0.15 * Math.exp(-chordTime * 5);
              }
              const beatT = localT % 0.6;
              const kick = Math.sin(2 * Math.PI * (110 * Math.exp(-beatT * 28) + 42) * beatT) * Math.exp(-beatT * 12) * 0.45;
              const fade = Math.min(1, localT * 6, (endSec - t) * 10);
              const val = (sig * 0.25 * env + kick) * gain * Math.max(0, fade);
              addSample(i, val * 0.96, val * 1.04);
            }
          }

          // 2. Gym Machine Weight-Stack Metallic Clank Foley
          function addWeightClank(timeSec, gain = 0.22) {
            const startIdx = Math.floor(timeSec * SAMPLE_RATE);
            const len = Math.floor(0.26 * SAMPLE_RATE);
            for (let n = 0; n < len; n++) {
              const t = n / SAMPLE_RATE;
              const env = Math.min(1, t * 400) * Math.exp(-t * 24);
              const metal =
                Math.sin(2 * Math.PI * 385 * t) * 0.55 +
                Math.sin(2 * Math.PI * 742 * t) * 0.38 +
                Math.sin(2 * Math.PI * 1290 * t) * 0.25 +
                rand() * 0.2 * Math.exp(-t * 45);
              const v = metal * env * gain;
              addSample(startIdx + n, v, v * 0.94);
            }
          }

          // 3. Sharp Camera Snap-Zoom Whoosh
          function addSnapWhoosh(timeSec, gain = 0.26) {
            const startIdx = Math.floor(timeSec * SAMPLE_RATE);
            const len = Math.floor(0.2 * SAMPLE_RATE);
            let lp = 0;
            for (let n = 0; n < len; n++) {
              const prog = n / len;
              lp = lp * 0.72 + rand() * 0.28;
              const env = Math.sin(prog * Math.PI);
              const sweep = Math.sin(2 * Math.PI * (240 + prog * 950) * (n / SAMPLE_RATE)) * 0.22;
              const v = (lp * 0.9 + sweep) * env * gain;
              addSample(startIdx + n, v, v);
            }
          }

          // 4. Classic Dramatic Vine Boom
          function addVineBoom(timeSec, intensity = 0.82) {
          const startIdx = Math.floor(timeSec * SAMPLE_RATE);
          const len = Math.floor(1.35 * SAMPLE_RATE);
          let phase = 0;
          for (let n = 0; n < len; n++) {
          const t = n / SAMPLE_RATE;
          const freq = 142 * Math.exp(-t * 9.5) + 33;
          phase += (2 * Math.PI * freq) / SAMPLE_RATE;
          const env = Math.min(1, t * 250) * Math.exp(-t * 2.95);
          const raw = Math.sin(phase) * 1.55 + Math.sin(phase * 2) * 0.32 + rand() * 0.16 * Math.exp(-t * 24);
          const saturated = Math.tanh(raw * 1.45) * env * intensity;
          addSample(startIdx + n, saturated, saturated);
          }
          }
          
          // 5. Rising Anxious Heartbeat (Lub-Dub) + Gentle Tremble Shimmer (replaces harsh loud blips!)
          function addAnxiousHeartbeat(startSec, endSec, startBpm = 105, endBpm = 175, gain = 0.42) {
            let t = startSec;
            while (t < endSec) {
              const prog = (t - startSec) / Math.max(0.01, endSec - startSec);
              const bpm = startBpm + (endBpm - startBpm) * prog;
              const beatInterval = 60 / bpm;
    
              // "Lub" thump + "Dub" thump
              const pulses = [
                { offset: 0, f0: 95, amp: 1.0 },
                { offset: Math.min(0.14, beatInterval * 0.3), f0: 118, amp: 0.72 },
              ];
              for (const p of pulses) {
                const pStart = Math.floor((t + p.offset) * SAMPLE_RATE);
                const len = Math.floor(0.14 * SAMPLE_RATE);
                for (let n = 0; n < len; n++) {
                  const nt = n / SAMPLE_RATE;
                  const f = p.f0 * Math.exp(-nt * 16) + 38;
                  const env = Math.min(1, nt * 160) * Math.exp(-nt * 22);
                  const thump = Math.sin(2 * Math.PI * f * nt) * env * gain * p.amp;
                  addSample(pStart + n, thump, thump);
                }
              }
              t += beatInterval;
            }
    
            // Subtle soft cartoon sweat-shimmer underneath
            const sIdx = Math.floor(startSec * SAMPLE_RATE);
            const eIdx = Math.floor(endSec * SAMPLE_RATE);
            for (let i = sIdx; i < eIdx; i++) {
              const lt = (i - sIdx) / SAMPLE_RATE;
              const fade = Math.min(1, lt * 6, (endSec - startSec - lt) * 8);
              const vibrato = 440 + 38 * Math.sin(2 * Math.PI * 16 * lt);
              const shimmer = Math.sin(2 * Math.PI * vibrato * lt) * 0.045 * Math.max(0, fade);
              addSample(i, shimmer, shimmer);
            }
          }
    
          // 6. Rising Anime Dread Brass Drone
          function addTensionDrone(startSec, endSec, gain = 0.3) {
            const startIdx = Math.floor(startSec * SAMPLE_RATE);
            const endIdx = Math.floor(endSec * SAMPLE_RATE);
            const dur = endSec - startSec;
            let p1 = 0, p2 = 0, p3 = 0;
            for (let i = startIdx; i < endIdx; i++) {
              const prog = (i - startIdx) / (endIdx - startIdx);
              p1 += (2 * Math.PI * (65 + prog * 42)) / SAMPLE_RATE;
              p2 += (2 * Math.PI * (98 + prog * 68)) / SAMPLE_RATE;
              p3 += (2 * Math.PI * (131 + prog * 148)) / SAMPLE_RATE;
              const env = Math.min(1, prog * 5) * Math.min(1, (1 - prog) * 12);
              const pulse = 0.78 + 0.22 * Math.sin(2 * Math.PI * (3 + prog * 8) * (prog * dur));
              const brass = Math.tanh((Math.sin(p1) + 0.7 * Math.sin(p2) + 0.45 * Math.sin(p3)) * 1.35);
              const v = brass * env * pulse * gain;
              addSample(i, v, v);
            }
          }
    
          // 7. Tear Waterfall Whoosh
          function addWaterfall(startSec, endSec, gain = 0.34) {
            const startIdx = Math.floor(startSec * SAMPLE_RATE);
            const endIdx = Math.floor(endSec * SAMPLE_RATE);
            let lp = 0;
            for (let i = startIdx; i < endIdx; i++) {
              const prog = (i - startIdx) / (endIdx - startIdx);
              lp = lp * 0.82 + rand() * 0.18;
              const env = Math.min(1, prog * 12) * Math.min(1, (1 - prog) * 8);
              const bubble = Math.sin(2 * Math.PI * (310 + 160 * Math.sin(prog * 44)) * (i / SAMPLE_RATE)) * 0.14;
              const v = (lp * 1.65 + bubble) * env * gain;
              addSample(i, v, v * 0.92);
            }
          }
    
          // 8. Heavy Barbell Crash + Comic Boing
          function addBarbellCrash(timeSec) {
            const startIdx = Math.floor(timeSec * SAMPLE_RATE);
            const len = Math.floor(1.1 * SAMPLE_RATE);
            let lp = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SAMPLE_RATE;
              const thud = Math.sin(2 * Math.PI * (90 * Math.exp(-t * 16) + 28) * t) * Math.exp(-t * 5.5) * 0.78;
              const clang = (Math.sin(2 * Math.PI * 412 * t) + Math.sin(2 * Math.PI * 637 * t) + Math.sin(2 * Math.PI * 981 * t)) * Math.exp(-t * 7.5) * 0.24;
              lp = lp * 0.65 + rand() * 0.35;
              const crunch = lp * Math.exp(-t * 10) * 0.42;
              const boing = Math.sin(2 * Math.PI * (180 + 95 * Math.sin(2 * Math.PI * 11 * t)) * t) * Math.exp(-t * 3.8) * 0.2;
              const v = clamp(thud + clang + crunch + boing);
              addSample(startIdx + n, v, v);
            }
          }
    
          // 9. Fever-Dream Surreal Mocking Laugh Chorus
          function addFeverDreamLaugh(startSec, endSec, gain = 0.32) {
            const startIdx = Math.floor(startSec * SAMPLE_RATE);
            const endIdx = Math.floor(endSec * SAMPLE_RATE);
            let phase = 0;
            for (let i = startIdx; i < endIdx; i++) {
              const t = (i - startIdx) / SAMPLE_RATE;
              const prog = (i - startIdx) / (endIdx - startIdx);
              const haRate = 7.2 + prog * 4.2;
              const haEnv = Math.pow(Math.max(0, Math.sin(Math.PI * haRate * t)), 1.6);
              const pitch = (470 - prog * 105) + 185 * Math.sin(2 * Math.PI * (haRate * 0.5) * t) + 65 * Math.sin(2 * Math.PI * 20 * t);
              phase += (2 * Math.PI * Math.max(120, pitch)) / SAMPLE_RATE;
              const wave = Math.tanh((Math.sin(phase) + 0.55 * Math.sin(phase * 2.02) + 0.28 * Math.sin(phase * 3.01)) * 1.25);
              const pan = 0.5 + 0.45 * Math.sin(2 * Math.PI * 3.2 * t);
              const fade = Math.min(1, t * 8, (endSec - startSec - t) * 14);
              const v = wave * haEnv * gain * Math.max(0, fade);
              addSample(i, v * (1.4 - pan), v * (0.6 + pan));
            }
          }
    
          // 10. Record Scratch (Reality Snap)
          function addRecordScratch(timeSec) {
            const startIdx = Math.floor(timeSec * SAMPLE_RATE);
            const len = Math.floor(0.28 * SAMPLE_RATE);
            let phase = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SAMPLE_RATE;
              const freq = 1400 - 1100 * Math.sin((t / 0.28) * Math.PI * 1.5);
              phase += (2 * Math.PI * freq) / SAMPLE_RATE;
              const env = Math.sin((n / len) * Math.PI);
              const v = (Math.sin(phase) * 0.5 + rand() * 0.25) * env * 0.5;
              addSample(startIdx + n, v, v);
            }
          }
    
          // 11. Cute Polite Chime ("NEED HELP?")
          function addPoliteChime(timeSec) {
            const notes = [
              { offset: 0.0, freq: 880 },
              { offset: 0.14, freq: 1174.66 },
            ];
            for (const note of notes) {
              const startIdx = Math.floor((timeSec + note.offset) * SAMPLE_RATE);
              const len = Math.floor(0.65 * SAMPLE_RATE);
              for (let n = 0; n < len; n++) {
                const t = n / SAMPLE_RATE;
                const env = Math.min(1, t * 90) * Math.exp(-t * 6.5);
                const s = (Math.sin(2 * Math.PI * note.freq * t) + 0.25 * Math.sin(2 * Math.PI * note.freq * 2 * t)) * env * 0.35;
                addSample(startIdx + n, s, s);
              }
            }
          }
    
          // 12. Cartoon Rocket-Drop Slide Whistle + Dust Poof Thud
          function addCartoonZipOut(timeSec) {
            const startIdx = Math.floor(timeSec * SAMPLE_RATE);
            const len = Math.floor(0.52 * SAMPLE_RATE);
            let phase = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SAMPLE_RATE;
              const freq = 2400 * Math.exp(-t * 6.4) + 120;
              phase += (2 * Math.PI * freq) / SAMPLE_RATE;
              const env = Math.min(1, t * 65) * Math.exp(-t * 3.6);
              const whistle = Math.sin(phase) * env * 0.5;
              const whoosh = rand() * Math.exp(-t * 9) * 0.28;
              addSample(startIdx + n, whistle + whoosh, whistle + whoosh);
            }
            addVineBoom(timeSec + 0.2, 0.72);
          }
    
          // === Timeline Audio Arrangement (Synced to 30fps / 960 frames) ===
          addLofiSegment(0.0, 2.15, 0.26);
          addWeightClank(0.75, 0.2);
          addWeightClank(1.5, 0.22);
          addSnapWhoosh(1.92, 0.26);
          addVineBoom(2.15, 0.82);                       // Shot 1 -> Glare snap
          addAnxiousHeartbeat(2.4, 4.45, 110, 165, 0.44);// Shot 2 -> Heartbeat panic!
          addSnapWhoosh(4.32, 0.25);
          addVineBoom(4.45, 0.8);                        // Angry Girl flash cut
          addSnapWhoosh(6.72, 0.26);
          addVineBoom(6.85, 0.78);                       // Shot 3 -> Buff Bro side-eye
          addAnxiousHeartbeat(7.85, 10.6, 125, 190, 0.48);// Shot 4 -> Melting + shy 👉👈
          addTensionDrone(10.6, 17.8, 0.32);             // Shot 5-6 -> Imagined judgment + lift
          addVineBoom(12.55, 0.88);                      // Giant plates slam
          addWaterfall(15.65, 18.0, 0.35);               // Overhead press tear waterfall
          addBarbellCrash(18.0);                         // Shot 7 -> Barbell crash
          addSnapWhoosh(19.55, 0.26);
          addVineBoom(19.65, 0.85);                      // Girl laughs & points cut
          addFeverDreamLaugh(20.1, 23.9, 0.34);          // Shot 8 -> Spiral fever dream
          addRecordScratch(24.0);                        // Shot 9 -> Snap back to reality!
          addLofiSegment(24.3, 28.9, 0.25);
          addWeightClank(26.1, 0.18);
          addVineBoom(27.0, 0.76);                       // Empty barbell zoom-out reveal
          addPoliteChime(28.55);                         // Shot 10 -> "NEED HELP?"
          addCartoonZipOut(30.0);                        // Rocket zip exit punchline!
    
          const dataSize = TOTAL_SAMPLES * 4;
          const buffer = Buffer.alloc(44 + dataSize);
          buffer.write("RIFF", 0);
          buffer.writeUInt32LE(36 + dataSize, 4);
          buffer.write("WAVE", 8);
          buffer.write("fmt ", 12);
          buffer.writeUInt32LE(16, 16);
          buffer.writeUInt16LE(1, 20);
          buffer.writeUInt16LE(2, 22);
          buffer.writeUInt32LE(SAMPLE_RATE, 24);
          buffer.writeUInt32LE(SAMPLE_RATE * 4, 28);
          buffer.writeUInt16LE(4, 32);
          buffer.writeUInt16LE(16, 34);
          buffer.write("data", 36);
          buffer.writeUInt32LE(dataSize, 40);
    
          let offset = 44;
          for (let i = 0; i < TOTAL_SAMPLES; i++) {
            const l = Math.round(clamp(Math.tanh(left[i] * 0.92)) * 32767);
            const r = Math.round(clamp(Math.tanh(right[i] * 0.92)) * 32767);
            buffer.writeInt16LE(l, offset);
            buffer.writeInt16LE(r, offset + 2);
            offset += 4;
          }
    
          const outPath = path.join("public", "soundtrack.wav");
          fs.writeFileSync(outPath, buffer);
          console.log(`Generated v4 soundtrack WAV: ${outPath} (${(buffer.length / 1024 / 1024).toFixed(2)} MB)`);
          EOF
    
          # --------------------------------------------------------------------
          # 5. Vibrant 2D Illustration Palette & Motion Helpers (src/utils/animation.ts)
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/src/utils/animation.ts
          export const PALETTE = {
            // Warm comic studio background
            bgPaper: "#F2E7CA",
            bgFloor: "#E7D9B4",
            bgFloorLine: "#D7C59A",
            bgWall: "#ECE0C0",
            bgWindow: "#FCF7EA",
            cityFar: "#E9DFC4",
            cityNear: "#DDD0AE",
    
            // Gym equipment & rubber flooring
            rubberMat: "#3B4049",
            rubberMatEdge: "#2A2E35",
            mirrorGlass: "#DCE9EE",
            mirrorGlint: "#FFFFFF",
            machineFrame: "#D8C79E",
            machineShadow: "#C2B087",
            machinePad: "#8E7E66",
            barSteel: "#CFD0D4",
            plateDark: "#454B57",
            plateRim: "#333842",
            lampShade: "#464B55",
            lampGlow: "#FFF7D1",
            ink: "#1B1715",
    
            // Bright crisp 2D doodle character colors (100% unlit -> zero muddy gray!)
            skin: "#FFFDF9",
            blush: "#F99E9E",
            sockWhite: "#FFFFFF",
    
            // Overthinker: distinct pastel sky-blue tee + dark collar so he NEVER looks shirtless!
            heroShirt: "#D7E8F7",
            heroShirtTrim: "#7CA4C7",
            heroShorts: "#4A566B",
            heroShoes: "#FFFFFF",
            heroSole: "#535E70",
    
            // Gym Girl: coral athletic top + slate leggings + crisp white towel
            girlHair: "#2A2421",
            girlTop: "#F08278",
            girlTopTrim: "#CC6158",
            girlLeggings: "#3B4354",
            girlTowel: "#FFFFFF",
    
            // Buff Bro: charcoal gym tank + red headband + navy shorts
            broHair: "#282320",
            broHeadband: "#DF4E42",
            broTank: "#444C5C",
            broTankTrim: "#2E3440",
            broShorts: "#2C3340",
            broShoes: "#F7F5EE",
    
            // Helper Girl: mint athletic top + chestnut bob hair
            helperHair: "#5E3F30",
            helperTop: "#7DC4AE",
            helperTopTrim: "#5AA08B",
            helperShorts: "#3D4657",
    
            sweatBlue: "#54C7FF",
            sweatLight: "#C7EEFF",
            dreadPurple: "#6E5A8A",
            speedRed: "#DC3B2F",
            feverBg: "#241322",
            feverSpiral: "#6B1D36",
          } as const;
    
          export function clamp01(v: number): number {
            return Math.max(0, Math.min(1, v));
          }
    
          export function segProgress(frame: number, start: number, end: number): number {
            return clamp01((frame - start) / Math.max(1, end - start));
          }
    
          export function smoothStep(t: number): number {
            const x = clamp01(t);
            return x * x * (3 - 2 * x);
          }
    
          export function easeOutBack(t: number): number {
            const x = clamp01(t);
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
          }
    
          export function lerp(a: number, b: number, t: number): number {
            return a + (b - a) * clamp01(t);
          }
    
          export function boilJitter(frame: number, seed: number, amp = 0.0016): number {
            const step = Math.floor(frame / 3);
            const raw = Math.sin(step * 12.9898 + seed * 78.233) * 43758.5453;
            return ((raw - Math.floor(raw)) * 2 - 1) * amp;
          }
    
          export function cameraShake(frame: number, intensity: number): [number, number, number] {
            if (intensity <= 0.0001) return [0, 0, 0];
            const x = Math.sin(frame * 2.71) * Math.cos(frame * 4.33) * intensity;
            const y = Math.cos(frame * 3.17) * Math.sin(frame * 5.19) * intensity;
            const r = Math.sin(frame * 3.89) * intensity * 0.075;
            return [x, y, r];
          }
    
          // Natural cartoon eye blink trigger (returns true for 3 frames every ~75 frames)
          export function isNaturalBlink(frame: number, offset = 0): boolean {
            const cycle = (frame + offset) % 78;
            return cycle >= 74;
          }
