            const { camera } = useThree();
            useLayoutEffect(() => {
              const [sx, sy, sr] = cameraShake(frame, state.shake);
              camera.position.set(state.pos[0] + sx, state.pos[1] + sy, state.pos[2]);
              camera.lookAt(state.target[0], state.target[1], state.target[2]);
              camera.rotation.z += state.roll + sr;
              if (camera instanceof THREE.PerspectiveCamera) {
                camera.fov = state.fov;
                camera.updateProjectionMatrix();
              }
            }, [camera, state, frame]);
            return null;
          };

          const FeverSpiralBackdrop: React.FC<{ frame: number }> = ({ frame }) => (
            <group position={[0, 1.6, -2.5]} rotation={[0, 0, frame * 0.08]}>
              {Array.from({ length: 16 }).map((_, i) => (
                <mesh key={i} rotation={[0, 0, (i / 16) * Math.PI * 2]}>
                  <ringGeometry args={[0.1, 14, 1, 1, 0, Math.PI / 16]} />
                  <meshBasicMaterial color={i % 2 === 0 ? PALETTE.feverSpiral : "#3D1229"} />
                </mesh>
              ))}
              {[1.2, 2.5, 4.0, 5.8].map((r, i) => (
                <mesh key={i} position={[0, 0, 0.05]}>
                  <ringGeometry args={[r, r + 0.14, 36]} />
                  <meshBasicMaterial color="#9E2A47" transparent opacity={0.45} />
                </mesh>
              ))}
            </group>
          );

          export const OverthinkerScene: React.FC<{ frame: number; fps: number }> = ({ frame }) => {
            const pulldownRep = 0.5 - 0.5 * Math.cos(frame * 0.14);
            const broSquatRep = 0.5 - 0.5 * Math.cos(frame * 0.11);

            let cam: CameraState = { pos: [0, 1.45, 6.2], target: [0, 1.32, 0], fov: 54, roll: 0, shake: 0 };

            let girlMode: "pulldown" | "glare" | "judge" | "pointlaugh" = "pulldown";
            let girlPos: [number, number, number] = [-5.18, 0, 0.06];
            let girlRot: [number, number, number] = [0, Math.PI / 2 + 0.16, 0];
            let girlHeadYaw: number | undefined = undefined;
            let pulldownVal = pulldownRep;

            let broMode: "squat" | "glare" | "spot" | "crushedunder" = "squat";
            let broPos: [number, number, number] = [4.8, 0, 0.1];
            let broRot: [number, number, number] = [0, -0.18, 0];
            let broHeadYaw: number | undefined = undefined;
            let broSquatVal = broSquatRep;

            let heroPos: [number, number, number] = [0, 0, 0.12];
            let heroRot: [number, number, number] = [0, 0, 0];
            let heroScale: [number, number, number] = [1, 1, 1];
            let heroPose: React.ComponentProps<typeof Overthinker>["pose"] = "hunch";
            let heroMood: MoodType = "panic";
            let heroSweat = false, heroWaterfall = false, heroTremble = 0, heroMelt = 0;
            let heroVisible = true, showHeroBar = true;

            let heroBarPos: [number, number, number] = [0, 1.51, 0.08];
            let heroBarRot: [number, number, number] = [0, 0, 0];
            let heroPlateScale = 0, heroBarBend = 0;

            let feverIntensity = 0, isFeverBg = false;
            let showHelper = false, helperPos: [number, number, number] = [1.15, 0, 0.65], helperSurprised = false;

            // SHOT 1 (0 - 72)
            if (frame < 72) {
              const glareT = segProgress(frame, 58, 67);
              if (frame < 58) {
                girlMode = "pulldown";
                girlHeadYaw = frame >= 53 ? lerp(0, -0.35, segProgress(frame, 53, 58)) : 0;
                cam = { pos: [-4.65, 1.52, 5.7], target: [-4.65, 1.38, 0.0], fov: 54, roll: 0, shake: 0 };
              } else {
                girlMode = "glare"; girlHeadYaw = -1.73; pulldownVal = 0.06;
                cam = {
                  pos: [lerp(-4.65, -5.12, glareT), lerp(1.52, 1.54, glareT), lerp(5.7, 3.25, easeOutBack(glareT))],
                  target: [-5.18, 1.5, 0.06], fov: 48, roll: 0, shake: frame >= 65 ? 0.035 : 0,
                };
              }
            }
            // SHOT 2 (72 - 155)
            else if (frame < 155) {
              heroPose = "hunch"; heroMood = "panic"; heroSweat = true; heroTremble = 0.02;
              if (frame < 130) {
                cam = { pos: [0, 1.38, lerp(5.8, 4.9, segProgress(frame, 72, 130))], target: [0, 1.26, 0.12], fov: 54, roll: 0, shake: 0.025 };
              } else {
                girlMode = "glare"; girlHeadYaw = -1.73; pulldownVal = 0.06;
                cam = { pos: [-5.12, 1.54, 2.95], target: [-5.18, 1.52, 0.06], fov: 46, roll: -0.05, shake: 0.048 };
              }
            }
            // SHOT 3 (155 - 235)
            else if (frame < 235) {
              if (frame < 204) {
                broMode = "squat";
                cam = { pos: [4.75, 1.44, 6.2], target: [4.8, 1.3, 0.1], fov: 54, roll: 0, shake: 0 };
              } else {
                broMode = "glare"; broSquatVal = 0.72; broHeadYaw = 0.18;
                cam = { pos: [4.78, 1.46, lerp(5.8, 3.45, easeOutBack(segProgress(frame, 204, 214)))], target: [4.8, 1.52, 0.1], fov: 48, roll: 0.04, shake: 0.038 };
              }
            }
            // SHOT 4 (235 - 320)
            else if (frame < 320) {
              heroSweat = true;
              if (frame < 272) {
                heroPose = "hunch"; heroMood = "melt"; heroMelt = smoothStep(segProgress(frame, 238, 266)); heroTremble = 0.015;
                cam = { pos: [0, 1.52, 4.2], target: [0, 1.44, 0.12], fov: 50, roll: 0, shake: 0.016 };
              } else {
                heroPose = "shy"; heroMood = "shy"; heroTremble = 0.02;
                cam = { pos: [0, 1.34, 5.1], target: [0, 1.24, 0.12], fov: 54, roll: 0, shake: 0.022 };
              }
            }
            // SHOT 5 (320 - 430)
            else if (frame < 430) {
              heroSweat = true;
              if (frame < 375) {
                girlMode = "judge"; girlPos = [-0.98, 0, 1.38]; girlRot = [0, 0.42, 0]; girlHeadYaw = -0.3;
                broMode = "glare"; broPos = [1.04, 0, 1.42]; broRot = [0, -0.45, 0]; broHeadYaw = 0.3; broSquatVal = 0;
                heroPose = "grabbar"; heroMood = frame < 350 ? "fakegrin" : "angry"; heroBarPos = [0, 1.51, 0.08]; heroPlateScale = 0;
                cam = { pos: [0, 1.44, 6.8], target: [0, 1.3, 0.3], fov: 55, roll: 0, shake: 0.014 };
              } else {
                heroPose = "squatstrain"; heroMood = "panic"; heroTremble = 0.038;
                heroPlateScale = 1.65 * easeOutBack(segProgress(frame, 375, 392));
                heroBarPos = [0, 1.24, 0.08]; heroBarBend = 0.12;
                cam = { pos: [0, 1.36, 7.4], target: [0, 1.22, 0.08], fov: 56, roll: 0, shake: 0.044 };
              }
            }
            // SHOT 6 (430 - 540)
            else if (frame < 540) {
              heroSweat = true;
              broMode = "spot"; broPos = [0.24, 0, -0.64]; broRot = [0, -0.1, 0]; broHeadYaw = 0.08; broSquatVal = 0;
              heroPlateScale = 1.65;
              if (frame < 475) {
                heroPose = "squatstrain"; heroMood = "panic"; heroTremble = 0.042; heroBarPos = [0, 1.24, 0.12]; heroBarBend = 0.14;
                cam = { pos: [0.1, 1.42, lerp(7.4, 6.3, segProgress(frame, 430, 470))], target: [0.05, 1.3, 0], fov: 55, roll: 0, shake: 0.032 };
              } else {
                heroPose = "overheadpress"; heroMood = "scream"; heroWaterfall = true; heroTremble = 0.048;
                heroBarPos = [0, lerp(1.24, 2.28, easeOutBack(segProgress(frame, 475, 495))), 0.12]; heroBarBend = 0.15;
                cam = { pos: [0, 1.48, 7.5], target: [0, 1.4, 0.05], fov: 56, roll: 0, shake: 0.054 };
              }
            }
            // SHOT 7 (540 - 615): FIXED barbell crash clearance (zero clipping into Overthinker!)
            else if (frame < 615) {
              if (frame < 588) {
                broMode = "crushedunder"; broPos = [-0.66, 0, -0.25]; broRot = [0, 0.2, 0];
                heroPose = "tumbled"; heroPos = [0.76, 0, 0.62]; heroRot = [0, -0.28, 0]; heroMood = "scream"; heroTremble = 0.032;
                heroPlateScale = 1.48;
                heroBarPos = [-0.64, 1.48 + Math.sin(frame * 0.9) * 0.03, 0.08];
                heroBarRot = [0, 0, 0.14]; // tilts UP away from Overthinker on the right!
                cam = { pos: [0.05, 1.46, 7.15], target: [0.04, 1.2, 0.15], fov: 55, roll: -0.06, shake: 0.048 };
              } else {
                heroVisible = false; showHeroBar = false;
                girlMode = "pointlaugh"; girlPos = [0, 0, 0.35]; girlRot = [0, 0, 0]; girlHeadYaw = 0;
                cam = { pos: [0, 1.38, 4.25], target: [0, 1.32, 0.35], fov: 52, roll: 0.05, shake: 0.04 };
              }
            }
            // SHOT 8 (615 - 720): Spiral Fever-Dream Meltdown
            else if (frame < 720) {
              const t = segProgress(frame, 615, 720);
              feverIntensity = Math.min(1, t * 2.5); isFeverBg = true;
              heroPose = "tumbled"; heroPos = [0, 0, 0.22]; heroMood = "panic"; heroSweat = true;
              heroMelt = 0.24 * Math.sin(frame * 0.45); heroTremble = 0.052;
              heroPlateScale = 1.55; heroBarPos = [0, 1.54, -0.35]; heroBarRot = [0, 0, Math.sin(frame * 0.35) * 0.22];
              cam = {
                pos: [Math.sin(frame * 0.22) * 0.38, 1.46 + Math.cos(frame * 0.28) * 0.16, 6.9 - t * 0.4],
                target: [0, 1.44, 0.2], fov: 56 + Math.sin(frame * 0.45) * 3.5, roll: Math.sin(frame * 0.24) * 0.18, shake: 0.058,
              };
            }
            // SHOT 9 (720 - 850): Reality Snap -> Wide Empty Barbell Reveal
            else if (frame < 850) {
              heroPose = "realityempty"; heroBarPos = [0, 1.51, 0.08]; heroPlateScale = 0;
              if (frame < 746) {
                heroMood = frame < 735 ? "blink" : "pinprick";
                cam = { pos: [0, 1.72, 3.25], target: [0, 1.68, 0.12], fov: 48, roll: 0, shake: 0 };
              } else if (frame < 778) {
                broMode = "squat";
                cam = { pos: [4.75, 1.44, 6.2], target: [4.8, 1.3, 0.1], fov: 54, roll: 0, shake: 0 };
              } else if (frame < 808) {
                girlMode = "pulldown"; girlHeadYaw = 0;
                cam = { pos: [-4.65, 1.52, 5.7], target: [-4.65, 1.38, 0.0], fov: 54, roll: 0, shake: 0 };
              } else {
                const zOut = smoothStep(segProgress(frame, 808, 846));
                heroMood = "pinprick";
                cam = {
                  pos: [0, lerp(1.66, 1.42, zOut), lerp(3.3, 6.6, zOut)],
                  target: [0, lerp(1.66, 1.32, zOut), 0.1], fov: lerp(48, 55, zOut), roll: 0,
                  shake: frame >= 810 && frame <= 822 ? 0.03 : 0,
                };
              }
            }
            // SHOT 10 (850 - 960): Helper Girl "NEED HELP?" -> Squash & Stretch Rocket Zip Exit
            else {
              showHelper = true;
              const walkIn = smoothStep(segProgress(frame, 850, 878));
              heroPos = [-0.45, 0, 0.1]; heroBarPos = [-0.35, 1.51, 0.06];
              heroPose = "realityempty"; heroPlateScale = 0; heroMood = "pinprick";
              helperPos = [lerp(2.25, 1.15, walkIn), 0, 0.65];

              if (frame >= 896 && frame < 900) {
                const sq = segProgress(frame, 896, 900);
                heroScale = [1 + sq * 0.28, 1 - sq * 0.26, 1 + sq * 0.2];
              } else if (frame >= 900) {
                const zipT = segProgress(frame, 900, 907);
                heroPos = [-0.45, lerp(0, -6.2, zipT), 0.1];
                heroScale = [0.55, 2.35, 0.55];
                if (frame > 907) heroVisible = false;
                helperSurprised = true;
              }
              cam = { pos: [0.3, 1.42, 6.85], target: [0.3, 1.32, 0.18], fov: 55, roll: 0, shake: frame >= 900 && frame <= 914 ? 0.055 : 0 };
            }

            return (
              <>
                <color attach="background" args={[isFeverBg ? PALETTE.feverBg : PALETTE.bgPaper]} />
                <CameraRig state={cam} frame={frame} />
                <GymEnvironment frame={frame} pulldownProgress={pulldownVal} visible={!isFeverBg} />
                {isFeverBg && <FeverSpiralBackdrop frame={frame} />}

                {!isFeverBg && (broMode === "squat" || broMode === "glare") && broPos[0] > 2.5 && (
                  <Barbell position={[broPos[0], 1.58 - broSquatVal * 0.3, broPos[2] - 0.05]} rotation={[0, broRot[1], 0]} plateScale={1.04} frame={frame} />
                )}
                {showHeroBar && <Barbell position={heroBarPos} rotation={heroBarRot} plateScale={heroPlateScale} bend={heroBarBend} frame={frame} />}

                {heroVisible && (
                  <Overthinker
                    position={heroPos} rotation={heroRot} scale={heroScale} frame={frame}
                    pose={heroPose} mood={heroMood} barY={heroBarPos[1]}
                    sweating={heroSweat} waterfall={heroWaterfall} tremble={heroTremble} meltFactor={heroMelt}
                  />
                )}
                {!isFeverBg && <GymGirl position={girlPos} rotation={girlRot} frame={frame} mode={girlMode} pulldownProgress={pulldownVal} headYawOverride={girlHeadYaw} />}
                {!isFeverBg && <BuffBro position={broPos} rotation={broRot} frame={frame} mode={broMode} squatDepth={broSquatVal} headYawOverride={broHeadYaw} />}
                {showHelper && <HelperGirl position={helperPos} frame={frame} surprised={helperSurprised} />}
                <FloatingMockingFaces frame={frame} intensity={feverIntensity} />
              </>
            );
          };
          EOF

