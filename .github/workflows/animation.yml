          function buildTaperedTubeGeo(
            curve: THREE.CatmullRomCurve3, radii: number[], tubularSegs: number, radialSegs: number, extraRadius: number
          ): THREE.BufferGeometry {
            const frames = curve.computeFrenetFrames(tubularSegs, false);
            const positions: number[] = [], normals: number[] = [], indices: number[] = [];
            const sampleR = (u: number) => {
              const sc = u * (radii.length - 1), idx = Math.min(radii.length - 2, Math.floor(sc)), f = sc - idx;
              return radii[idx] + (radii[idx + 1] - radii[idx]) * f + extraRadius;
            };
            const P = new THREE.Vector3(), N = new THREE.Vector3(), v = new THREE.Vector3();
            for (let i = 0; i <= tubularSegs; i++) {
              const u = i / tubularSegs;
              curve.getPointAt(u, P);
              const r = Math.max(0.004, sampleR(u));
              const normal = frames.normals[i], binormal = frames.binormals[i];
              for (let j = 0; j <= radialSegs; j++) {
                const th = (j / radialSegs) * Math.PI * 2, sn = Math.sin(th), cs = -Math.cos(th);
                N.set(cs * normal.x + sn * binormal.x, cs * normal.y + sn * binormal.y, cs * normal.z + sn * binormal.z).normalize();
                v.set(P.x + r * N.x, P.y + r * N.y, P.z + r * N.z);
                positions.push(v.x, v.y, v.z); normals.push(N.x, N.y, N.z);
              }
            }
            const stride = radialSegs + 1;
            for (let i = 0; i < tubularSegs; i++) {
              for (let j = 0; j < radialSegs; j++) {
                const a = i * stride + j, b = (i + 1) * stride + j, c = (i + 1) * stride + (j + 1), d = i * stride + (j + 1);
                indices.push(a, b, d, b, c, d);
              }
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
            geo.setIndex(indices);
            return geo;
          }
    
          export const TaperedLimb: React.FC<{
