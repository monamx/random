          cat << 'EOF' > gym-anim/src/scene/Characters.tsx
          import React from "react";
          import { InkBox, InkCylinder, InkSphere, InkTorus, SmoothLathe, TaperedLimb } from "./ToonMaterial";
          import { PALETTE, isNaturalBlink } from "../utils/animation";

          export type MoodType =
            | "calm" | "smile" | "sideeye" | "angry" | "panic" | "melt"
            | "shy" | "fakegrin" | "scream" | "laugh" | "smug" | "pinprick" | "blink";

          // Sculpted stylized anime/cartoon head profile (tapered soft jawline instead of pure ball!)
          const HEAD_PROFILE: [number, number][] = [
            [0.001, -0.235],
            [0.11, -0.22],
            [0.185, -0.155],
            [0.225, -0.05],
            [0.236, 0.06],
            [0.218, 0.16],
            [0.15, 0.225],
            [0.001, 0.245],
          ];

          function onHead(x: number, y: number, r: number, lift = 0.01): { pos: [number, number, number]; rot: [number, number, number] } {
            const z = Math.sqrt(Math.max(0.01, r * r - x * x - y * y)) * 0.94 + lift;
            return { pos: [x, y, z], rot: [-Math.atan2(y, r) * 0.78, Math.atan2(x, r) * 0.82, 0] };
          }

          export const CartoonFace: React.FC<{
            mood: MoodType;
            frame: number;
            headR: number;
            eyeScale?: number;
            blush?: boolean;
            lashes?: boolean;
            blinkOffset?: number;
          }> = ({ mood, frame, headR, eyeScale = 1, blush = false, lashes = false, blinkOffset = 0 }) => {
            const autoBlink = (mood === "calm" || mood === "smile") && isNaturalBlink(frame, blinkOffset);
            const m: MoodType = autoBlink ? "blink" : mood;

            const jx = m === "panic" || m === "scream" ? Math.sin(frame * 2.8) * 0.008 : 0;
            const jy = m === "panic" || m === "scream" ? Math.cos(frame * 3.3) * 0.008 : 0;

            const isWide = m === "panic" || m === "angry" || m === "pinprick" || m === "scream";
            const eScaleX = (isWide ? 1.22 : m === "melt" ? 1.1 : 1.0) * eyeScale;
            const eScaleY = (m === "sideeye" || m === "smug" ? 0.56 : m === "melt" ? 1.3 : isWide ? 1.24 : 1.0) * eyeScale;
            const pupilR = m === "pinprick" ? 0.01 : m === "panic" ? 0.015 : m === "scream" ? 0.013 : 0.023;

            let px = 0, py = 0;
            if (m === "sideeye") px = -0.02;
            if (m === "smug") px = 0.019;
            if (m === "panic") { px = Math.sin(frame * 0.5) * 0.013; py = Math.cos(frame * 0.65) * 0.011; }

            const eyeX = headR * 0.36, eyeY = headR * 0.1;
            const leftEye = onHead(-eyeX + jx, eyeY + jy, headR, 0.008);
            const rightEye = onHead(eyeX + jx, eyeY + jy, headR, 0.008);
            const leftBrow = onHead(-eyeX + jx, headR * 0.44 + jy, headR, 0.014);
            const rightBrow = onHead(eyeX + jx, headR * 0.44 + jy, headR, 0.014);
            const nose = onHead(jx, -headR * 0.09 + jy, headR, 0.01);
            const mouth = onHead(jx, -headR * 0.34 + jy, headR, 0.011);
            const lBlush = onHead(-headR * 0.53, -headR * 0.15, headR, 0.006);
            const rBlush = onHead(headR * 0.53, -headR * 0.15, headR, 0.006);
            const forehead = onHead(0, headR * 0.58, headR, 0.007);

            return (
              <group>
                {/* Vertical Anime Anxiety Dread Lines */}
                {(m === "panic" || m === "melt" || m === "pinprick") && (
                  <group position={forehead.pos} rotation={forehead.rot}>
                    {[-0.08, -0.04, 0, 0.04, 0.08].map((lx, idx) => (
                      <mesh key={idx} position={[lx, 0, 0.002]}>
                        <planeGeometry args={[0.01, 0.085]} />
                        <meshBasicMaterial color={PALETTE.dreadPurple} transparent opacity={0.55} />
                      </mesh>
                    ))}
                  </group>
                )}

                {/* Subtle Cute Stylized Nose Shadow */}
                <mesh position={nose.pos} rotation={nose.rot}>
                  <circleGeometry args={[0.011, 10]} />
                  <meshBasicMaterial color={PALETTE.skinShadow} />
                </mesh>

                {/* Eyes */}
                {m === "blink" || m === "laugh" ? (
                  <>
                    {[leftEye, rightEye].map((t, idx) => (
                      <group key={idx} position={t.pos} rotation={t.rot}>
                        <mesh rotation={[0, 0, m === "laugh" ? (idx === 0 ? 0.35 : -0.35) : idx === 0 ? -0.08 : 0.08]}>
                          <planeGeometry args={[0.092, 0.02]} /><meshBasicMaterial color={PALETTE.ink} />
                        </mesh>
                        {m === "laugh" && (
                          <mesh position={[0, -0.021, 0]} rotation={[0, 0, idx === 0 ? -0.33 : 0.33]}>
                            <planeGeometry args={[0.088, 0.017]} /><meshBasicMaterial color={PALETTE.ink} />
                          </mesh>
                        )}
                      </group>
                    ))}
                  </>
                ) : (
                  <>
                    {[leftEye, rightEye].map((t, idx) => (
                      <group key={idx} position={t.pos} rotation={t.rot} scale={[eScaleX, eScaleY, 1]}>
                        <mesh position={[0, 0, 0.001]}><circleGeometry args={[0.055, 22]} /><meshBasicMaterial color={PALETTE.ink} /></mesh>
                        <mesh position={[0, 0, 0.004]}><circleGeometry args={[0.046, 22]} /><meshBasicMaterial color="#FFFFFF" /></mesh>
                        <mesh position={[px, py, 0.008]}><circleGeometry args={[pupilR, 14]} /><meshBasicMaterial color={PALETTE.ink} /></mesh>
                        {(m === "calm" || m === "smile" || m === "shy") && (
                          <mesh position={[px + 0.009, py + 0.01, 0.011]}><circleGeometry args={[0.0085, 10]} /><meshBasicMaterial color="#FFFFFF" /></mesh>
                        )}
                        {/* Subtle Eyelash Wing for Female Characters */}
                        {lashes && (
                          <mesh position={[idx === 0 ? -0.05 : 0.05, 0.032, 0.012]} rotation={[0, 0, idx === 0 ? -0.45 : 0.45]}>
                            <planeGeometry args={[0.036, 0.013]} /><meshBasicMaterial color={PALETTE.ink} />
                          </mesh>
                        )}
                        {(m === "sideeye" || m === "smug") && (
                          <mesh position={[0, 0.046, 0.013]}><planeGeometry args={[0.118, 0.024]} /><meshBasicMaterial color={PALETTE.ink} /></mesh>
                        )}
                      </group>
                    ))}
                  </>
                )}

                {/* Rosy Cheeks */}
                {(blush || m === "shy" || m === "smile") && (
                  <>
                    <mesh position={lBlush.pos} rotation={lBlush.rot}><circleGeometry args={[0.031, 14]} /><meshBasicMaterial color={PALETTE.blush} transparent opacity={0.62} /></mesh>
                    <mesh position={rBlush.pos} rotation={rBlush.rot}><circleGeometry args={[0.031, 14]} /><meshBasicMaterial color={PALETTE.blush} transparent opacity={0.62} /></mesh>
                  </>
                )}

                {/* Eyebrows */}
                {m === "angry" && (
                  <>
                    <group position={leftBrow.pos} rotation={leftBrow.rot}><mesh rotation={[0, 0, -0.44]}><planeGeometry args={[0.12, 0.023]} /><meshBasicMaterial color={PALETTE.ink} /></mesh></group>
                    <group position={rightBrow.pos} rotation={rightBrow.rot}><mesh rotation={[0, 0, 0.44]}><planeGeometry args={[0.12, 0.023]} /><meshBasicMaterial color={PALETTE.ink} /></mesh></group>
                  </>
                )}
                {(m === "panic" || m === "shy" || m === "pinprick" || m === "melt") && (
                  <>
                    <group position={leftBrow.pos} rotation={leftBrow.rot}><mesh rotation={[0, 0, 0.36]}><planeGeometry args={[0.092, 0.018]} /><meshBasicMaterial color={PALETTE.ink} /></mesh></group>
                    <group position={rightBrow.pos} rotation={rightBrow.rot}><mesh rotation={[0, 0, -0.36]}><planeGeometry args={[0.092, 0.018]} /><meshBasicMaterial color={PALETTE.ink} /></mesh></group>
                  </>
                )}
                {(m === "sideeye" || m === "smug") && (
                  <>
                    <group position={leftBrow.pos} rotation={leftBrow.rot}><mesh rotation={[0, 0, -0.1]}><planeGeometry args={[0.108, 0.021]} /><meshBasicMaterial color={PALETTE.ink} /></mesh></group>
                    <group position={rightBrow.pos} rotation={rightBrow.rot}><mesh rotation={[0, 0, 0.25]}><planeGeometry args={[0.108, 0.021]} /><meshBasicMaterial color={PALETTE.ink} /></mesh></group>
                  </>
                )}

                {/* Mouths */}
                <group position={mouth.pos} rotation={mouth.rot}>
                  {m === "scream" && (
                    <>
                      <mesh><circleGeometry args={[0.068, 18]} /><meshBasicMaterial color={PALETTE.ink} /></mesh>
                      <mesh position={[0, -0.024, 0.003]}><circleGeometry args={[0.038, 14]} /><meshBasicMaterial color="#E05F5F" /></mesh>
                      <mesh position={[0, 0.036, 0.004]}><planeGeometry args={[0.082, 0.02]} /><meshBasicMaterial color="#FFFFFF" /></mesh>
                    </>
                  )}
                  {(m === "laugh" || m === "fakegrin") && (
                    <>
                      <mesh position={[0, 0.012, 0]}><circleGeometry args={[0.074, 18, Math.PI, Math.PI]} /><meshBasicMaterial color={PALETTE.ink} /></mesh>
                      <mesh position={[0, -0.002, 0.003]}><planeGeometry args={[0.114, 0.022]} /><meshBasicMaterial color="#FFFFFF" /></mesh>
                      <mesh position={[0, -0.036, 0.002]}><circleGeometry args={[0.032, 12, 0, Math.PI]} /><meshBasicMaterial color="#E05F5F" /></mesh>
                    </>
                  )}
                  {m === "smile" && (
                    <mesh position={[0, 0.015, 0]}><ringGeometry args={[0.031, 0.046, 16, 1, Math.PI * 1.15, Math.PI * 0.7]} /><meshBasicMaterial color={PALETTE.ink} /></mesh>
                  )}
                  {(m === "panic" || m === "melt") && (
                    <group position={[0, 0, 0.002]}>
                      {[-0.03, -0.01, 0.01, 0.03].map((mx, idx) => (
                        <mesh key={idx} position={[mx, (idx % 2 === 0 ? 1 : -1) * 0.007 * Math.sin(frame * 1.4 + idx), 0]} rotation={[0, 0, idx % 2 === 0 ? 0.35 : -0.35]}>
                          <planeGeometry args={[0.026, 0.015]} /><meshBasicMaterial color={PALETTE.ink} />
                        </mesh>
                      ))}
                    </group>
                  )}
                  {(m === "pinprick" || m === "shy") && <mesh><planeGeometry args={[0.056, 0.015]} /><meshBasicMaterial color={PALETTE.ink} /></mesh>}
                  {(m === "sideeye" || m === "angry" || m === "smug" || m === "calm") && (
                    <mesh rotation={[0, 0, m === "smug" ? 0.16 : -0.05]}><planeGeometry args={[0.07, 0.016]} /><meshBasicMaterial color={PALETTE.ink} /></mesh>
                  )}
                </group>
              </group>
            );
          };

          // Sculpted Stylized Hand (Palm Pad + Thumb + Finger Cluster OR Pointing Index)
          const SculptedHand: React.FC<{
            position: [number, number, number];
            rotation?: [number, number, number];
            pointing?: boolean;
            scale?: number;
            frame: number;
            seed: number;
          }> = ({ position, rotation = [0, 0, 0], pointing = false, scale = 1, frame, seed }) => (
            <group position={position} rotation={rotation} scale={[scale, scale, scale]}>
              {/* Sculpted Palm */}
              <InkSphere args={[0.044, 14, 12]} scale={[1.05, 0.9, 1.15]} color={PALETTE.skin} shadowColor={PALETTE.skinShadow} outline={0.01} frame={frame} seed={seed} />
              {/* Articulated Thumb */}
              <InkCylinder args={[0.014, 0.018, 0.055, 10]} position={[0.038, 0.012, 0.02]} rotation={[0.4, 0, -0.75]} color={PALETTE.skin} shadowColor={PALETTE.skinShadow} outline={0.008} frame={frame} seed={seed + 1} />
              {pointing ? (
                <>
                  {/* Extended Index Finger */}
                  <InkCylinder args={[0.014, 0.017, 0.088, 10]} position={[0, 0.005, 0.068]} rotation={[Math.PI / 2, 0, 0]} color={PALETTE.skin} shadowColor={PALETTE.skinShadow} outline={0.008} frame={frame} seed={seed + 2} />
                  <InkSphere args={[0.015, 10, 8]} position={[0, 0.005, 0.112]} color={PALETTE.skin} outline={0.007} />
                </>
              ) : (
                /* Curled Fingers Knuckle Ridge */
                <InkSphere args={[0.034, 12, 10]} position={[-0.004, -0.015, 0.035]} scale={[1.22, 0.82, 0.85]} color={PALETTE.skin} shadowColor={PALETTE.skinShadow} outline={0.009} frame={frame} seed={seed + 2} />
              )}
            </group>
          );

          // Realistic Modern 2D Athletic Sneaker + Striped Crew Sock
          const AthleticSneaker: React.FC<{
            position: [number, number, number];
            rotation?: [number, number, number];
            color?: string;
            accent?: string;
            scale?: number;
            frame: number;
            seed: number;
          }> = ({ position, rotation = [0, 0, 0], color = PALETTE.heroShoes, accent = PALETTE.heroAccent, scale = 1, frame, seed }) => (
            <group position={position} rotation={rotation} scale={[scale, scale, scale]}>
              {/* Ribbed Athletic Crew Sock with Double Sport Stripes */}
              <InkCylinder args={[0.044, 0.04, 0.13, 14]} position={[0, 0.125, -0.005]} color={PALETTE.sockWhite} outline={0.01} frame={frame} seed={seed} />
              <InkTorus args={[0.044, 0.007, 8, 18]} position={[0, 0.165, -0.005]} rotation={[Math.PI / 2, 0, 0]} color={accent} outline={0} />
              <InkTorus args={[0.043, 0.006, 8, 18]} position={[0, 0.145, -0.005]} rotation={[Math.PI / 2, 0, 0]} color={accent} outline={0} />
              {/* Contoured Shoe Upper + Toe Box */}
              <InkSphere args={[0.078, 16, 12]} position={[0, 0.056, 0.035]} scale={[0.92, 0.76, 1.54]} color={color} outline={0.011} frame={frame} seed={seed + 1} />
              {/* Colored Side Accent Stripe */}
              <InkBox args={[0.152, 0.022, 0.095]} position={[0, 0.054, 0.03]} rotation={[0.15, 0, 0]} color={accent} outline={0.004} />
              {/* Laces */}
              <mesh position={[0, 0.096, 0.072]} rotation={[-0.45, 0, 0]}><planeGeometry args={[0.068, 0.013]} /><meshBasicMaterial color={PALETTE.ink} /></mesh>
              <mesh position={[0, 0.082, 0.102]} rotation={[-0.55, 0, 0]}><planeGeometry args={[0.06, 0.013]} /><meshBasicMaterial color={PALETTE.ink} /></mesh>
              {/* Sculpted Midsole + Outsole */}
              <InkCylinder args={[0.074, 0.08, 0.032, 16]} position={[0, 0.016, 0.038]} scale={[0.96, 1, 1.54]} color={PALETTE.heroSole} outline={0.009} frame={frame} seed={seed + 2} />
            </group>
          );

          // ------------------------------------------------------------------
          // CHARACTER 1: THE OVERTHINKER (Anatomical Slim Proportions + Cel-Shading)
          // ------------------------------------------------------------------
          const HERO_SHIRT_PROFILE: [number, number][] = [
            [0.186, 0.0], [0.175, 0.12], [0.156, 0.28], [0.168, 0.45], [0.155, 0.53], [0.095, 0.575], [0.048, 0.585],
          ];
          const HERO_SHORTS_PROFILE: [number, number][] = [
            [0.168, -0.05], [0.176, 0.04], [0.168, 0.14], [0.142, 0.16],
          ];

          export interface OverthinkerProps {
            position?: [number, number, number];
            rotation?: [number, number, number];
            scale?: [number, number, number];
            frame: number;
            pose: "hunch" | "shy" | "grabbar" | "squatstrain" | "overheadpress" | "tumbled" | "realityempty";
            mood: MoodType;
            barY?: number;
            sweating?: boolean;
            waterfall?: boolean;
            tremble?: number;
            meltFactor?: number;
          }

          export const Overthinker: React.FC<OverthinkerProps> = ({
            position = [0, 0, 0], rotation = [0, 0, 0], scale = [1, 1, 1],
            frame, pose, mood, barY = 1.51, sweating = false, waterfall = false, tremble = 0, meltFactor = 0,
          }) => {
            const tx = tremble > 0 ? Math.sin(frame * 3.8) * tremble : 0;
            const tz = tremble > 0 ? Math.cos(frame * 4.2) * tremble * 0.45 : 0;
            const breath = Math.sin(frame * 0.11) * 0.012;

            const isSquat = pose === "squatstrain", isPress = pose === "overheadpress";
            const isShy = pose === "shy", isGrab = pose === "grabbar" || pose === "realityempty", isTumbled = pose === "tumbled";
            const hipY = isTumbled ? 0.21 : isSquat ? 0.58 : 0.82;
            const torsoTilt = pose === "hunch" ? 0.16 : isSquat ? 0.12 : isTumbled ? -0.22 : 0;

            // Anatomical Leg Curves (start cleanly INSIDE shorts cuff -> Knee -> Calf -> Slim Ankle!)
            const legRadii = [0.056, 0.048, 0.041, 0.045, 0.032];
            let lLeg: [number, number, number][], rLeg: [number, number, number][];
            let lFoot: [number, number, number], rFoot: [number, number, number], footRotX = 0;

            if (isTumbled) {
              lLeg = [[-0.095, hipY + 0.02, 0.04], [-0.22, 0.18, 0.28], [-0.28, 0.1, 0.52]];
              rLeg = [[0.095, hipY + 0.02, 0.04], [0.22, 0.18, 0.28], [0.28, 0.1, 0.52]];
              lFoot = [-0.28, 0.07, 0.54]; rFoot = [0.28, 0.07, 0.54]; footRotX = -0.75;
            } else if (isSquat) {
              lLeg = [[-0.1, hipY, 0], [-0.27, 0.37, 0.18], [-0.22, 0.11, 0.02]];
              rLeg = [[0.1, hipY, 0], [0.27, 0.37, 0.18], [0.22, 0.11, 0.02]];
              lFoot = [-0.22, 0.032, 0.02]; rFoot = [0.22, 0.032, 0.02];
            } else {
              lLeg = [[-0.095, hipY, 0], [-0.115, hipY * 0.52, 0.03], [-0.125, 0.11, 0]];
              rLeg = [[0.095, hipY, 0], [0.115, hipY * 0.52, 0.03], [0.125, 0.11, 0]];
              lFoot = [-0.125, 0.032, 0]; rFoot = [0.125, 0.032, 0];
            }

            // Anatomical Tapered Arm Profile: Shoulder -> Bicep -> Elbow -> Forearm -> Slim Wrist
            const armRadii = [0.044, 0.039, 0.034, 0.036, 0.027];
            const localBarY = Math.max(0.28, barY - (hipY + 0.08));
            let lArm: [number, number, number][], rArm: [number, number, number][];
            let lSleeve: [number, number, number] = [0, 0, -0.52], rSleeve: [number, number, number] = [0, 0, 0.52];

            if (isShy) {
              const w = Math.sin(frame * 0.55) * 0.014;
              lArm = [[-0.17, 0.48, 0], [-0.26, 0.32, 0.15], [-0.08 + w, 0.34, 0.29]];
              rArm = [[0.17, 0.48, 0], [0.26, 0.32, 0.15], [0.08 - w, 0.34, 0.29]];
              lSleeve = [0.3, 0, -0.45]; rSleeve = [0.3, 0, 0.45];
            } else if (isGrab || isSquat) {
              lArm = [[-0.17, 0.48, 0], [-0.4, 0.37, 0.02], [-0.52, localBarY, -0.02]];
              rArm = [[0.17, 0.48, 0], [0.4, 0.37, 0.02], [0.52, localBarY, -0.02]];
              lSleeve = [0, 0, -1.15]; rSleeve = [0, 0, 1.15];
            } else if (isPress) {
              const my = (0.48 + localBarY) * 0.5;
              lArm = [[-0.17, 0.48, 0], [-0.38, my, 0.02], [-0.5, localBarY, 0]];
              rArm = [[0.17, 0.48, 0], [0.38, my, 0.02], [0.5, localBarY, 0]];
              lSleeve = [0, 0, -2.2]; rSleeve = [0, 0, 2.2];
            } else if (isTumbled) {
              const fl = Math.sin(frame * 1.2) * 0.08;
              lArm = [[-0.17, 0.48, 0], [-0.35, 0.52 + fl, 0.14], [-0.43, 0.68 + fl, 0.22]];
              rArm = [[0.17, 0.48, 0], [0.35, 0.52 - fl, 0.14], [0.43, 0.68 - fl, 0.22]];
              lSleeve = [0, 0, -1.7]; rSleeve = [0, 0, 1.7];
            } else {
              lArm = [[-0.17, 0.48, 0], [-0.26, 0.28, 0.08], [-0.15, 0.15, 0.18]];
              rArm = [[0.17, 0.48, 0], [0.26, 0.28, 0.08], [0.15, 0.15, 0.18]];
            }

            return (
              <group position={[position[0] + tx, position[1], position[2] + tz]} rotation={rotation} scale={scale}>
                <mesh rotation={[-Math.PI / 2, 0, 0]} position={[0, 0.036, 0]}>
                  <circleGeometry args={[0.42, 22]} /><meshBasicMaterial color="#1F2228" transparent opacity={0.28} />
                </mesh>

                {/* Anatomical Tapered Legs + Shorts Cuffs (wider by +0.028 -> zero clipping!) + Socks/Sneakers */}
                <TaperedLimb points={lLeg} radii={legRadii} color={PALETTE.skin} shadowColor={PALETTE.skinShadow} endCap={false} />
                <TaperedLimb points={rLeg} radii={legRadii} color={PALETTE.skin} shadowColor={PALETTE.skinShadow} endCap={false} />
                {!isTumbled && (
                  <>
                    <InkCylinder args={[0.076, 0.084, 0.21, 14]} position={[-0.105, hipY - 0.1, 0.01]} rotation={[isSquat ? -0.52 : 0, 0, isSquat ? 0.26 : 0.04]} color={PALETTE.heroShorts} outline={0.011} frame={frame} seed={101} />
                    <InkCylinder args={[0.076, 0.084, 0.21, 14]} position={[0.105, hipY - 0.1, 0.01]} rotation={[isSquat ? -0.52 : 0, 0, isSquat ? -0.26 : -0.04]} color={PALETTE.heroShorts} outline={0.011} frame={frame} seed={102} />
                  </>
                )}
                <AthleticSneaker position={lFoot} rotation={[footRotX, 0.08, 0]} accent={PALETTE.heroAccent} frame={frame} seed={105} />
                <AthleticSneaker position={rFoot} rotation={[footRotX, -0.08, 0]} accent={PALETTE.heroAccent} frame={frame} seed={108} />

                {/* Elliptical Sculpted Shorts Pelvis (flatter front-to-back!) */}
                <SmoothLathe profile={HERO_SHORTS_PROFILE} position={[0, hipY - 0.02, 0]} scale={[1.08, 1, 0.78]} color={PALETTE.heroShorts} outline={0.012} />

                {/* Upper Body */}
                <group position={[0, hipY + 0.08 + breath, 0]} rotation={[torsoTilt, 0, 0]}>
                  {/* Elliptical Athletic T-Shirt Torso (broader shoulders, flatter chest!) */}
                  <SmoothLathe profile={HERO_SHIRT_PROFILE} position={[0, 0, 0]} scale={[1.12, 1, 0.74]} color={PALETTE.heroShirt} outline={0.013} />
                  <InkTorus args={[0.076, 0.017, 10, 20]} position={[0, 0.568, 0.01]} rotation={[Math.PI / 2 + 0.1, 0, 0]} color={PALETTE.heroShirtTrim} outline={0.007} />
                  {/* Short Sleeves */}
                  <InkCylinder args={[0.056, 0.072, 0.145, 14]} position={[-0.2, 0.46, 0]} rotation={lSleeve} color={PALETTE.heroShirt} outline={0.011} frame={frame} seed={112} />
                  <InkCylinder args={[0.056, 0.072, 0.145, 14]} position={[0.2, 0.46, 0]} rotation={rSleeve} color={PALETTE.heroShirt} outline={0.011} frame={frame} seed={113} />

                  {/* Neck + Neck Cast Shadow */}
                  <InkCylinder args={[0.042, 0.048, 0.125, 14]} position={[0, 0.615, 0]} color={PALETTE.skin} shadowColor={PALETTE.skinShadow} outline={0.01} frame={frame} seed={115} />

                  {/* Anatomical Tapered Arms + Sculpted Hands */}
                  <TaperedLimb points={lArm} radii={armRadii} color={PALETTE.skin} shadowColor={PALETTE.skinShadow} endCap={false} />
                  <TaperedLimb points={rArm} radii={armRadii} color={PALETTE.skin} shadowColor={PALETTE.skinShadow} endCap={false} />
                  <SculptedHand position={lArm[2]} rotation={[0, isShy ? Math.PI / 2 : 0, 0]} pointing={isShy} frame={frame} seed={120} />
                  <SculptedHand position={rArm[2]} rotation={[0, isShy ? -Math.PI / 2 : 0, 0]} pointing={isShy} frame={frame} seed={124} />

                  {/* Sculpted Stylized Head (Tapered Jaw + Ears + Hair Strands!) */}
                  <group position={[0, 0.87, 0.02]} scale={[1 - meltFactor * 0.15, 1 + meltFactor * 0.28, 1]}>
                    <SmoothLathe profile={HEAD_PROFILE} scale={[1.04, 1.03, 0.96]} color={PALETTE.skin} shadowColor={PALETTE.skinShadow} outline={0.014} />
                    {/* Cute Left & Right Ears */}
                    <InkSphere args={[0.044, 12, 10]} position={[-0.235, -0.02, -0.02]} scale={[0.55, 1.15, 0.8]} color={PALETTE.skin} shadowColor={PALETTE.skinShadow} outline={0.009} />
                    <InkSphere args={[0.044, 12, 10]} position={[0.235, -0.02, -0.02]} scale={[0.55, 1.15, 0.8]} color={PALETTE.skin} shadowColor={PALETTE.skinShadow} outline={0.009} />
                    {/* Stylized Messy Hair Cap & Tuft */}
                    <TaperedLimb points={[[0, 0.24, 0], [-0.04, 0.32, 0.01], [-0.09, 0.3, 0.03]]} radii={[0.02, 0.015, 0.006]} color={PALETTE.ink} outline={0} segments={8} />
                    <TaperedLimb points={[[0.01, 0.24, 0], [0.06, 0.31, 0.01], [0.11, 0.28, 0.03]]} radii={[0.018, 0.014, 0.006]} color={PALETTE.ink} outline={0} segments={8} />

                    <CartoonFace mood={mood} frame={frame} headR={0.24} blinkOffset={12} />

                    {/* Flying Panic Sweat Drops */}
                    {sweating &&
                      [0, 1, 2, 3, 4, 5].map((i) => {
                        const phase = (frame * 0.07 + i * 0.19) % 1;
                        const angle = (i / 6) * Math.PI * 1.35 - 0.18;
                        const dist = 0.29 + phase * 0.32;
                        return (
                          <InkSphere
                            key={i}
                            args={[0.026 * (1 - phase * 0.45), 10, 8]}
                            position={[Math.cos(angle) * dist, Math.sin(angle) * dist + 0.06 - phase * 0.14, 0.1]}
                            scale={[0.8, 1.35, 0.8]}
                            color={PALETTE.sweatBlue}
                            outline={0.008}
                            frame={frame}
                            seed={140 + i}
                          />
                        );
                      })}

                    {/* Curved Dual-Eye Tear Waterfall Streams */}
                    {waterfall && (
                      <group>
                        <TaperedLimb
                          points={[[-0.085, 0.01, 0.23], [-0.22, -0.06, 0.29], [-0.27, -0.8, 0.25], [-0.24, -1.7, 0.16]]}
                          radii={[0.032, 0.042, 0.05, 0.062]}
                          color={PALETTE.sweatBlue}
                          outline={0.009}
                        />
                        <TaperedLimb
                          points={[[0.085, 0.01, 0.23], [0.22, -0.06, 0.29], [0.27, -0.8, 0.25], [0.24, -1.7, 0.16]]}
                          radii={[0.032, 0.042, 0.05, 0.062]}
                          color={PALETTE.sweatBlue}
                          outline={0.009}
                        />
                        <InkCylinder args={[0.66 + Math.sin(frame * 0.85) * 0.06, 0.66, 0.025, 24]} position={[0, -1.72, 0.08]} color={PALETTE.sweatBlue} outline={0.011} frame={frame} seed={155} />
                      </group>
                    )}
                  </group>
                </group>
              </group>
            );
          };

          // ------------------------------------------------------------------
          // CHARACTER 2: LAT PULLDOWN GYM GIRL (Sculpted Athletic Figure + Ponytail)
          // ------------------------------------------------------------------
          const GIRL_TOP_PROFILE: [number, number][] = [
            [0.144, 0.19], [0.15, 0.3], [0.156, 0.42], [0.138, 0.495], [0.052, 0.525],
          ];
          const GIRL_WAIST_PROFILE: [number, number][] = [
            [0.165, -0.04], [0.172, 0.05], [0.136, 0.15], [0.124, 0.18],
          ];

          export const GymGirl: React.FC<{
            position?: [number, number, number];
            rotation?: [number, number, number];
            frame: number;
            mode: "pulldown" | "glare" | "judge" | "pointlaugh";
            pulldownProgress?: number;
            headYawOverride?: number;
          }> = ({ position = [0, 0, 0], rotation = [0, 0, 0], frame, mode, pulldownProgress = 0, headYawOverride }) => {
            const isSeated = mode === "pulldown" || mode === "glare";
            const headYaw = headYawOverride !== undefined ? headYawOverride : mode === "glare" ? -1.45 : 0;
            const mood: MoodType = mode === "glare" ? "angry" : mode === "judge" ? "sideeye" : mode === "pointlaugh" ? "laugh" : "calm";
            const breath = Math.sin(frame * 0.1 + 1.1) * 0.01;
            const hipY = isSeated ? 0.73 : 0.82;

            const legRadii = [0.064, 0.054, 0.044, 0.048, 0.032];
            const armRadii = [0.041, 0.036, 0.031, 0.033, 0.025];

            const lLeg: [number, number, number][] = isSeated
              ? [[-0.088, hipY, 0.04], [-0.095, hipY - 0.02, 0.41], [-0.095, 0.11, 0.43]]
              : [[-0.088, hipY, 0], [-0.095, hipY * 0.52, 0.02], [-0.1, 0.11, 0]];
            const rLeg: [number, number, number][] = isSeated
