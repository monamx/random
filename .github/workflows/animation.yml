          import React from "react";
          import { AbsoluteFill } from "remotion";
          import { PALETTE, boilJitter, easeOutBack, segProgress } from "../utils/animation";

          export const ComicOverlay: React.FC<{ frame: number }> = ({ frame }) => {
            const boomFrames = [65, 134, 206, 376, 541, 590, 810, 901];
            const isImpactFlash = boomFrames.some((bf) => frame === bf || frame === bf + 1);
            const isFever = frame >= 615 && frame < 720;
            const showActionLines = (frame >= 72 && frame <= 155) || (frame >= 475 && frame <= 540) || isFever;
            const showAngerMark = (frame >= 64 && frame < 72) || (frame >= 130 && frame < 155);

            let thoughtText = "", thoughtPop = 1;
            if (frame >= 80 && frame <= 126) { thoughtText = "Don't look... act normal..."; thoughtPop = easeOutBack(segProgress(frame, 80, 89)); }
            else if (frame >= 274 && frame <= 318) { thoughtText = "Are they judging my form?!"; thoughtPop = easeOutBack(segProgress(frame, 274, 283)); }
            else if (frame >= 326 && frame <= 372) { thoughtText = "ACT COOL!! LIFT HEAVY!!"; thoughtPop = easeOutBack(segProgress(frame, 326, 334)); }
            else if (frame >= 816 && frame <= 848) { thoughtText = "...it's literally empty."; thoughtPop = easeOutBack(segProgress(frame, 816, 825)); }

            const showNeedHelp = frame >= 865;
