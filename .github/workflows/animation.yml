          import React from "react";
          import { InkBox, InkCylinder, InkSphere, SmoothLathe, SmoothTube } from "./ToonMaterial";
          import { PALETTE } from "../utils/animation";

          export type MoodType =
            | "calm"
            | "smile"
            | "sideeye"
            | "angry"
            | "panic"
            | "melt"
            | "shy"
            | "fakegrin"
            | "scream"
            | "laugh"
            | "smug"
            | "pinprick"
            | "blink";

          // Helper to hug facial features seamlessly onto the curved front of a spherical head
          function onHead(x: number, y: number, r: number, lift = 0.01): { pos: [number, number, number]; rot: [number, number, number] } {
            const z = Math.sqrt(Math.max(0.01, r * r - x * x - y * y)) + lift;
            return {
              pos: [x, y, z],
              rot: [-Math.atan2(y, r) * 0.85, Math.atan2(x, r) * 0.85, 0],
            };
          }

          // Expressive 2D-on-3D Cartoon Face that wraps smoothly around head sphere
          export const CartoonFace: React.FC<{
            mood: MoodType;
            frame: number;
            headR: number;
            eyeScale?: number;
            blush?: boolean;
          }> = ({ mood, frame, headR, eyeScale = 1, blush = false }) => {
            const jx = mood === "panic" || mood === "scream" ? Math.sin(frame * 2.8) * 0.009 : 0;
            const jy = mood === "panic" || mood === "scream" ? Math.cos(frame * 3.3) * 0.009 : 0;

            const isWide = mood === "panic" || mood === "angry" || mood === "pinprick" || mood === "scream";
            const eScaleX = (isWide ? 1.24 : mood === "melt" ? 1.12 : 1.0) * eyeScale;
            const eScaleY =
              (mood === "sideeye" || mood === "smug"
                ? 0.52
                : mood === "melt"
                ? 1.32
                : isWide
                ? 1.26
                : 1.0) * eyeScale;

            const pupilR = mood === "pinprick" ? 0.01 : mood === "panic" ? 0.015 : mood === "scream" ? 0.013 : 0.023;
            let px = 0;
            let py = 0;
            if (mood === "sideeye") px = -0.022;
            if (mood === "smug") px = 0.02;
            if (mood === "panic") {
              px = Math.sin(frame * 0.5) * 0.014;
              py = Math.cos(frame * 0.65) * 0.012;
            }

            const eyeX = headR * 0.35;
            const eyeY = headR * 0.12;
            const browY = headR * 0.48;
            const mouthY = -headR * 0.32;

            const leftEye = onHead(-eyeX + jx, eyeY + jy, headR, 0.008);
            const rightEye = onHead(eyeX + jx, eyeY + jy, headR, 0.008);
            const leftBrow = onHead(-eyeX + jx, browY + jy, headR, 0.014);
            const rightBrow = onHead(eyeX + jx, browY + jy, headR, 0.014);
            const mouth = onHead(jx, mouthY + jy, headR, 0.01);
            const leftBlush = onHead(-headR * 0.52, -headR * 0.14, headR, 0.006);
            const rightBlush = onHead(headR * 0.52, -headR * 0.14, headR, 0.006);

            return (
              <group>
                {/* Eyes */}
                {mood === "blink" || mood === "laugh" ? (
                  <>
                    {[leftEye, rightEye].map((t, idx) => (
                      <group key={idx} position={t.pos} rotation={t.rot}>
                        <mesh rotation={[0, 0, mood === "laugh" ? (idx === 0 ? 0.36 : -0.36) : idx === 0 ? -0.1 : 0.1]}>
                          <planeGeometry args={[0.095, 0.02]} />
                          <meshBasicMaterial color={PALETTE.ink} />
                        </mesh>
                        {mood === "laugh" && (
                          <mesh position={[0, -0.022, 0]} rotation={[0, 0, idx === 0 ? -0.34 : 0.34]}>
                            <planeGeometry args={[0.09, 0.018]} />
                            <meshBasicMaterial color={PALETTE.ink} />
                          </mesh>
                        )}
                      </group>
                    ))}
                  </>
                ) : (
                  <>
                    {[leftEye, rightEye].map((t, idx) => (
                      <group key={idx} position={t.pos} rotation={t.rot} scale={[eScaleX, eScaleY, 1]}>
                        <mesh position={[0, 0, 0.001]}>
                          <circleGeometry args={[0.056, 22]} />
                          <meshBasicMaterial color={PALETTE.ink} />
                        </mesh>
                        <mesh position={[0, 0, 0.004]}>
                          <circleGeometry args={[0.047, 22]} />
                          <meshBasicMaterial color="#FFFFFF" />
                        </mesh>
                        <mesh position={[px, py, 0.008]}>
                          <circleGeometry args={[pupilR, 14]} />
                          <meshBasicMaterial color={PALETTE.ink} />
                        </mesh>
                        {(mood === "calm" || mood === "smile" || mood === "shy") && (
                          <mesh position={[px + 0.009, py + 0.01, 0.011]}>
                            <circleGeometry args={[0.008, 10]} />
                            <meshBasicMaterial color="#FFFFFF" />
                          </mesh>
                        )}
                      </group>
                    ))}
                  </>
                )}

                {/* Cute Rosy Blush */}
                {(blush || mood === "shy" || mood === "smile") && (
                  <>
                    <mesh position={leftBlush.pos} rotation={leftBlush.rot}>
                      <circleGeometry args={[0.03, 14]} />
                      <meshBasicMaterial color={PALETTE.blush} transparent opacity={0.62} />
                    </mesh>
                    <mesh position={rightBlush.pos} rotation={rightBlush.rot}>
                      <circleGeometry args={[0.03, 14]} />
                      <meshBasicMaterial color={PALETTE.blush} transparent opacity={0.62} />
                    </mesh>
                  </>
                )}

                {/* Eyebrows */}
                {mood === "angry" && (
                  <>
                    <group position={leftBrow.pos} rotation={leftBrow.rot}>
                      <mesh rotation={[0, 0, -0.42]}>
                        <planeGeometry args={[0.12, 0.022]} />
                        <meshBasicMaterial color={PALETTE.ink} />
                      </mesh>
                    </group>
                    <group position={rightBrow.pos} rotation={rightBrow.rot}>
                      <mesh rotation={[0, 0, 0.42]}>
                        <planeGeometry args={[0.12, 0.022]} />
                        <meshBasicMaterial color={PALETTE.ink} />
                      </mesh>
                    </group>
                  </>
                )}
                {(mood === "panic" || mood === "shy" || mood === "pinprick" || mood === "melt") && (
                  <>
                    <group position={leftBrow.pos} rotation={leftBrow.rot}>
                      <mesh rotation={[0, 0, 0.34]}>
                        <planeGeometry args={[0.09, 0.018]} />
                        <meshBasicMaterial color={PALETTE.ink} />
                      </mesh>
                    </group>
                    <group position={rightBrow.pos} rotation={rightBrow.rot}>
                      <mesh rotation={[0, 0, -0.34]}>
                        <planeGeometry args={[0.09, 0.018]} />
                        <meshBasicMaterial color={PALETTE.ink} />
                      </mesh>
                    </group>
                  </>
                )}
                {(mood === "sideeye" || mood === "smug") && (
                  <>
                    <group position={leftBrow.pos} rotation={leftBrow.rot}>
                      <mesh rotation={[0, 0, -0.08]}>
                        <planeGeometry args={[0.105, 0.02]} />
                        <meshBasicMaterial color={PALETTE.ink} />
                      </mesh>
                    </group>
                    <group position={rightBrow.pos} rotation={rightBrow.rot}>
                      <mesh rotation={[0, 0, 0.24]}>
                        <planeGeometry args={[0.105, 0.02]} />
                        <meshBasicMaterial color={PALETTE.ink} />
                      </mesh>
                    </group>
                  </>
                )}

                {/* Mouths */}
                <group position={mouth.pos} rotation={mouth.rot}>
                  {mood === "scream" && (
                    <>
                      <mesh>
                        <circleGeometry args={[0.068, 18]} />
                        <meshBasicMaterial color={PALETTE.ink} />
                      </mesh>
                      <mesh position={[0, -0.024, 0.003]}>
                        <circleGeometry args={[0.038, 14]} />
                        <meshBasicMaterial color="#DC6060" />
                      </mesh>
                      <mesh position={[0, 0.036, 0.004]}>
                        <planeGeometry args={[0.082, 0.02]} />
                        <meshBasicMaterial color="#FFFFFF" />
                      </mesh>
                    </>
                  )}
                  {(mood === "laugh" || mood === "fakegrin") && (
                    <>
                      <mesh position={[0, 0.012, 0]}>
                        <circleGeometry args={[0.074, 18, Math.PI, Math.PI]} />
                        <meshBasicMaterial color={PALETTE.ink} />
                      </mesh>
                      <mesh position={[0, -0.002, 0.003]}>
                        <planeGeometry args={[0.115, 0.022]} />
                        <meshBasicMaterial color="#FFFFFF" />
                      </mesh>
                      <mesh position={[0, -0.036, 0.002]}>
                        <circleGeometry args={[0.032, 12, 0, Math.PI]} />
                        <meshBasicMaterial color="#DC6060" />
                      </mesh>
                    </>
                  )}
                  {mood === "smile" && (
                    <mesh position={[0, 0.015, 0]}>
                      <ringGeometry args={[0.032, 0.047, 16, 1, Math.PI * 1.15, Math.PI * 0.7]} />
                      <meshBasicMaterial color={PALETTE.ink} />
                    </mesh>
                  )}
                  {(mood === "panic" || mood === "melt" || mood === "pinprick" || mood === "shy") && (
                    <mesh rotation={[0, 0, Math.sin(frame * 1.8) * 0.09]}>
                      <planeGeometry args={[0.066, 0.017]} />
                      <meshBasicMaterial color={PALETTE.ink} />
                    </mesh>
                  )}
                  {(mood === "sideeye" || mood === "angry" || mood === "smug" || mood === "calm") && (
                    <mesh rotation={[0, 0, mood === "smug" ? 0.14 : -0.05]}>
                      <planeGeometry args={[0.072, 0.016]} />
                      <meshBasicMaterial color={PALETTE.ink} />
                    </mesh>
                  )}
                </group>
              </group>
            );
          };

          // Cute Rounded Cartoon Sneaker (no sharp blocky shoes!)
          const CartoonSneaker: React.FC<{
            position: [number, number, number];
            rotation?: [number, number, number];
            color?: string;
            scale?: number;
            frame: number;
            seed: number;
          }> = ({ position, rotation = [0, 0, 0], color = PALETTE.heroShoes, scale = 1, frame, seed }) => (
            <group position={position} rotation={rotation} scale={[scale, scale, scale]}>
              <InkSphere args={[0.072, 14, 10]} position={[0, 0.045, 0.035]} scale={[0.92, 0.72, 1.55]} color={color} outline={0.011} frame={frame} seed={seed} />
              <InkCylinder args={[0.068, 0.072, 0.026, 14]} position={[0, 0.013, 0.035]} scale={[0.92, 1, 1.5]} color={PALETTE.heroSole} outline={0.008} frame={frame} seed={seed + 1} />
            </group>
          );

          // ------------------------------------------------------------------
          // CHARACTER 1: THE OVERTHINKER (Smooth Bean Body + Rubber-Hose Limbs)
          // ------------------------------------------------------------------
          const HERO_SHIRT_PROFILE: [number, number][] = [
            [0.185, 0.0],
            [0.18, 0.1],
            [0.168, 0.25],
            [0.158, 0.42],
            [0.145, 0.52],
            [0.095, 0.57],
            [0.045, 0.58],
          ];
          const HERO_SHORTS_PROFILE: [number, number][] = [
            [0.175, -0.06],
            [0.182, 0.04],
            [0.172, 0.13],
            [0.14, 0.15],
          ];

          export interface OverthinkerProps {
            position?: [number, number, number];
            rotation?: [number, number, number];
            frame: number;
            pose: "hunch" | "shy" | "grabbar" | "squatstrain" | "overheadpress" | "tumbled" | "realityempty";
            mood: MoodType;
            barY?: number;
            sweating?: boolean;
            waterfall?: boolean;
            tremble?: number;
            meltFactor?: number;
          }

          export const Overthinker: React.FC<OverthinkerProps> = ({
            position = [0, 0, 0],
            rotation = [0, 0, 0],
            frame,
            pose,
            mood,
            barY = 1.48,
            sweating = false,
            waterfall = false,
            tremble = 0,
            meltFactor = 0,
          }) => {
            const tx = tremble > 0 ? Math.sin(frame * 3.8) * tremble : 0;
            const tz = tremble > 0 ? Math.cos(frame * 4.2) * tremble * 0.45 : 0;

            const isSquat = pose === "squatstrain";
            const isPress = pose === "overheadpress";
            const isShy = pose === "shy";
            const isGrab = pose === "grabbar" || pose === "realityempty";
            const isTumbled = pose === "tumbled";

            const hipY = isTumbled ? 0.18 : isSquat ? 0.56 : 0.78;
            const torsoTilt = pose === "hunch" ? 0.16 : isSquat ? 0.12 : isTumbled ? -0.24 : 0;

            // Smooth Continuous Leg Curves (Hip -> Knee -> Ankle, ZERO gaps!)
            let leftLegPts: [number, number, number][];
            let rightLegPts: [number, number, number][];
            let leftFootPos: [number, number, number];
            let rightFootPos: [number, number, number];
            let footRotX = 0;

            if (isTumbled) {
              leftLegPts = [[-0.095, hipY + 0.02, 0.02], [-0.22, 0.16, 0.28], [-0.28, 0.08, 0.52]];
              rightLegPts = [[0.095, hipY + 0.02, 0.02], [0.22, 0.16, 0.28], [0.28, 0.08, 0.52]];
              leftFootPos = [-0.28, 0.06, 0.54];
              rightFootPos = [0.28, 0.06, 0.54];
              footRotX = -0.75;
            } else if (isSquat) {
              leftLegPts = [[-0.1, hipY + 0.02, 0], [-0.27, 0.36, 0.18], [-0.22, 0.06, 0.02]];
              rightLegPts = [[0.1, hipY + 0.02, 0], [0.27, 0.36, 0.18], [0.22, 0.06, 0.02]];
              leftFootPos = [-0.22, 0.0, 0.02];
              rightFootPos = [0.22, 0.0, 0.02];
            } else {
              // Natural relaxed standing stance with gentle organic knee curvature
              leftLegPts = [[-0.095, hipY + 0.03, 0], [-0.115, hipY * 0.5, 0.03], [-0.125, 0.06, 0]];
              rightLegPts = [[0.095, hipY + 0.03, 0], [0.115, hipY * 0.5, 0.03], [0.125, 0.06, 0]];
              leftFootPos = [-0.125, 0.0, 0];
              rightFootPos = [0.125, 0.0, 0];
            }

            // Smooth Continuous Arm Curves (Shoulder -> Elbow -> Hand, in Upper-Body local coords)
            const localBarY = Math.max(0.28, barY - (hipY + 0.08));
            let leftArmPts: [number, number, number][];
            let rightArmPts: [number, number, number][];

            if (isShy) {
              // Iconic 👉👈 shy finger-poking pose right in front of chest!
              const wiggle = Math.sin(frame * 0.55) * 0.015;
              leftArmPts = [[-0.155, 0.48, 0], [-0.24, 0.32, 0.14], [-0.055 + wiggle, 0.34, 0.27]];
              rightArmPts = [[0.155, 0.48, 0], [0.24, 0.32, 0.14], [0.055 - wiggle, 0.34, 0.27]];
            } else if (isGrab || isSquat) {
              // Smoothly reaching out & gripping the barbell shaft!
              leftArmPts = [[-0.155, 0.48, 0], [-0.39, 0.37, 0.02], [-0.52, localBarY, -0.02]];
              rightArmPts = [[0.155, 0.48, 0], [0.39, 0.37, 0.02], [0.52, localBarY, -0.02]];
            } else if (isPress) {
              // Pushing giant barbell straight overhead!
              const midY = (0.48 + localBarY) * 0.5;
              leftArmPts = [[-0.155, 0.48, 0], [-0.37, midY, 0.02], [-0.5, localBarY, 0.0]];
              rightArmPts = [[0.155, 0.48, 0], [0.37, midY, 0.02], [0.5, localBarY, 0.0]];
            } else if (isTumbled) {
              // Flailing arms in panic on floor
              const flail = Math.sin(frame * 1.2) * 0.08;
              leftArmPts = [[-0.155, 0.48, 0], [-0.34, 0.52 + flail, 0.14], [-0.42, 0.68 + flail, 0.22]];
              rightArmPts = [[0.155, 0.48, 0], [0.34, 0.52 - flail, 0.14], [0.42, 0.68 - flail, 0.22]];
            } else {
              // Nervous hunched panic stance (hands nervously curled near stomach)
              leftArmPts = [[-0.155, 0.48, 0], [-0.25, 0.28, 0.08], [-0.15, 0.14, 0.17]];
              rightArmPts = [[0.155, 0.48, 0], [0.25, 0.28, 0.08], [0.15, 0.14, 0.17]];
            }

            return (
              <group position={[position[0] + tx, position[1], position[2] + tz]} rotation={rotation}>
                {/* Soft Ground Contact Shadow */}
                <mesh rotation={[-Math.PI / 2, 0, 0]} position={[0, 0.01, 0]}>
                  <circleGeometry args={[0.38, 22]} />
                  <meshBasicMaterial color="#C8B68C" transparent opacity={0.5} />
                </mesh>

                {/* Seamless Noodle Legs */}
                <SmoothTube points={leftLegPts} radius={0.044} color={PALETTE.skin} outline={0.012} />
                <SmoothTube points={rightLegPts} radius={0.044} color={PALETTE.skin} outline={0.012} />

                {/* Cute Rounded Sneakers */}
                <CartoonSneaker position={leftFootPos} rotation={[footRotX, 0.08, 0]} frame={frame} seed={105} />
                <CartoonSneaker position={rightFootPos} rotation={[footRotX, -0.08, 0]} frame={frame} seed={108} />

                {/* Sculpted Shorts Pelvis (cleanly hides leg-to-hip join!) */}
                <SmoothLathe profile={HERO_SHORTS_PROFILE} position={[0, hipY - 0.02, 0]} color={PALETTE.heroShorts} outline={0.013} />

                {/* Upper Body */}
                <group position={[0, hipY + 0.08, 0]} rotation={[torsoTilt, 0, 0]}>
                  {/* Sculpted Organic T-Shirt Torso */}
                  <SmoothLathe profile={HERO_SHIRT_PROFILE} position={[0, 0, 0]} color={PALETTE.heroShirt} outline={0.014} />

                  {/* Neck */}
                  <InkCylinder args={[0.042, 0.048, 0.12, 14]} position={[0, 0.61, 0]} color={PALETTE.skin} outline={0.011} frame={frame} seed={115} />

                  {/* Seamless Rubber-Hose Noodle Arms */}
                  <SmoothTube points={leftArmPts} radius={0.038} color={PALETTE.skin} outline={0.012} />
                  <SmoothTube points={rightArmPts} radius={0.038} color={PALETTE.skin} outline={0.012} />

                  {/* Expressive Oversized Round Doodle Head */}
                  <group position={[0, 0.86, 0.02]} scale={[1 - meltFactor * 0.16, 1 + meltFactor * 0.28, 1]}>
                    <InkSphere args={[0.25, 28, 22]} color={PALETTE.skin} outline={0.015} frame={frame} seed={130} />
                    {/* Subtle doodle hair ahoge strands */}
                    <SmoothTube points={[[0, 0.24, 0], [-0.03, 0.31, 0.01], [-0.07, 0.3, 0.02]]} radius={0.014} color={PALETTE.ink} outline={0} segments={8} />
                    <SmoothTube points={[[0.01, 0.24, 0], [0.05, 0.3, 0.01], [0.09, 0.28, 0.02]]} radius={0.012} color={PALETTE.ink} outline={0} segments={8} />

                    <CartoonFace mood={mood} frame={frame} headR={0.25} />

                    {/* Flying Panic Sweat Drops */}
                    {sweating &&
                      [0, 1, 2, 3, 4, 5].map((i) => {
                        const phase = (frame * 0.07 + i * 0.19) % 1;
                        const angle = (i / 6) * Math.PI * 1.35 - 0.18;
                        const dist = 0.29 + phase * 0.32;
                        return (
                          <InkSphere
                            key={i}
                            args={[0.026 * (1 - phase * 0.45), 10, 8]}
                            position={[Math.cos(angle) * dist, Math.sin(angle) * dist + 0.06 - phase * 0.14, 0.1]}
                            scale={[0.8, 1.35, 0.8]}
                            color={PALETTE.sweatBlue}
                            outline={0.008}
                            frame={frame}
                            seed={140 + i}
                          />
                        );
                      })}

                    {/* CLEAN DUAL-EYE CURVED TEAR WATERFALL ARCS (flows gracefully OUT from eyes -> DOWN to floor puddle!) */}
                    {waterfall && (
                      <group>
                        <SmoothTube
                          points={[
                            [-0.09, 0.01, 0.24],
                            [-0.22, -0.05, 0.3],
                            [-0.27, -0.78, 0.26],
                            [-0.24, -1.66, 0.18],
                          ]}
                          radius={0.042}
                          color={PALETTE.sweatBlue}
                          outline={0.01}
                          segments={20}
                        />
                        <SmoothTube
                          points={[
                            [0.09, 0.01, 0.24],
                            [0.22, -0.05, 0.3],
                            [0.27, -0.78, 0.26],
                            [0.24, -1.66, 0.18],
                          ]}
                          radius={0.042}
                          color={PALETTE.sweatBlue}
                          outline={0.01}
                          segments={20}
                        />
                        {/* Splashing Puddle */}
                        <InkCylinder
                          args={[0.64 + Math.sin(frame * 0.85) * 0.06, 0.64, 0.025, 24]}
                          position={[0, -1.68, 0.08]}
                          color={PALETTE.sweatBlue}
                          outline={0.012}
                          frame={frame}
                          seed={155}
                        />
                      </group>
                    )}
                  </group>
                </group>
              </group>
            );
          };

          // ------------------------------------------------------------------
          // CHARACTER 2: LAT PULLDOWN GYM GIRL (Sculpted Hourglass + Smooth Ponytail)
          // ------------------------------------------------------------------
          const GIRL_TOP_PROFILE: [number, number][] = [
            [0.125, 0.16],
            [0.142, 0.28],
            [0.148, 0.42],
            [0.132, 0.49],
            [0.05, 0.52],
          ];
          const GIRL_WAIST_PROFILE: [number, number][] = [
            [0.158, -0.04],
            [0.162, 0.05],
            [0.132, 0.15],
            [0.12, 0.19],
          ];

          export const GymGirl: React.FC<{
            position?: [number, number, number];
            rotation?: [number, number, number];
            frame: number;
            mode: "pulldown" | "glare" | "judge" | "pointlaugh";
            pulldownProgress?: number;
            headYawOverride?: number;
          }> = ({ position = [0, 0, 0], rotation = [0, 0, 0], frame, mode, pulldownProgress = 0, headYawOverride }) => {
            const isSeated = mode === "pulldown" || mode === "glare";
            const headYaw = headYawOverride !== undefined ? headYawOverride : mode === "glare" ? -1.45 : 0;
            const mood: MoodType =
              mode === "glare" ? "angry" : mode === "judge" ? "sideeye" : mode === "pointlaugh" ? "laugh" : "calm";

            const hipY = isSeated ? 0.69 : 0.78;

            // Smooth Leg Curves (Athletic high-waisted leggings)
            const leftLegPts: [number, number, number][] = isSeated
              ? [[-0.085, hipY, 0.04], [-0.095, hipY - 0.03, 0.41], [-0.095, 0.07, 0.43]]
              : [[-0.085, hipY, 0], [-0.095, hipY * 0.5, 0.02], [-0.1, 0.06, 0]];
            const rightLegPts: [number, number, number][] = isSeated
              ? [[0.085, hipY, 0.04], [0.095, hipY - 0.03, 0.41], [0.095, 0.07, 0.43]]
              : [[0.085, hipY, 0], [0.095, hipY * 0.5, 0.02], [0.1, 0.06, 0]];

            // Smooth Arm Curves (tracks Lat Bar when seated!)
            let leftArmPts: [number, number, number][];
            let rightArmPts: [number, number, number][];

            if (isSeated) {
              const barLocalY = 1.24 - pulldownProgress * 0.56;
              const elbowDrop = 0.76 - pulldownProgress * 0.42;
              leftArmPts = [[-0.145, 0.44, 0], [-0.36, elbowDrop, 0.14], [-0.42, barLocalY, 0.18]];
              rightArmPts = [[0.145, 0.44, 0], [0.36, elbowDrop, 0.14], [0.42, barLocalY, 0.18]];
            } else if (mode === "judge") {
              // Sassy hands on hips!
              leftArmPts = [[-0.145, 0.44, 0], [-0.31, 0.25, 0.04], [-0.16, 0.07, 0.06]];
              rightArmPts = [[0.145, 0.44, 0], [0.31, 0.25, 0.04], [0.16, 0.07, 0.06]];
            } else {
              // Pointing right at camera and laughing!
              const bounce = Math.sin(frame * 1.15) * 0.05;
              leftArmPts = [[-0.145, 0.44, 0], [-0.26, 0.24, 0.1], [-0.06, 0.18, 0.22]];
              rightArmPts = [[0.145, 0.44, 0], [0.22, 0.42 + bounce, 0.24], [0.12, 0.45 + bounce, 0.54]];
            }

            return (
              <group position={position} rotation={rotation}>
                {!isSeated && (
                  <mesh rotation={[-Math.PI / 2, 0, 0]} position={[0, 0.01, 0]}>
                    <circleGeometry args={[0.35, 20]} />
                    <meshBasicMaterial color="#C8B68C" transparent opacity={0.5} />
                  </mesh>
                )}

                {/* Seamless Legging Legs + Sneakers */}
                <SmoothTube points={leftLegPts} radius={0.05} color={PALETTE.girlLeggings} outline={0.012} />
                <SmoothTube points={rightLegPts} radius={0.05} color={PALETTE.girlLeggings} outline={0.012} />
                <CartoonSneaker position={isSeated ? [-0.095, 0.0, 0.44] : [-0.1, 0.0, 0]} scale={0.94} frame={frame} seed={205} />
                <CartoonSneaker position={isSeated ? [0.095, 0.0, 0.44] : [0.1, 0.0, 0]} scale={0.94} frame={frame} seed={208} />

                {/* High-Waisted Leggings Hips */}
                <SmoothLathe profile={GIRL_WAIST_PROFILE} position={[0, hipY - 0.02, 0]} color={PALETTE.girlLeggings} outline={0.013} />

                {/* Upper Body */}
                <group position={[0, hipY + 0.06, 0]}>
                  {/* Midriff + Sculpted Crop Top */}
                  <InkCylinder args={[0.118, 0.128, 0.16, 18]} position={[0, 0.12, 0]} color={PALETTE.skin} outline={0.012} frame={frame} seed={214} />
                  <SmoothLathe profile={GIRL_TOP_PROFILE} position={[0, 0, 0]} color={PALETTE.girlTop} outline={0.013} />
                  <InkCylinder args={[0.04, 0.044, 0.11, 14]} position={[0, 0.54, 0]} color={PALETTE.skin} outline={0.01} frame={frame} seed={215} />

                  {/* Draped Smooth Gym Towel around neck */}
                  <SmoothTube
                    points={[
                      [-0.085, 0.2, 0.14],
                      [-0.105, 0.44, 0.11],
                      [0, 0.49, -0.09],
                      [0.105, 0.44, 0.11],
                      [0.085, 0.22, 0.14],
                    ]}
                    radius={0.028}
                    color={PALETTE.girlTowel}
                    outline={0.01}
                    segments={20}
                  />

                  {/* Seamless Arms */}
                  <SmoothTube points={leftArmPts} radius={0.036} color={PALETTE.skin} outline={0.012} />
                  <SmoothTube points={rightArmPts} radius={0.036} color={PALETTE.skin} outline={0.012} />

                  {/* Sculpted Head + Smooth Ponytail (NO blocky boxes!) */}
                  <group position={[0, 0.77, 0.01]} rotation={[0, headYaw, mode === "pointlaugh" ? Math.sin(frame * 1.1) * 0.09 : 0]}>
                    <InkSphere args={[0.22, 26, 20]} color={PALETTE.skin} outline={0.014} frame={frame} seed={230} />
                    {/* Smooth sculpted hair cap */}
                    <InkSphere args={[0.228, 24, 18]} position={[0, 0.032, -0.038]} scale={[1.01, 1.02, 1.01]} color={PALETTE.girlHair} outline={0.014} frame={frame} seed={231} />
                    {/* Soft swept bangs */}
                    <SmoothTube points={[[0.02, 0.21, 0.09], [-0.11, 0.16, 0.17], [-0.18, 0.04, 0.14]]} radius={0.042} color={PALETTE.girlHair} outline={0.011} segments={10} />
                    <SmoothTube points={[[-0.02, 0.21, 0.09], [0.11, 0.16, 0.17], [0.18, 0.04, 0.14]]} radius={0.042} color={PALETTE.girlHair} outline={0.011} segments={10} />
                    {/* Flowing curved high ponytail */}
