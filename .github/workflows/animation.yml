# ==============================================================================
# GitHub Actions Workflow: "Overthinker at the Gym" Modern 2D Cel-Shaded 3D (v5)
# Stack: Remotion 4 + Three.js (Custom 2-Tone Cel Shader + Tapered Anatomical Limbs
#        + Sculpted Heads/Hands + Detailed Gym Equipment) + Synced Comedy WAV SFX
# Output: 1080x1920 (9:16 Vertical Short), 30fps, 32s (960 frames), H.264 MP4
# ==============================================================================

name: Render Funny Gym Overthinker Animation (Modern 2D Cel v5)

on:
  workflow_dispatch:
    inputs:
      quality_crf:
        description: "FFmpeg H.264 CRF quality (14=ultra, 18=high, 23=standard)"
        required: false
        default: "18"
      concurrency:
        description: "Remotion render worker concurrency (auto-capped to runner cores)"
        required: false
        default: "2"
      include_audio:
        description: "Include synced procedural comedy SFX, heartbeat & gym foley"
        type: boolean
        required: false
        default: true

jobs:
  render-overthinker-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install headless Chromium, WebGL (SwiftShader/ANGLE) & FFmpeg libs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            fonts-noto-color-emoji \
            fonts-dejavu-core
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Scaffold Modern 2D Cel-Shaded Remotion + Three.js Project (v5)
        run: |
          rm -rf gym-anim
          mkdir -p gym-anim/src/scene gym-anim/src/components gym-anim/src/utils gym-anim/scripts gym-anim/public gym-anim/out

          # --------------------------------------------------------------------
          # 1. package.json
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/package.json
          {
            "name": "overthinker-at-the-gym-v5",
            "version": "5.0.0",
            "private": true,
            "scripts": {
              "audio": "node scripts/generate-audio.mjs",
              "render": "remotion render src/index.ts OverthinkerAtGym out/overthinker-at-gym.mp4"
            },
            "dependencies": {
              "@react-three/fiber": "8.17.10",
              "@remotion/bundler": "4.0.242",
              "@remotion/cli": "4.0.242",
              "@remotion/three": "4.0.242",
              "react": "18.3.1",
              "react-dom": "18.3.1",
              "remotion": "4.0.242",
              "three": "0.169.0"
            },
            "devDependencies": {
              "@types/react": "18.3.12",
              "@types/three": "0.169.0",
              "typescript": "5.6.3"
            }
          }
          EOF

          # --------------------------------------------------------------------
          # 2. tsconfig.json & remotion.config.ts
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/tsconfig.json
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "ESNext",
              "moduleResolution": "bundler",
              "jsx": "react-jsx",
              "strict": false,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "forceConsistentCasingInFileNames": true,
              "lib": ["DOM", "ES2022"]
            },
            "include": ["src"]
          }
          EOF

          cat << 'EOF' > gym-anim/remotion.config.ts
          import { Config } from "@remotion/cli/config";
          Config.setVideoImageFormat("jpeg");
          Config.setOverwriteOutput(true);
          Config.setChromiumOpenGlRenderer("swangle");
          Config.setPixelFormat("yuv420p");
          EOF

          # --------------------------------------------------------------------
          # 3. Synced Comedy SFX, Heartbeat & Gym Foley Synthesizer (scripts/generate-audio.mjs)
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/scripts/generate-audio.mjs
          import fs from "node:fs";
          import path from "node:path";

          const SAMPLE_RATE = 44100;
          const DURATION = 32;
          const TOTAL_SAMPLES = SAMPLE_RATE * DURATION;
          const left = new Float32Array(TOTAL_SAMPLES);
          const right = new Float32Array(TOTAL_SAMPLES);
          const clamp = (v, min = -1, max = 1) => Math.max(min, Math.min(max, v));
          const addSample = (idx, l, r = l) => { if (idx >= 0 && idx < TOTAL_SAMPLES) { left[idx] += l; right[idx] += r; } };

          let rngState = 1337420;
          const rand = () => { rngState = (rngState * 1664525 + 1013904223) >>> 0; return (rngState / 4294967296) * 2 - 1; };

          function addLofiSegment(startSec, endSec, gain = 0.25) {
            const chords = [
              [261.63, 329.63, 392.0, 493.88], [220.0, 261.63, 329.63, 392.0],
              [174.61, 220.0, 261.63, 329.63], [196.0, 246.94, 293.66, 349.23],
            ];
            const s = Math.floor(startSec * SAMPLE_RATE), e = Math.floor(endSec * SAMPLE_RATE);
            for (let i = s; i < e; i++) {
              const t = i / SAMPLE_RATE, lt = t - startSec;
              const ci = Math.floor(lt / 1.2) % chords.length, ct = lt % 1.2;
              const env = Math.min(1, ct * 18) * Math.exp(-ct * 1.45);
              let sig = 0;
              for (const f of chords[ci]) {
                const vib = 1 + 0.003 * Math.sin(2 * Math.PI * 4.5 * t);
                sig += Math.sin(2 * Math.PI * f * vib * t) * 0.65 + Math.sin(2 * Math.PI * f * 2 * vib * t) * 0.15 * Math.exp(-ct * 5);
              }
              const bt = lt % 0.6;
              const kick = Math.sin(2 * Math.PI * (110 * Math.exp(-bt * 28) + 42) * bt) * Math.exp(-bt * 12) * 0.45;
              const fade = Math.min(1, lt * 6, (endSec - t) * 10);
              const val = (sig * 0.25 * env + kick) * gain * Math.max(0, fade);
              addSample(i, val * 0.96, val * 1.04);
            }
          }

          function addWeightClank(timeSec, gain = 0.22) {
            const s = Math.floor(timeSec * SAMPLE_RATE), len = Math.floor(0.26 * SAMPLE_RATE);
            for (let n = 0; n < len; n++) {
              const t = n / SAMPLE_RATE, env = Math.min(1, t * 400) * Math.exp(-t * 24);
              const m = Math.sin(2 * Math.PI * 385 * t) * 0.55 + Math.sin(2 * Math.PI * 742 * t) * 0.38 + Math.sin(2 * Math.PI * 1290 * t) * 0.25 + rand() * 0.2 * Math.exp(-t * 45);
              addSample(s + n, m * env * gain, m * env * gain * 0.94);
            }
          }

          function addSnapWhoosh(timeSec, gain = 0.26) {
            const s = Math.floor(timeSec * SAMPLE_RATE), len = Math.floor(0.2 * SAMPLE_RATE);
            let lp = 0;
            for (let n = 0; n < len; n++) {
              const p = n / len; lp = lp * 0.72 + rand() * 0.28;
              const v = (lp * 0.9 + Math.sin(2 * Math.PI * (240 + p * 950) * (n / SAMPLE_RATE)) * 0.22) * Math.sin(p * Math.PI) * gain;
              addSample(s + n, v, v);
            }
          }

          function addVineBoom(timeSec, intensity = 0.82) {
            const s = Math.floor(timeSec * SAMPLE_RATE), len = Math.floor(1.35 * SAMPLE_RATE);
            let ph = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SAMPLE_RATE; ph += (2 * Math.PI * (142 * Math.exp(-t * 9.5) + 33)) / SAMPLE_RATE;
              const env = Math.min(1, t * 250) * Math.exp(-t * 2.95);
              const v = Math.tanh((Math.sin(ph) * 1.55 + Math.sin(ph * 2) * 0.32 + rand() * 0.16 * Math.exp(-t * 24)) * 1.45) * env * intensity;
              addSample(s + n, v, v);
            }
          }

          function addAnxiousHeartbeat(startSec, endSec, startBpm = 108, endBpm = 180, gain = 0.44) {
            let t = startSec;
            while (t < endSec) {
              const prog = (t - startSec) / Math.max(0.01, endSec - startSec);
              const bi = 60 / (startBpm + (endBpm - startBpm) * prog);
              for (const p of [{ o: 0, f0: 95, a: 1 }, { o: Math.min(0.14, bi * 0.3), f0: 118, a: 0.72 }]) {
                const ps = Math.floor((t + p.o) * SAMPLE_RATE), len = Math.floor(0.14 * SAMPLE_RATE);
                for (let n = 0; n < len; n++) {
                  const nt = n / SAMPLE_RATE;
                  const v = Math.sin(2 * Math.PI * (p.f0 * Math.exp(-nt * 16) + 38) * nt) * Math.min(1, nt * 160) * Math.exp(-nt * 22) * gain * p.a;
                  addSample(ps + n, v, v);
                }
              }
              t += bi;
            }
            const s = Math.floor(startSec * SAMPLE_RATE), e = Math.floor(endSec * SAMPLE_RATE);
            for (let i = s; i < e; i++) {
              const lt = (i - s) / SAMPLE_RATE, fade = Math.min(1, lt * 6, (endSec - startSec - lt) * 8);
              const v = Math.sin(2 * Math.PI * (440 + 38 * Math.sin(2 * Math.PI * 16 * lt)) * lt) * 0.04 * Math.max(0, fade);
              addSample(i, v, v);
            }
          }

          function addTensionDrone(startSec, endSec, gain = 0.3) {
            const s = Math.floor(startSec * SAMPLE_RATE), e = Math.floor(endSec * SAMPLE_RATE), dur = endSec - startSec;
            let p1 = 0, p2 = 0, p3 = 0;
            for (let i = s; i < e; i++) {
              const pr = (i - s) / (e - s);
              p1 += (2 * Math.PI * (65 + pr * 42)) / SAMPLE_RATE;
              p2 += (2 * Math.PI * (98 + pr * 68)) / SAMPLE_RATE;
              p3 += (2 * Math.PI * (131 + pr * 148)) / SAMPLE_RATE;
              const env = Math.min(1, pr * 5) * Math.min(1, (1 - pr) * 12) * (0.78 + 0.22 * Math.sin(2 * Math.PI * (3 + pr * 8) * (pr * dur)));
              const v = Math.tanh((Math.sin(p1) + 0.7 * Math.sin(p2) + 0.45 * Math.sin(p3)) * 1.35) * env * gain;
              addSample(i, v, v);
            }
          }

          function addWaterfall(startSec, endSec, gain = 0.34) {
            const s = Math.floor(startSec * SAMPLE_RATE), e = Math.floor(endSec * SAMPLE_RATE);
            let lp = 0;
            for (let i = s; i < e; i++) {
              const pr = (i - s) / (e - s); lp = lp * 0.82 + rand() * 0.18;
              const env = Math.min(1, pr * 12) * Math.min(1, (1 - pr) * 8);
              const v = (lp * 1.65 + Math.sin(2 * Math.PI * (310 + 160 * Math.sin(pr * 44)) * (i / SAMPLE_RATE)) * 0.14) * env * gain;
              addSample(i, v, v * 0.92);
            }
          }

          function addBarbellCrash(timeSec) {
            const s = Math.floor(timeSec * SAMPLE_RATE), len = Math.floor(1.1 * SAMPLE_RATE);
            let lp = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SAMPLE_RATE; lp = lp * 0.65 + rand() * 0.35;
              const thud = Math.sin(2 * Math.PI * (90 * Math.exp(-t * 16) + 28) * t) * Math.exp(-t * 5.5) * 0.78;
              const clang = (Math.sin(2 * Math.PI * 412 * t) + Math.sin(2 * Math.PI * 637 * t) + Math.sin(2 * Math.PI * 981 * t)) * Math.exp(-t * 7.5) * 0.24;
              const boing = Math.sin(2 * Math.PI * (180 + 95 * Math.sin(2 * Math.PI * 11 * t)) * t) * Math.exp(-t * 3.8) * 0.2;
              const v = clamp(thud + clang + lp * Math.exp(-t * 10) * 0.42 + boing);
              addSample(s + n, v, v);
            }
          }

          function addFeverDreamLaugh(startSec, endSec, gain = 0.32) {
            const s = Math.floor(startSec * SAMPLE_RATE), e = Math.floor(endSec * SAMPLE_RATE);
            let ph = 0;
            for (let i = s; i < e; i++) {
              const t = (i - s) / SAMPLE_RATE, pr = (i - s) / (e - s), hr = 7.2 + pr * 4.2;
              const he = Math.pow(Math.max(0, Math.sin(Math.PI * hr * t)), 1.6);
              ph += (2 * Math.PI * Math.max(120, (470 - pr * 105) + 185 * Math.sin(2 * Math.PI * (hr * 0.5) * t) + 65 * Math.sin(2 * Math.PI * 20 * t))) / SAMPLE_RATE;
              const w = Math.tanh((Math.sin(ph) + 0.55 * Math.sin(ph * 2.02) + 0.28 * Math.sin(ph * 3.01)) * 1.25);
              const pan = 0.5 + 0.45 * Math.sin(2 * Math.PI * 3.2 * t);
              const v = w * he * gain * Math.max(0, Math.min(1, t * 8, (endSec - startSec - t) * 14));
              addSample(i, v * (1.4 - pan), v * (0.6 + pan));
            }
          }

          function addRecordScratch(timeSec) {
            const s = Math.floor(timeSec * SAMPLE_RATE), len = Math.floor(0.28 * SAMPLE_RATE);
            let ph = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SAMPLE_RATE; ph += (2 * Math.PI * (1400 - 1100 * Math.sin((t / 0.28) * Math.PI * 1.5))) / SAMPLE_RATE;
              const v = (Math.sin(ph) * 0.5 + rand() * 0.25) * Math.sin((n / len) * Math.PI) * 0.5;
              addSample(s + n, v, v);
            }
          }

          function addPoliteChime(timeSec) {
            for (const note of [{ o: 0, f: 880 }, { o: 0.14, f: 1174.66 }]) {
              const s = Math.floor((timeSec + note.o) * SAMPLE_RATE), len = Math.floor(0.65 * SAMPLE_RATE);
              for (let n = 0; n < len; n++) {
                const t = n / SAMPLE_RATE, env = Math.min(1, t * 90) * Math.exp(-t * 6.5);
                const v = (Math.sin(2 * Math.PI * note.f * t) + 0.25 * Math.sin(2 * Math.PI * note.f * 2 * t)) * env * 0.35;
                addSample(s + n, v, v);
              }
            }
          }

          function addCartoonZipOut(timeSec) {
            const s = Math.floor(timeSec * SAMPLE_RATE), len = Math.floor(0.52 * SAMPLE_RATE);
            let ph = 0;
            for (let n = 0; n < len; n++) {
              const t = n / SAMPLE_RATE; ph += (2 * Math.PI * (2400 * Math.exp(-t * 6.4) + 120)) / SAMPLE_RATE;
              const v = Math.sin(ph) * Math.min(1, t * 65) * Math.exp(-t * 3.6) * 0.5 + rand() * Math.exp(-t * 9) * 0.28;
              addSample(s + n, v, v);
            }
            addVineBoom(timeSec + 0.2, 0.72);
          }

          addLofiSegment(0.0, 2.15, 0.26);
          addWeightClank(0.75, 0.2); addWeightClank(1.5, 0.22);
          addSnapWhoosh(1.92, 0.26); addVineBoom(2.15, 0.82);
          addAnxiousHeartbeat(2.4, 4.45, 110, 165, 0.44);
          addSnapWhoosh(4.32, 0.25); addVineBoom(4.45, 0.8);
          addSnapWhoosh(6.72, 0.26); addVineBoom(6.85, 0.78);
          addAnxiousHeartbeat(7.85, 10.6, 125, 190, 0.48);
          addTensionDrone(10.6, 17.8, 0.32); addVineBoom(12.55, 0.88);
          addWaterfall(15.65, 18.0, 0.35); addBarbellCrash(18.0);
          addSnapWhoosh(19.55, 0.26); addVineBoom(19.65, 0.85);
          addFeverDreamLaugh(20.1, 23.9, 0.34); addRecordScratch(24.0);
          addLofiSegment(24.3, 28.9, 0.25); addWeightClank(26.1, 0.18);
          addVineBoom(27.0, 0.76); addPoliteChime(28.55); addCartoonZipOut(30.0);

          const dataSize = TOTAL_SAMPLES * 4, buffer = Buffer.alloc(44 + dataSize);
          buffer.write("RIFF", 0); buffer.writeUInt32LE(36 + dataSize, 4); buffer.write("WAVE", 8);
          buffer.write("fmt ", 12); buffer.writeUInt32LE(16, 16); buffer.writeUInt16LE(1, 20); buffer.writeUInt16LE(2, 22);
          buffer.writeUInt32LE(SAMPLE_RATE, 24); buffer.writeUInt32LE(SAMPLE_RATE * 4, 28); buffer.writeUInt16LE(4, 32); buffer.writeUInt16LE(16, 34);
          buffer.write("data", 36); buffer.writeUInt32LE(dataSize, 40);
          let offset = 44;
          for (let i = 0; i < TOTAL_SAMPLES; i++) {
            buffer.writeInt16LE(Math.round(clamp(Math.tanh(left[i] * 0.92)) * 32767), offset);
            buffer.writeInt16LE(Math.round(clamp(Math.tanh(right[i] * 0.92)) * 32767), offset + 2);
            offset += 4;
          }
          fs.writeFileSync(path.join("public", "soundtrack.wav"), buffer);
          console.log(`Generated v5 soundtrack WAV (${(buffer.length / 1024 / 1024).toFixed(2)} MB)`);
          EOF

          # --------------------------------------------------------------------
          # 4. Modern 2D Cel Palette & Motion Helpers (src/utils/animation.ts)
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/src/utils/animation.ts
          export const PALETTE = {
