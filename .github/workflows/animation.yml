          import React, { useEffect, useMemo } from "react";
          import * as THREE from "three";
          import { PALETTE, boilJitter } from "../utils/animation";
    
          const CEL_VERT = `
            varying vec3 vNormalW;
            varying vec3 vViewDir;
            void main() {
              vec4 worldPos = modelMatrix * vec4(position, 1.0);
              vNormalW = normalize(mat3(modelMatrix) * normal);
              vViewDir = normalize(cameraPosition - worldPos.xyz);
              gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
          `;
    
          // 3-Tone Modern Anime Cel Shader (Highlight + Crisp Lit Base + Warm Shadow + Subtle Bottom AO + Rim)
          const CEL_FRAG = `
            uniform vec3 uColor;
            uniform vec3 uShadowColor;
            uniform vec3 uHighlightColor;
            uniform float uRim;
            varying vec3 vNormalW;
            varying vec3 vViewDir;
            void main() {
              vec3 N = normalize(vNormalW);
              vec3 V = normalize(vViewDir);
              vec3 L = normalize(vec3(0.42, 0.72, 0.56));
              float ndotl = dot(N, L);
              float shadowBand = smoothstep(0.04, 0.12, ndotl);
              float hiBand = smoothstep(0.76, 0.84, ndotl);
              vec3 col = mix(uShadowColor, uColor, shadowBand);
              col = mix(col, uHighlightColor, hiBand * 0.45);
              // Subtle cool-warm bottom crease AO
              float bottomAO = smoothstep(-0.25, -0.78, N.y);
              col = mix(col, uShadowColor * 0.92, bottomAO * 0.32);
              // Clean crisp modern 2D rim highlight
              float rim = smoothstep(0.62, 0.84, 1.0 - max(dot(N, V), 0.0)) * smoothstep(-0.08, 0.35, ndotl);
              col += vec3(0.2, 0.19, 0.17) * rim * uRim;
              gl_FragColor = vec4(col, 1.0);
            }
          `;
    
          const celMatCache = new Map<string, THREE.ShaderMaterial>();
    
          export function useCelMaterial(color: string, shadowColor?: string, rim = 0.45): THREE.ShaderMaterial {
            return useMemo(() => {
              const key = `${color}|${shadowColor ?? "auto"}|${rim}`;
              const existing = celMatCache.get(key);
              if (existing) return existing;
    
              const base = new THREE.Color(color);
              const hsl = { h: 0, s: 0, l: 0 };
              base.getHSL(hsl);
    
              const shadow = shadowColor
                ? new THREE.Color(shadowColor)
                : new THREE.Color().setHSL((hsl.h + 0.96) % 1, Math.min(1, hsl.s * 1.18 + 0.04), Math.max(0.06, hsl.l * 0.83));
              const highlight = new THREE.Color().setHSL(hsl.h, Math.max(0, hsl.s * 0.85), Math.min(1, hsl.l + 0.08));
    
              const mat = new THREE.ShaderMaterial({
                vertexShader: CEL_VERT,
                fragmentShader: CEL_FRAG,
                uniforms: {
                  uColor: { value: base },
                  uShadowColor: { value: shadow },
                  uHighlightColor: { value: highlight },
                  uRim: { value: rim },
                },
              });
              celMatCache.set(key, mat);
              return mat;
            }, [color, shadowColor, rim]);
          }
    
