          import { GymEnvironment, Barbell } from "./GymEnvironment";
          import { Overthinker, GymGirl, BuffBro, HelperGirl, FloatingMockingFaces } from "./Characters";
          import { PALETTE, cameraShake, easeOutBack, lerp, segProgress, smoothStep } from "../utils/animation";

          interface SceneProps {
            frame: number;
            fps: number;
          }

          interface CameraState {
            pos: [number, number, number];
            target: [number, number, number];
            fov: number;
            roll: number;
            shake: number;
          }

          const CameraRig: React.FC<{ state: CameraState; frame: number }> = ({ state, frame }) => {
            const { camera } = useThree();
            useLayoutEffect(() => {
              const [sx, sy, sr] = cameraShake(frame, state.shake);
              camera.position.set(state.pos[0] + sx, state.pos[1] + sy, state.pos[2]);
              camera.lookAt(state.target[0], state.target[1], state.target[2]);
              camera.rotation.z += state.roll + sr;
              if (camera instanceof THREE.PerspectiveCamera) {
                camera.fov = state.fov;
                camera.updateProjectionMatrix();
              }
            }, [camera, state, frame]);
            return null;
          };

          export const OverthinkerScene: React.FC<SceneProps> = ({ frame }) => {
            // =================================================================
            // 10-SHOT COMEDY TIMELINE (960 frames @ 30fps = 32.0s)
            // =================================================================
            // Shot 1 (0-72):    Peaceful Lat Pulldown Girl -> sudden glare snap
            // Shot 2 (72-155):  Overthinker trembling panic -> angry Girl snap
            // Shot 3 (155-235): Buff Bro heavy squats -> judgmental side-eye
