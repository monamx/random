          import React from "react";
          import { InkBox, InkCapsule, InkCylinder, InkSphere } from "./ToonMaterial";
          import { PALETTE } from "../utils/animation";

          // Expressive 2D-on-3D cartoon face module
          interface FaceProps {
            mood: "calm" | "sideeye" | "angry" | "panic" | "melt" | "shy" | "fakegrin" | "scream" | "laugh" | "smug" | "pinprick" | "blink";
            frame: number;
            zOffset?: number;
            eyeScale?: number;
          }

          export const CartoonFace: React.FC<FaceProps> = ({
            mood,
            frame,
            zOffset = 0.26,
            eyeScale = 1,
          }) => {
            const jitterX = (mood === "panic" || mood === "scream") ? Math.sin(frame * 2.9) * 0.015 : 0;
            const jitterY = (mood === "panic" || mood === "scream") ? Math.cos(frame * 3.4) * 0.015 : 0;

            const isHugeEyes = mood === "panic" || mood === "angry" || mood === "pinprick";
            const eScale = (isHugeEyes ? 1.48 : mood === "melt" ? 1.25 : 1.0) * eyeScale;
            const pupilSize = mood === "pinprick" ? 0.012 : mood === "panic" ? 0.018 : mood === "angry" ? 0.024 : 0.032;

            // Pupil look direction
            let px = 0;
            let py = 0;
            if (mood === "sideeye" || mood === "smug") px = 0.036;
            if (mood === "panic") {
              px = Math.sin(frame * 0.45) * 0.022;
              py = Math.cos(frame * 0.6) * 0.018;
            }

            return (
              <group position={[jitterX, jitterY, zOffset]}>
                {mood === "blink" ? (
                  <>
                    <mesh position={[-0.09, 0.02, 0.01]} rotation={[0, 0, -0.15]}>
                      <planeGeometry args={[0.11, 0.025]} />
