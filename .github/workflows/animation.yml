          // Rounded Ergonomic Pad using ExtrudeGeometry (realistic gym seats/cushions!)
          export const BeveledPad: React.FC<BaseInkProps & { width: number; height: number; depth: number; radius?: number }> = ({
            width, height, depth, radius = 0.05, position = [0, 0, 0], rotation = [0, 0, 0], color = PALETTE.machinePad, outline = 0.011,
          }) => {
            const mat = useCelMaterial(color, undefined, 0.3);
            const { mainGeo, outGeo } = useMemo(() => {
              const mk = (w: number, h: number, d: number, r: number) => {
                const s = new THREE.Shape();
                const hw = w / 2, hh = h / 2, cr = Math.min(r, hw * 0.8, hh * 0.8);
                s.moveTo(-hw + cr, -hh);
                s.lineTo(hw - cr, -hh); s.quadraticCurveTo(hw, -hh, hw, -hh + cr);
                s.lineTo(hw, hh - cr); s.quadraticCurveTo(hw, hh, hw - cr, hh);
                s.lineTo(-hw + cr, hh); s.quadraticCurveTo(-hw, hh, -hw, hh - cr);
                s.lineTo(-hw, -hh + cr); s.quadraticCurveTo(-hw, -hh, -hw + cr, -hh);
                const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: true, bevelThickness: 0.022, bevelSize: 0.022, bevelSegments: 3 });
                g.center();
                return g;
              };
              return {
                mainGeo: mk(width, height, depth, radius),
                outGeo: outline > 0 ? mk(width + outline * 2, height + outline * 2, depth + outline * 2, radius + outline) : null,
              };
            }, [width, height, depth, radius, outline]);

            useEffect(() => () => { mainGeo.dispose(); outGeo?.dispose(); }, [mainGeo, outGeo]);

            return (
              <group position={position} rotation={rotation}>
                <mesh geometry={mainGeo} material={mat} />
                {outGeo && <mesh geometry={outGeo}><meshBasicMaterial color={PALETTE.ink} side={THREE.BackSide} /></mesh>}
              </group>
            );
          };

          // Build a true variable-radius anatomical tube along CatmullRomCurve3 (Bicep->Elbow->Forearm->Wrist, Thigh->Knee->Calf->Ankle!)
          function buildTaperedTubeGeo(
            curve: THREE.CatmullRomCurve3,
            radii: number[],
            tubularSegs: number,
            radialSegs: number,
            extraRadius: number
          ): THREE.BufferGeometry {
            const frames = curve.computeFrenetFrames(tubularSegs, false);
            const positions: number[] = [];
            const normals: number[] = [];
            const indices: number[] = [];

            const sampleRadius = (u: number) => {
              const scaled = u * (radii.length - 1);
              const idx = Math.min(radii.length - 2, Math.floor(scaled));
              const frac = scaled - idx;
              return radii[idx] + (radii[idx + 1] - radii[idx]) * frac + extraRadius;
            };

            const P = new THREE.Vector3();
            const N = new THREE.Vector3();
            const v = new THREE.Vector3();

            for (let i = 0; i <= tubularSegs; i++) {
              const u = i / tubularSegs;
              curve.getPointAt(u, P);
              const r = Math.max(0.004, sampleRadius(u));
              const normal = frames.normals[i];
              const binormal = frames.binormals[i];
              for (let j = 0; j <= radialSegs; j++) {
                const theta = (j / radialSegs) * Math.PI * 2;
                const sin = Math.sin(theta), cos = -Math.cos(theta);
                N.x = cos * normal.x + sin * binormal.x;
                N.y = cos * normal.y + sin * binormal.y;
                N.z = cos * normal.z + sin * binormal.z;
                N.normalize();
                v.x = P.x + r * N.x;
                v.y = P.y + r * N.y;
                v.z = P.z + r * N.z;
                positions.push(v.x, v.y, v.z);
                normals.push(N.x, N.y, N.z);
              }
            }

            const stride = radialSegs + 1;
            for (let i = 0; i < tubularSegs; i++) {
              for (let j = 0; j < radialSegs; j++) {
                const a = i * stride + j;
                const b = (i + 1) * stride + j;
                const c = (i + 1) * stride + (j + 1);
                const d = i * stride + (j + 1);
                indices.push(a, b, d, b, c, d);
              }
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
            geo.setIndex(indices);
            return geo;
          }

          export const TaperedLimb: React.FC<{
            points: [number, number, number][];
            radii: number[]; // anatomical radius profile from start -> end
            color?: string;
            shadowColor?: string;
            outline?: number;
            segments?: number;
            startCap?: boolean;
            endCap?: boolean;
          }> = ({
            points, radii, color = PALETTE.skin, shadowColor, outline = 0.012, segments = 20, startCap = true, endCap = true,
          }) => {
            const mat = useCelMaterial(color, shadowColor, 0.42);
            const key = points.map((p) => p.map((n) => n.toFixed(3)).join(",")).join("|") + "::" + radii.map((r) => r.toFixed(3)).join(",");

            const { mainGeo, outGeo } = useMemo(() => {
              const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(p[0], p[1], p[2])));
              return {
                mainGeo: buildTaperedTubeGeo(curve, radii, segments, 14, 0),
                outGeo: outline > 0 ? buildTaperedTubeGeo(curve, radii, segments, 14, outline) : null,
              };
            }, [key, outline, segments]);

            useEffect(() => () => { mainGeo.dispose(); outGeo?.dispose(); }, [mainGeo, outGeo]);

            const first = points[0], last = points[points.length - 1];
            const rStart = radii[0], rEnd = radii[radii.length - 1];

            return (
              <group>
                <mesh geometry={mainGeo} material={mat} />
                {outGeo && <mesh geometry={outGeo}><meshBasicMaterial color={PALETTE.ink} side={THREE.BackSide} /></mesh>}
                {startCap && (
                  <group position={first}>
                    <mesh material={mat}><sphereGeometry args={[rStart, 12, 10]} /></mesh>
                    {outline > 0 && <mesh><sphereGeometry args={[rStart + outline, 12, 10]} /><meshBasicMaterial color={PALETTE.ink} side={THREE.BackSide} /></mesh>}
                  </group>
                )}
                {endCap && (
                  <group position={last}>
                    <mesh material={mat}><sphereGeometry args={[rEnd, 12, 10]} /></mesh>
                    {outline > 0 && <mesh><sphereGeometry args={[rEnd + outline, 12, 10]} /><meshBasicMaterial color={PALETTE.ink} side={THREE.BackSide} /></mesh>}
                  </group>
                )}
              </group>
            );
          };

          // Sculpted LatheGeometry with non-uniform anatomical scaling (broad shoulders, flat chest/back!)
          export const SmoothLathe: React.FC<{
            profile: [number, number][];
            position?: [number, number, number];
            rotation?: [number, number, number];
            scale?: [number, number, number];
            color?: string;
            shadowColor?: string;
            rim?: number;
            outline?: number;
            radialSegments?: number;
          }> = ({
            profile, position = [0, 0, 0], rotation = [0, 0, 0], scale = [1, 1, 1],
            color = PALETTE.heroShirt, shadowColor, rim = 0.4, outline = 0.013, radialSegments = 24,
          }) => {
            const mat = useCelMaterial(color, shadowColor, rim);
            const key = profile.map((p) => `${p[0].toFixed(3)},${p[1].toFixed(3)}`).join("|");

            const { mainGeo, outGeo } = useMemo(() => {
              const pts = profile.map(([r, y]) => new THREE.Vector2(Math.max(0.001, r), y));
              const outPts = profile.map(([r, y], idx) => {
                const yShift = idx === 0 ? -outline * 0.6 : idx === profile.length - 1 ? outline * 0.6 : 0;
                return new THREE.Vector2(r <= 0.003 ? 0.001 : r + outline, y + yShift);
              });
              return {
                mainGeo: new THREE.LatheGeometry(pts, radialSegments),
                outGeo: outline > 0 ? new THREE.LatheGeometry(outPts, radialSegments) : null,
              };
            }, [key, outline, radialSegments]);

            useEffect(() => () => { mainGeo.dispose(); outGeo?.dispose(); }, [mainGeo, outGeo]);

            return (
              <group position={position} rotation={rotation} scale={scale}>
                <mesh geometry={mainGeo} material={mat} />
                {outGeo && <mesh geometry={outGeo}><meshBasicMaterial color={PALETTE.ink} side={THREE.BackSide} /></mesh>}
              </group>
            );
          };

          // Crisp 2D Canvas Gym Wall Poster
          export const GymPoster: React.FC<{
            position: [number, number, number];
            lines: string[];
            bg: string;
            accent: string;
            size?: [number, number];
          }> = ({ position, lines, bg, accent, size = [0.95, 1.25] }) => {
            const tex = useMemo(() => {
              const canvas = document.createElement("canvas");
              canvas.width = 256; canvas.height = 320;
              const ctx = canvas.getContext("2d");
              if (ctx) {
                ctx.fillStyle = bg; ctx.fillRect(0, 0, 256, 320);
                ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 14; ctx.strokeRect(7, 7, 242, 306);
                ctx.fillStyle = accent; ctx.fillRect(22, 22, 212, 42);
                ctx.fillStyle = PALETTE.ink; ctx.font = "900 32px 'DejaVu Sans', sans-serif"; ctx.textAlign = "center";
                lines.forEach((line, i) => ctx.fillText(line, 128, 126 + i * 48));
                ctx.fillRect(78, 258, 100, 12); ctx.fillRect(62, 240, 20, 48); ctx.fillRect(174, 240, 20, 48);
              }
              const texture = new THREE.CanvasTexture(canvas);
              texture.needsUpdate = true;
              return texture;
            }, [lines.join("|"), bg, accent]);

            useEffect(() => () => tex.dispose(), [tex]);

            return (
              <mesh position={position}>
                <planeGeometry args={size} />
                <meshBasicMaterial map={tex} />
              </mesh>
            );
          };
