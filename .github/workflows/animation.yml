              heroMood = "panic";
              heroSweat = true;
              heroMelt = 0.24 * Math.sin(frame * 0.45);
              heroTremble = 0.055;

              heroPlateScale = 1.55;
              heroBarPos = [0, 1.5, -0.35];
              heroBarRot = [0, 0, Math.sin(frame * 0.35) * 0.2];

              cam = {
                pos: [Math.sin(frame * 0.22) * 0.38, 1.45 + Math.cos(frame * 0.28) * 0.16, 6.9 - t * 0.4],
                target: [0, 1.42, 0.2],
                fov: 56 + Math.sin(frame * 0.45) * 3.5,
                roll: Math.sin(frame * 0.24) * 0.18,
                shake: 0.062,
              };
            }
            // SHOT 9 (720 - 850): Reality Snap! Everyone Peaceful -> Wide EMPTY BARBELL Reveal
            else if (frame < 850) {
              heroPose = "realityempty";
              heroBarPos = [0, 1.48, 0.08];
              heroPlateScale = 0;
              if (frame < 746) {
                heroMood = frame < 735 ? "blink" : "pinprick";
                cam = { pos: [0, 1.68, 3.2], target: [0, 1.66, 0.12], fov: 48, roll: 0, shake: 0 };
              } else if (frame < 778) {
                broMode = "squat";
                cam = { pos: [4.75, 1.42, 6.2], target: [4.8, 1.28, 0.1], fov: 54, roll: 0, shake: 0 };
              } else if (frame < 808) {
                girlMode = "pulldown";
                girlHeadYaw = 0;
                cam = { pos: [-4.65, 1.5, 5.7], target: [-4.65, 1.35, 0.0], fov: 54, roll: 0, shake: 0 };
              } else {
                const zoomOut = smoothStep(segProgress(frame, 808, 846));
                heroMood = "pinprick";
                cam = {
                  pos: [0, lerp(1.64, 1.4, zoomOut), lerp(3.3, 6.6, zoomOut)],
                  target: [0, lerp(1.64, 1.3, zoomOut), 0.1],
                  fov: lerp(48, 55, zoomOut),
                  roll: 0,
                  shake: frame >= 810 && frame <= 822 ? 0.032 : 0,
                };
              }
            }
            // SHOT 10 (850 - 960): Friendly Helper Girl "NEED HELP?" -> Rocket Zip Exit!
            else {
              showHelper = true;
              const walkIn = smoothStep(segProgress(frame, 850, 878));
              // Both Overthinker (x = -0.42) and Helper Girl (x = +0.82) fit 100% cleanly inside 9:16 frame!
              heroPos = [-0.42, 0, 0.12];
              heroBarPos = [-0.12, 1.48, 0.08];
              heroPose = "realityempty";
              heroPlateScale = 0;
              heroMood = "pinprick";

              helperPos = [lerp(2.05, 0.82, walkIn), 0, 0.24];

              if (frame >= 900) {
                const zipT = segProgress(frame, 900, 907);
                heroPos = [-0.42, lerp(0, -5.8, zipT), 0.12];
                if (frame > 907) heroVisible = false;
                helperSurprised = true;
              }
              cam = {
                pos: [0.18, 1.4, 6.65],
                target: [0.18, 1.3, 0.12],
                fov: 55,
                roll: 0,
                shake: frame >= 900 && frame <= 914 ? 0.055 : 0,
              };
            }

            return (
              <>
                <color attach="background" args={[PALETTE.bgPaper]} />
                <ambientLight intensity={1.1} />
                <directionalLight position={[4, 9, 7]} intensity={0.45} />

                <CameraRig state={cam} frame={frame} />

                <GymEnvironment frame={frame} pulldownProgress={pulldownVal} />

                {/* Buff Bro's Barbell at his own squat rack */}
                {(broMode === "squat" || broMode === "glare") && broPos[0] > 2.5 && (
                  <Barbell
                    position={[broPos[0], 1.54 - broSquatVal * 0.3, broPos[2] - 0.05]}
                    rotation={[0, broRot[1], 0]}
                    plateScale={1.04}
                    frame={frame}
                  />
                )}

                {/* Overthinker's Barbell */}
                <Barbell
                  position={heroBarPos}
                  rotation={heroBarRot}
                  plateScale={heroPlateScale}
                  bend={heroBarBend}
                  frame={frame}
                />

                {/* Characters */}
                {heroVisible && (
                  <Overthinker
                    position={heroPos}
                    rotation={heroRot}
                    frame={frame}
                    pose={heroPose}
                    mood={heroMood}
                    barY={heroBarPos[1]}
                    sweating={heroSweat}
                    waterfall={heroWaterfall}
                    tremble={heroTremble}
                    meltFactor={heroMelt}
                  />
                )}

                <GymGirl
                  position={girlPos}
                  rotation={girlRot}
                  frame={frame}
                  mode={girlMode}
                  pulldownProgress={pulldownVal}
                  headYawOverride={girlHeadYaw}
                />

                <BuffBro
                  position={broPos}
                  rotation={broRot}
                  frame={frame}
                  mode={broMode}
                  squatDepth={broSquatVal}
                  headYawOverride={broHeadYaw}
                />

                {showHelper && <HelperGirl position={helperPos} frame={frame} surprised={helperSurprised} />}

                <FloatingMockingFaces frame={frame} intensity={feverIntensity} />
              </>
            );
          };
          EOF

          # --------------------------------------------------------------------
          # 10. Clean 2D Comic Overlay & Speech Bubble (src/components/ComicOverlay.tsx)
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/src/components/ComicOverlay.tsx
          import React from "react";
          import { AbsoluteFill } from "remotion";
          import { PALETTE, boilJitter, easeOutBack, segProgress } from "../utils/animation";

          export const ComicOverlay: React.FC<{ frame: number }> = ({ frame }) => {
            const boomFrames = [66, 135, 206, 376, 541, 590, 810, 901];
            const isImpactFlash = boomFrames.some((bf) => frame === bf || frame === bf + 1);

            const isFever = frame >= 615 && frame < 720;
            const feverHue = isFever ? Math.sin(frame * 0.45) * 18 : 0;

            const showNeedHelp = frame >= 865;
            const needHelpPop = easeOutBack(segProgress(frame, 865, 876));
            const jx = boilJitter(frame, 99, 2.2);
            const jy = boilJitter(frame, 107, 2.2);

            // Rocket zip-out speed lines aligned cleanly over Overthinker (x = -0.42 in Shot 10)
            const showSpeedLines = frame >= 900 && frame <= 936;
            const speedFade = showSpeedLines ? Math.max(0, 1 - segProgress(frame, 912, 936)) : 0;

            const showActionLines =
              (frame >= 72 && frame <= 155) ||
              (frame >= 475 && frame <= 540) ||
              (frame >= 615 && frame <= 720);

            const showAngerMark = (frame >= 64 && frame < 72) || (frame >= 130 && frame < 155);

            return (
              <AbsoluteFill style={{ pointerEvents: "none" }}>
                {/* Manga Radial Action Lines */}
                {showActionLines && (
                  <svg viewBox="0 0 1080 1920" style={{ width: "100%", height: "100%", opacity: isFever ? 0.28 : 0.18 }}>
                    {Array.from({ length: 30 }).map((_, i) => {
                      const angle = (i / 30) * Math.PI * 2 + (frame % 3) * 0.05;
                      const x1 = 540 + Math.cos(angle) * 440;
                      const y1 = 960 + Math.sin(angle) * 620;
                      const x2 = 540 + Math.cos(angle) * 1180;
                      const y2 = 960 + Math.sin(angle) * 1460;
                      return (
                        <line
                          key={i}
                          x1={x1}
                          y1={y1}
                          x2={x2}
                          y2={y2}
                          stroke={PALETTE.ink}
                          strokeWidth={i % 3 === 0 ? 6 : 3}
                        />
                      );
                    })}
                  </svg>
                )}

                {/* Comic Anger Vein Mark during glare close-ups */}
                {showAngerMark && (
                  <svg
                    viewBox="0 0 120 120"
                    style={{ position: "absolute", top: 660, right: 240, width: 88, height: 88 }}
                  >
                    <path d="M25,45 Q45,45 45,25 M75,25 Q75,45 95,45 M95,75 Q75,75 75,95 M45,95 Q45,75 25,75" fill="none" stroke="#D83C30" strokeWidth="11" strokeLinecap="round" />
                  </svg>
                )}

                {/* Vertical Rocket-Drop Speed Lines + Dust Puff */}
                {showSpeedLines && (
                  <svg
                    viewBox="0 0 1080 1920"
                    style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: speedFade }}
                  >
                    <line x1="335" y1="700" x2="335" y2="1410" stroke={PALETTE.speedRed} strokeWidth="9" strokeLinecap="round" />
                    <line x1="374" y1="770" x2="374" y2="1450" stroke={PALETTE.ink} strokeWidth="6" strokeLinecap="round" />
                    <line x1="414" y1="720" x2="414" y2="1420" stroke={PALETTE.speedRed} strokeWidth="7" strokeLinecap="round" />
                    <ellipse
                      cx="374"
                      cy="1410"
                      rx={70 + (frame - 900) * 5.2}
                      ry={22 + (frame - 900) * 1.7}
                      fill="#FFFFFF"
                      stroke={PALETTE.ink}
                      strokeWidth="5"
                      opacity={Math.max(0, 1 - (frame - 900) / 18)}
                    />
                  </svg>
                )}

                {/* Crisp Comic Speech Bubble "NEED HELP?" cleanly above Helper Girl */}
                {showNeedHelp && (
                  <div
                    style={{
                      position: "absolute",
                      right: 78,
                      top: 525,
                      transform: `translate(${jx}px, ${jy}px) scale(${needHelpPop}) rotate(-3deg)`,
                      transformOrigin: "bottom center",
                    }}
                  >
                    <div
                      style={{
                        backgroundColor: "#FFFFFF",
                        border: `7px solid ${PALETTE.ink}`,
                        borderRadius: "40px",
                        padding: "20px 32px",
                        fontFamily: "'DejaVu Sans', 'Comic Sans MS', sans-serif",
                        fontWeight: 900,
                        fontSize: 50,
                        lineHeight: 1.08,
                        color: PALETTE.ink,
                        textAlign: "center",
                        letterSpacing: "2px",
                        boxShadow: `7px 7px 0px ${PALETTE.ink}`,
                      }}
                    >
                      NEED
                      <br />
                      HELP?
                    </div>
                    <svg viewBox="0 0 60 50" style={{ width: 54, height: 44, marginLeft: 118, marginTop: -7 }}>
                      <polygon points="8,0 44,0 24,44" fill="#FFFFFF" stroke={PALETTE.ink} strokeWidth="7" strokeLinejoin="round" />
                      <line x1="12" y1="0" x2="40" y2="0" stroke="#FFFFFF" strokeWidth="9" />
                    </svg>
                  </div>
                )}

                {/* Soft Warm Vignette */}
                <div
                  style={{
                    position: "absolute",
                    inset: 0,
                    background: "radial-gradient(circle at 50% 48%, rgba(0,0,0,0) 66%, rgba(72,56,28,0.16) 100%)",
                    filter: isFever ? `hue-rotate(${feverHue}deg)` : undefined,
                  }}
                />

                {/* Impact Frame Flash */}
                {isImpactFlash && (
                  <div
                    style={{
                      position: "absolute",
                      inset: 0,
                      backgroundColor: "rgba(255, 255, 255, 0.34)",
                      mixBlendMode: "difference",
                    }}
                  />
                )}
              </AbsoluteFill>
            );
          };
          EOF

          # --------------------------------------------------------------------
          # 11. Main Remotion Composition (src/Video.tsx)
          #     flat={true} disables ACESFilmicToneMapping -> PURE bright 2D colors!
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/src/Video.tsx
          import React from "react";
          import { AbsoluteFill, Audio, staticFile, useCurrentFrame, useVideoConfig } from "remotion";
          import { ThreeCanvas } from "@remotion/three";
          import * as THREE from "three";
          import { OverthinkerScene } from "./scene/OverthinkerScene";
          import { ComicOverlay } from "./components/ComicOverlay";
          import { PALETTE } from "./utils/animation";

          export interface VideoProps {
            includeAudio?: boolean;
          }

          export const OverthinkerVideo: React.FC<VideoProps> = ({ includeAudio = true }) => {
            const frame = useCurrentFrame();
            const { width, height, fps } = useVideoConfig();

            return (
              <AbsoluteFill style={{ backgroundColor: PALETTE.bgPaper }}>
                {includeAudio && <Audio src={staticFile("soundtrack.wav")} volume={1.0} />}
                <ThreeCanvas
                  width={width}
                  height={height}
                  shadows={false}
                  flat
                  dpr={1}
                  gl={{ antialias: true, toneMapping: THREE.NoToneMapping }}
                  camera={{ fov: 54, near: 0.1, far: 95, position: [0, 1.45, 6.2] }}
                >
                  <OverthinkerScene frame={frame} fps={fps} />
                </ThreeCanvas>
                <ComicOverlay frame={frame} />
              </AbsoluteFill>
            );
          };
          EOF

          # --------------------------------------------------------------------
          # 12. Remotion Root & Entrypoint (src/Root.tsx & src/index.ts)
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/src/Root.tsx
          import React from "react";
          import { Composition } from "remotion";
          import { OverthinkerVideo } from "./Video";

          export const RemotionRoot: React.FC = () => {
            return (
              <Composition
                id="OverthinkerAtGym"
                component={OverthinkerVideo}
                durationInFrames={960}
                fps={30}
                width={1080}
                height={1920}
                defaultProps={{ includeAudio: true }}
              />
            );
          };
          EOF

          cat << 'EOF' > gym-anim/src/index.ts
          import { registerRoot } from "remotion";
          import { RemotionRoot } from "./Root";

          registerRoot(RemotionRoot);
          EOF

      - name: Install Node Dependencies & Ensure Remotion Browser
        working-directory: gym-anim
        run: |
          npm install --legacy-peer-deps
          npx remotion browser ensure

      - name: Synthesize Synced Comedy SFX & Soundtrack WAV
        working-directory: gym-anim
        run: |
          node scripts/generate-audio.mjs

      - name: Render 1080x1920 Funny Animation MP4 (Three.js + Remotion v3)
        working-directory: gym-anim
        run: |
          INCLUDE_AUDIO_VAL="${{ github.event.inputs.include_audio }}"
          if [ -z "$INCLUDE_AUDIO_VAL" ]; then INCLUDE_AUDIO_VAL="true"; fi

          npx remotion render src/index.ts OverthinkerAtGym out/overthinker-at-gym.mp4 \
            --gl=swangle \
            --codec=h264 \
            --crf=${{ github.event.inputs.quality_crf || '18' }} \
            --concurrency=${{ github.event.inputs.concurrency || '2' }} \
            --props="{\"includeAudio\": $INCLUDE_AUDIO_VAL}" \
            --log=info
          ls -lh out/overthinker-at-gym.mp4
          ffprobe -v error -show_format -show_streams out/overthinker-at-gym.mp4

      - name: Upload Rendered Animation MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: overthinker-at-gym-short-v3-mp4
          path: gym-anim/out/overthinker-at-gym.mp4
          retention-days: 14
