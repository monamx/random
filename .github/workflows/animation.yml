                {!isFeverBg && <GymGirl position={girlPos} rotation={girlRot} frame={frame} mode={girlMode} pulldownProgress={pulldownVal} headYawOverride={girlHeadYaw} />}
                {!isFeverBg && <BuffBro position={broPos} rotation={broRot} frame={frame} mode={broMode} squatDepth={broSquatVal} headYawOverride={broHeadYaw} />}
                {showHelper && <HelperGirl position={helperPos} frame={frame} surprised={helperSurprised} />}
                <FloatingMockingFaces frame={frame} intensity={feverIntensity} />
              </>
            );
          };
          EOF
    
          # --------------------------------------------------------------------
          # 8. Comic 2D Overlay + Shaking Scream Lettering (src/components/ComicOverlay.tsx)
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/src/components/ComicOverlay.tsx
          import React from "react";
          import { AbsoluteFill } from "remotion";
          import { PALETTE, boilJitter, easeOutBack, segProgress } from "../utils/animation";
    
          export const ComicOverlay: React.FC<{ frame: number }> = ({ frame }) => {
            const boomFrames = [65, 134, 206, 376, 541, 590, 810, 901];
            const isImpactFlash = boomFrames.some((bf) => frame === bf || frame === bf + 1);
            const isFever = frame >= 615 && frame < 720;
            const isScreamPeak = frame >= 475 && frame < 540;
            const showActionLines = (frame >= 72 && frame <= 155) || isScreamPeak || isFever;
            const showAngerMark = (frame >= 64 && frame < 72) || (frame >= 130 && frame < 155);
    
            let thoughtText = "", thoughtPop = 1;
            if (frame >= 80 && frame <= 126) { thoughtText = "Don't look... act normal..."; thoughtPop = easeOutBack(segProgress(frame, 80, 89)); }
            else if (frame >= 274 && frame <= 318) { thoughtText = "Are they judging my form?!"; thoughtPop = easeOutBack(segProgress(frame, 274, 283)); }
            else if (frame >= 326 && frame <= 372) { thoughtText = "ACT COOL!! LIFT HEAVY!!"; thoughtPop = easeOutBack(segProgress(frame, 326, 334)); }
            else if (frame >= 816 && frame <= 848) { thoughtText = "...it's literally empty."; thoughtPop = easeOutBack(segProgress(frame, 816, 825)); }
    
            const showNeedHelp = frame >= 865;
            const needHelpPop = easeOutBack(segProgress(frame, 865, 876));
            const jx = boilJitter(frame, 99, 2.2), jy = boilJitter(frame, 107, 2.2);
    
            const showSpeedLines = frame >= 900 && frame <= 938;
            const speedFade = showSpeedLines ? Math.max(0, 1 - segProgress(frame, 914, 938)) : 0;
            const puffGrow = showSpeedLines ? Math.min(1.45, (frame - 900) / 9) : 0;
    
            return (
              <AbsoluteFill style={{ pointerEvents: "none" }}>
                {showActionLines && (
                  <svg viewBox="0 0 1080 1920" style={{ width: "100%", height: "100%", opacity: isFever ? 0.32 : isScreamPeak ? 0.24 : 0.16 }}>
                    {Array.from({ length: 32 }).map((_, i) => {
                      const angle = (i / 32) * Math.PI * 2 + (frame % 3) * 0.05;
                      return (
                        <line
                          key={i}
                          x1={540 + Math.cos(angle) * 430} y1={960 + Math.sin(angle) * 610}
                          x2={540 + Math.cos(angle) * 1200} y2={960 + Math.sin(angle) * 1480}
                          stroke={isFever ? "#FF5C77" : PALETTE.ink} strokeWidth={i % 3 === 0 ? 6 : 3}
                        />
                      );
                    })}
                  </svg>
                )}
    
                {/* Shaking Comic Scream SFX Text synced to Formant Scream! */}
                {isScreamPeak && (
                  <div
                    style={{
                      position: "absolute", top: 230, left: "50%",
                      transform: `translate(-50%, 0) translate(${Math.sin(frame * 3.1) * 14}px, ${Math.cos(frame * 3.7) * 14}px) rotate(${Math.sin(frame * 1.6) * 5}deg)`,
                      fontFamily: "'DejaVu Sans', sans-serif", fontWeight: 900, fontSize: 92,
                      color: "#FFE66D", WebkitTextStroke: `5px ${PALETTE.ink}`,
                      textShadow: `8px 8px 0px ${PALETTE.ink}`, letterSpacing: "4px", whiteSpace: "nowrap",
                    }}
                  >
                    AAAAHHH!!
                  </div>
                )}
    
                {isFever &&
                  [
                    { text: "HAHAHA!!", left: 75, top: 340, rot: -12, size: 74, col: "#FFE66D" },
                    { text: "LOL!!", right: 85, top: 410, rot: 14, size: 84, col: "#FF6B6B" },
                    { text: "NOOB!!", left: 95, bottom: 420, rot: 9, size: 68, col: "#FFFFFF" },
                    { text: "LMAO!!", right: 75, bottom: 380, rot: -11, size: 78, col: "#FFE66D" },
                  ].map((item, idx) => (
                    <div
                      key={idx}
                      style={{
                        position: "absolute", left: item.left, right: item.right, top: item.top, bottom: item.bottom,
                        transform: `translate(${Math.sin(frame * 1.9 + idx * 2) * 12}px, ${Math.cos(frame * 2.2 + idx * 3) * 12}px) rotate(${item.rot}deg)`,
                        fontFamily: "'DejaVu Sans', sans-serif", fontWeight: 900, fontSize: item.size, color: item.col,
                        WebkitTextStroke: `4px ${PALETTE.ink}`, textShadow: `6px 6px 0px ${PALETTE.ink}`, letterSpacing: "2px",
                      }}
                    >
                      {item.text}
                    </div>
                  ))}
    
                {showAngerMark && (
                  <svg viewBox="0 0 120 120" style={{ position: "absolute", top: 650, right: 235, width: 92, height: 92 }}>
                    <path d="M25,45 Q45,45 45,25 M75,25 Q75,45 95,45 M95,75 Q75,75 75,95 M45,95 Q45,75 25,75" fill="none" stroke="#DC3B2F" strokeWidth="11" strokeLinecap="round" />
                  </svg>
                )}
    
                {thoughtText && (
                  <div
                    style={{
                      position: "absolute", top: 290, left: "50%",
                      transform: `translate(-50%, 0) translate(${jx}px, ${jy}px) scale(${thoughtPop})`,
                      backgroundColor: "#FFFFFF", border: `6px solid ${PALETTE.ink}`, borderRadius: "36px",
                      padding: "18px 36px", fontFamily: "'DejaVu Sans', 'Comic Sans MS', sans-serif",
                      fontWeight: 900, fontSize: 42, color: PALETTE.ink, whiteSpace: "nowrap", boxShadow: `7px 7px 0px ${PALETTE.ink}`,
                    }}
                  >
                    {thoughtText}
                  </div>
                )}
    
                {showSpeedLines && (
                  <svg viewBox="0 0 1080 1920" style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: speedFade }}>
                    <line x1="292" y1="680" x2="292" y2="1390" stroke={PALETTE.speedRed} strokeWidth="12" strokeLinecap="round" />
                    <line x1="326" y1="760" x2="326" y2="1445" stroke={PALETTE.ink} strokeWidth="6" strokeLinecap="round" />
                    <line x1="358" y1="630" x2="358" y2="1430" stroke="#FFFFFF" strokeWidth="10" strokeLinecap="round" />
                    <line x1="392" y1="730" x2="392" y2="1440" stroke={PALETTE.ink} strokeWidth="8" strokeLinecap="round" />
                    <line x1="424" y1="690" x2="424" y2="1405" stroke={PALETTE.speedRed} strokeWidth="9" strokeLinecap="round" />
                    <g transform={`translate(358, 1395) scale(${0.65 + puffGrow * 0.72})`} opacity={Math.max(0, 1 - (frame - 900) / 24)}>
                      <circle cx="-55" cy="8" r="42" fill="#FFFFFF" stroke={PALETTE.ink} strokeWidth="6" />
                      <circle cx="55" cy="10" r="38" fill="#FFFFFF" stroke={PALETTE.ink} strokeWidth="6" />
                      <circle cx="0" cy="-16" r="52" fill="#FFFFFF" stroke={PALETTE.ink} strokeWidth="6" />
                      <ellipse cx="0" cy="12" rx="76" ry="34" fill="#FFFFFF" />
                    </g>
                  </svg>
                )}
    
                {showNeedHelp && (
                  <div style={{ position: "absolute", right: 68, top: 505, transform: `translate(${jx}px, ${jy}px) scale(${needHelpPop}) rotate(-3deg)`, transformOrigin: "bottom center" }}>
                    <div
                      style={{
                        backgroundColor: "#FFFFFF", border: `7px solid ${PALETTE.ink}`, borderRadius: "40px", padding: "20px 34px",
                        fontFamily: "'DejaVu Sans', 'Comic Sans MS', sans-serif", fontWeight: 900, fontSize: 50,
                        lineHeight: 1.08, color: PALETTE.ink, textAlign: "center", letterSpacing: "2px", boxShadow: `7px 7px 0px ${PALETTE.ink}`,
                      }}
                    >
                      NEED<br />HELP?
                    </div>
                    <svg viewBox="0 0 60 50" style={{ width: 54, height: 44, marginLeft: 132, marginTop: -7 }}>
                      <polygon points="8,0 44,0 24,44" fill="#FFFFFF" stroke={PALETTE.ink} strokeWidth="7" strokeLinejoin="round" />
                      <line x1="12" y1="0" x2="40" y2="0" stroke="#FFFFFF" strokeWidth="9" />
                    </svg>
                  </div>
                )}
    
                <div
                  style={{
                    position: "absolute", inset: 0,
                    background: isFever
                      ? "radial-gradient(circle at 50% 48%, rgba(0,0,0,0) 45%, rgba(20,0,18,0.52) 100%)"
                      : "radial-gradient(circle at 50% 48%, rgba(0,0,0,0) 68%, rgba(72,56,28,0.15) 100%)",
                  }}
                />
                {isImpactFlash && <div style={{ position: "absolute", inset: 0, backgroundColor: "rgba(255,255,255,0.34)", mixBlendMode: "difference" }} />}
              </AbsoluteFill>
            );
          };
          EOF
    
          # --------------------------------------------------------------------
          # 9. Main Composition, Root & Entrypoint
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/src/Video.tsx
          import React from "react";
          import { AbsoluteFill, Audio, staticFile, useCurrentFrame, useVideoConfig } from "remotion";
          import { ThreeCanvas } from "@remotion/three";
          import * as THREE from "three";
          import { OverthinkerScene } from "./scene/OverthinkerScene";
          import { ComicOverlay } from "./components/ComicOverlay";
          import { PALETTE } from "./utils/animation";
    
          export const OverthinkerVideo: React.FC<{ includeAudio?: boolean }> = ({ includeAudio = true }) => {
            const frame = useCurrentFrame();
            const { width, height, fps } = useVideoConfig();
            return (
              <AbsoluteFill style={{ backgroundColor: PALETTE.bgPaper }}>
                {includeAudio && <Audio src={staticFile("soundtrack.wav")} volume={1.0} />}
                <ThreeCanvas
                  width={width} height={height} shadows={false} flat dpr={1}
                  gl={{ antialias: true, toneMapping: THREE.NoToneMapping }}
                  camera={{ fov: 54, near: 0.1, far: 95, position: [0, 1.45, 6.2] }}
                >
                  <OverthinkerScene frame={frame} fps={fps} />
                </ThreeCanvas>
                <ComicOverlay frame={frame} />
              </AbsoluteFill>
            );
          };
          EOF
    
          cat << 'EOF' > gym-anim/src/Root.tsx
          import React from "react";
          import { Composition } from "remotion";
          import { OverthinkerVideo } from "./Video";
    
          export const RemotionRoot: React.FC = () => (
            <Composition id="OverthinkerAtGym" component={OverthinkerVideo} durationInFrames={960} fps={30} width={1080} height={1920} defaultProps={{ includeAudio: true }} />
          );
          EOF
    
          cat << 'EOF' > gym-anim/src/index.ts
          import { registerRoot } from "remotion";
          import { RemotionRoot } from "./Root";
          registerRoot(RemotionRoot);
          EOF
    
      - name: Install Node Dependencies & Ensure Remotion Browser
        working-directory: gym-anim
        run: |
          npm install --legacy-peer-deps
          npx remotion browser ensure
    
      - name: Synthesize Rich Comedy SFX, Formant Screams & Gym Foley WAV
        working-directory: gym-anim
        run: |
          node scripts/generate-audio.mjs
    
      - name: Render 1080x1920 Studio 2D Cel Animation MP4 (v6)
        working-directory: gym-anim
        run: |
          INCLUDE_AUDIO_VAL="${{ github.event.inputs.include_audio }}"
          if [ -z "$INCLUDE_AUDIO_VAL" ]; then INCLUDE_AUDIO_VAL="true"; fi
    
          MAX_CORES=$(nproc)
          REQ_CONCURRENCY="${{ github.event.inputs.concurrency || '2' }}"
          if [ "$REQ_CONCURRENCY" -gt "$MAX_CORES" ]; then
            CONCURRENCY="$MAX_CORES"
          elif [ "$REQ_CONCURRENCY" -lt 1 ]; then
            CONCURRENCY=1
          else
            CONCURRENCY="$REQ_CONCURRENCY"
          fi
          echo "Using concurrency: $CONCURRENCY (max cores: $MAX_CORES)"
    
          npx remotion render src/index.ts OverthinkerAtGym out/overthinker-at-gym.mp4 \
            --gl=swangle \
            --codec=h264 \
            --crf=${{ github.event.inputs.quality_crf || '18' }} \
            --concurrency="$CONCURRENCY" \
            --props="{\"includeAudio\": $INCLUDE_AUDIO_VAL}" \
            --log=info
          ls -lh out/overthinker-at-gym.mp4
          ffprobe -v error -show_format -show_streams out/overthinker-at-gym.mp4
    
      - name: Upload Rendered Animation MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: overthinker-at-gym-short-v6-mp4
          path: gym-anim/out/overthinker-at-gym.mp4
          retention-days: 14
