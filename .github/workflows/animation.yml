            sockWhite: "#FFFFFF",

            heroShirt: "#9AC8EB",
            heroShirtTrim: "#649CC7",
            heroShorts: "#3F4B61",
            heroShoes: "#FFFFFF",
            heroAccent: "#5695C9",
            heroSole: "#495366",

            girlHair: "#2B2220",
            girlHairShine: "#5A4742",
            girlTop: "#F27B72",
            girlTopTrim: "#C9554C",
            girlLeggings: "#384152",
            girlTowel: "#FFFFFF",
            girlShoeAccent: "#F27B72",

            broHair: "#26201D",
            broHeadband: "#E34A3F",
            broTank: "#3D4657",
            broTankTrim: "#282F3D",
            broShorts: "#29303D",
            broShoes: "#F7F5EE",
            broShoeAccent: "#E34A3F",

            helperHair: "#634131",
            helperHairShine: "#8F644F",
            helperTop: "#75C4AA",
            helperTopTrim: "#4E9C83",
            helperShorts: "#3B4557",

            sweatBlue: "#52C5FF",
            dreadPurple: "#6E5A8A",
            speedRed: "#DC3B2F",
            feverBg: "#241222",
            feverSpiral: "#6E1C38",
          } as const;

          export const clamp01 = (v: number): number => Math.max(0, Math.min(1, v));
          export const segProgress = (f: number, s: number, e: number): number => clamp01((f - s) / Math.max(1, e - s));
          export const smoothStep = (t: number): number => { const x = clamp01(t); return x * x * (3 - 2 * x); };
          export const easeOutBack = (t: number): number => { const x = clamp01(t), c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
          export const lerp = (a: number, b: number, t: number): number => a + (b - a) * clamp01(t);

          export function boilJitter(frame: number, seed: number, amp = 0.0014): number {
            const step = Math.floor(frame / 3);
            const raw = Math.sin(step * 12.9898 + seed * 78.233) * 43758.5453;
            return ((raw - Math.floor(raw)) * 2 - 1) * amp;
          }

          export function cameraShake(frame: number, intensity: number): [number, number, number] {
            if (intensity <= 0.0001) return [0, 0, 0];
            return [
              Math.sin(frame * 2.71) * Math.cos(frame * 4.33) * intensity,
              Math.cos(frame * 3.17) * Math.sin(frame * 5.19) * intensity,
              Math.sin(frame * 3.89) * intensity * 0.07,
            ];
          }

          export const isNaturalBlink = (frame: number, offset = 0): boolean => ((frame + offset) % 78) >= 74;
          EOF

          # --------------------------------------------------------------------
          # 5. Modern 2D Cel Shader + Anatomical TaperedLimb Engine (src/scene/ToonMaterial.tsx)
          #    - Custom 2-Tone Anime Cel Shader (bright lit color + crisp warm shadow + rim light)
          #    - TaperedLimb: custom variable-radius swept BufferGeometry along CatmullRomCurve3!
          #    - BeveledPad: rounded ExtrudeGeometry for realistic gym cushions/seats!
          # --------------------------------------------------------------------
          cat << 'EOF' > gym-anim/src/scene/ToonMaterial.tsx
          import React, { useEffect, useMemo } from "react";
          import * as THREE from "three";
          import { PALETTE, boilJitter } from "../utils/animation";

          const CEL_VERT = `
            varying vec3 vNormalW;
            varying vec3 vViewDir;
            void main() {
              vec4 worldPos = modelMatrix * vec4(position, 1.0);
              vNormalW = normalize(mat3(modelMatrix) * normal);
              vViewDir = normalize(cameraPosition - worldPos.xyz);
              gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
          `;

          const CEL_FRAG = `
            uniform vec3 uColor;
            uniform vec3 uShadowColor;
            uniform float uRim;
            varying vec3 vNormalW;
            varying vec3 vViewDir;
            void main() {
              vec3 N = normalize(vNormalW);
              vec3 V = normalize(vViewDir);
              vec3 L = normalize(vec3(0.42, 0.72, 0.56));
              float ndotl = dot(N, L);
              float band = smoothstep(0.06, 0.14, ndotl);
              vec3 col = mix(uShadowColor, uColor, band);
              float rim = smoothstep(0.62, 0.85, 1.0 - max(dot(N, V), 0.0)) * smoothstep(-0.1, 0.35, ndotl);
              col += vec3(0.18, 0.17, 0.15) * rim * uRim;
              gl_FragColor = vec4(col, 1.0);
            }
          `;

          const celMatCache = new Map<string, THREE.ShaderMaterial>();

          export function useCelMaterial(color: string, shadowColor?: string, rim = 0.45): THREE.ShaderMaterial {
            return useMemo(() => {
              const key = `${color}|${shadowColor ?? "auto"}|${rim}`;
              const existing = celMatCache.get(key);
              if (existing) return existing;

              const base = new THREE.Color(color);
              let shadow: THREE.Color;
              if (shadowColor) {
                shadow = new THREE.Color(shadowColor);
              } else {
                // Warm rich modern 2D cel shadow (never muddy gray!)
                const hsl = { h: 0, s: 0, l: 0 };
                base.getHSL(hsl);
                shadow = new THREE.Color().setHSL(
                  (hsl.h + 0.96) % 1,
                  Math.min(1, hsl.s * 1.18 + 0.04),
                  Math.max(0.06, hsl.l * 0.84)
                );
              }

              const mat = new THREE.ShaderMaterial({
                vertexShader: CEL_VERT,
                fragmentShader: CEL_FRAG,
                uniforms: {
                  uColor: { value: base },
                  uShadowColor: { value: shadow },
                  uRim: { value: rim },
                },
              });
              celMatCache.set(key, mat);
              return mat;
            }, [color, shadowColor, rim]);
          }

