          import React, { useEffect, useMemo } from "react";
          import * as THREE from "three";
          import { PALETTE, boilJitter } from "../utils/animation";
    
          interface BaseInkProps {
            position?: [number, number, number];
            rotation?: [number, number, number];
            scale?: [number, number, number];
            color?: string;
            outline?: number;
            outlineColor?: string;
            frame?: number;
            seed?: number;
          }
    
          export const InkBox: React.FC<BaseInkProps & { args: [number, number, number] }> = ({
            args,
            position = [0, 0, 0],
            rotation = [0, 0, 0],
            scale = [1, 1, 1],
            color = PALETTE.machineFrame,
            outline = 0.013,
            outlineColor = PALETTE.ink,
            frame = 0,
            seed = 1,
          }) => {
            const j = boilJitter(frame, seed, 0.0012);
            return (
              <group position={position} rotation={rotation} scale={scale}>
                <mesh>
                  <boxGeometry args={args} />
                  <meshBasicMaterial color={color} />
                </mesh>
                {outline > 0 && (
                  <mesh position={[j, -j, 0]}>
                    <boxGeometry args={[args[0] + outline * 2, args[1] + outline * 2, args[2] + outline * 2]} />
                    <meshBasicMaterial color={outlineColor} side={THREE.BackSide} />
                  </mesh>
                )}
              </group>
            );
          };
    
          export const InkSphere: React.FC<BaseInkProps & { args: [number, number?, number?] }> = ({
            args,
            position = [0, 0, 0],
            rotation = [0, 0, 0],
            scale = [1, 1, 1],
            color = PALETTE.skin,
            outline = 0.014,
            outlineColor = PALETTE.ink,
            frame = 0,
            seed = 2,
          }) => {
            const [r, w = 26, h = 20] = args;
            const j = boilJitter(frame, seed, 0.0012);
            return (
              <group position={position} rotation={rotation} scale={scale}>
                <mesh>
                  <sphereGeometry args={[r, w, h]} />
                  <meshBasicMaterial color={color} />
                </mesh>
                {outline > 0 && (
                  <mesh position={[j, -j, 0]}>
                    <sphereGeometry args={[r + outline, w, h]} />
                    <meshBasicMaterial color={outlineColor} side={THREE.BackSide} />
                  </mesh>
                )}
              </group>
            );
          };
    
          export const InkCylinder: React.FC<BaseInkProps & { args: [number, number, number, number?] }> = ({
            args,
            position = [0, 0, 0],
            rotation = [0, 0, 0],
            scale = [1, 1, 1],
            color = PALETTE.skin,
            outline = 0.013,
            outlineColor = PALETTE.ink,
            frame = 0,
            seed = 3,
          }) => {
            const [rt, rb, h, seg = 20] = args;
            const j = boilJitter(frame, seed, 0.0011);
            return (
              <group position={position} rotation={rotation} scale={scale}>
                <mesh>
                  <cylinderGeometry args={[rt, rb, h, seg]} />
                  <meshBasicMaterial color={color} />
                </mesh>
                {outline > 0 && (
                  <mesh position={[j, 0, 0]}>
                    <cylinderGeometry args={[rt + outline, rb + outline, h + outline * 1.1, seg]} />
                    <meshBasicMaterial color={outlineColor} side={THREE.BackSide} />
                  </mesh>
                )}
              </group>
            );
          };
    
          export const InkTorus: React.FC<BaseInkProps & { args: [number, number, number?, number?, number?] }> = ({
            args,
            position = [0, 0, 0],
            rotation = [0, 0, 0],
            scale = [1, 1, 1],
            color = PALETTE.heroShirtTrim,
            outline = 0.008,
            outlineColor = PALETTE.ink,
          }) => {
            const [r, tube, radSeg = 12, tubSeg = 24, arc = Math.PI * 2] = args;
            return (
              <group position={position} rotation={rotation} scale={scale}>
                <mesh>
                  <torusGeometry args={[r, tube, radSeg, tubSeg, arc]} />
                  <meshBasicMaterial color={color} />
                </mesh>
                {outline > 0 && (
                  <mesh>
                    <torusGeometry args={[r, tube + outline, radSeg, tubSeg, arc]} />
                    <meshBasicMaterial color={outlineColor} side={THREE.BackSide} />
                  </mesh>
                )}
              </group>
            );
          };
    
          // Seamless Continuous Curved Noodle Limb (ZERO broken elbow/knee seams!)
          export const SmoothTube: React.FC<{
            points: [number, number, number][];
            radius: number;
            color?: string;
            outline?: number;
            segments?: number;
            endCap?: boolean;
            startCap?: boolean;
          }> = ({
            points,
            radius,
            color = PALETTE.skin,
            outline = 0.013,
            segments = 18,
            endCap = true,
            startCap = true,
          }) => {
            const key = points.map((p) => p.map((n) => n.toFixed(3)).join(",")).join("|");
    
            const { mainGeo, outGeo } = useMemo(() => {
              const vecs = points.map((p) => new THREE.Vector3(p[0], p[1], p[2]));
              const curve = new THREE.CatmullRomCurve3(vecs);
              return {
                mainGeo: new THREE.TubeGeometry(curve, segments, radius, 14, false),
                outGeo: outline > 0 ? new THREE.TubeGeometry(curve, segments, radius + outline, 14, false) : null,
              };
            }, [key, radius, outline, segments]);
    
            useEffect(() => {
              return () => {
                mainGeo.dispose();
                outGeo?.dispose();
              };
            }, [mainGeo, outGeo]);
    
            const first = points[0];
            const last = points[points.length - 1];
    
            return (
              <group>
                <mesh geometry={mainGeo}>
                  <meshBasicMaterial color={color} />
                </mesh>
                {outGeo && (
                  <mesh geometry={outGeo}>
                    <meshBasicMaterial color={PALETTE.ink} side={THREE.BackSide} />
                  </mesh>
                )}
                {startCap && (
                  <group position={first}>
                    <mesh>
                      <sphereGeometry args={[radius, 12, 10]} />
                      <meshBasicMaterial color={color} />
                    </mesh>
                    {outline > 0 && (
                      <mesh>
                        <sphereGeometry args={[radius + outline, 12, 10]} />
                        <meshBasicMaterial color={PALETTE.ink} side={THREE.BackSide} />
                      </mesh>
                    )}
                  </group>
                )}
                {endCap && (
                  <group position={last}>
                    <mesh>
                      <sphereGeometry args={[radius, 12, 10]} />
                      <meshBasicMaterial color={color} />
                    </mesh>
                    {outline > 0 && (
                      <mesh>
                        <sphereGeometry args={[radius + outline, 12, 10]} />
                        <meshBasicMaterial color={PALETTE.ink} side={THREE.BackSide} />
                      </mesh>
                    )}
                  </group>
                )}
              </group>
            );
          };
    
          // Organic Sculpted Torso / Shorts / Sleeves using LatheGeometry
          export const SmoothLathe: React.FC<{
            profile: [number, number][];
            position?: [number, number, number];
            rotation?: [number, number, number];
            scale?: [number, number, number];
            color?: string;
            outline?: number;
            radialSegments?: number;
          }> = ({
            profile,
            position = [0, 0, 0],
            rotation = [0, 0, 0],
            scale = [1, 1, 1],
            color = PALETTE.heroShirt,
            outline = 0.014,
            radialSegments = 24,
          }) => {
            const key = profile.map((p) => `${p[0].toFixed(3)},${p[1].toFixed(3)}`).join("|");
    
            const { mainGeo, outGeo } = useMemo(() => {
              const pts = profile.map(([r, y]) => new THREE.Vector2(Math.max(0.001, r), y));
              const outPts = profile.map(([r, y], idx) => {
                const yShift = idx === 0 ? -outline * 0.65 : idx === profile.length - 1 ? outline * 0.65 : 0;
                return new THREE.Vector2(r <= 0.003 ? 0.001 : r + outline, y + yShift);
              });
              return {
                mainGeo: new THREE.LatheGeometry(pts, radialSegments),
                outGeo: outline > 0 ? new THREE.LatheGeometry(outPts, radialSegments) : null,
              };
            }, [key, outline, radialSegments]);
    
            useEffect(() => {
              return () => {
                mainGeo.dispose();
                outGeo?.dispose();
              };
            }, [mainGeo, outGeo]);
    
            return (
              <group position={position} rotation={rotation} scale={scale}>
                <mesh geometry={mainGeo}>
                  <meshBasicMaterial color={color} />
                </mesh>
                {outGeo && (
                  <mesh geometry={outGeo}>
                    <meshBasicMaterial color={PALETTE.ink} side={THREE.BackSide} />
                  </mesh>
                )}
              </group>
            );
          };
    
          // Crisp 2D Canvas Poster Sign for Gym Wall Props
          export const GymPoster: React.FC<{
            position: [number, number, number];
            lines: string[];
            bg: string;
            accent: string;
            size?: [number, number];
          }> = ({ position, lines, bg, accent, size = [0.95, 1.25] }) => {
            const tex = useMemo(() => {
              const canvas = document.createElement("canvas");
              canvas.width = 256;
              canvas.height = 320;
              const ctx = canvas.getContext("2d");
              if (ctx) {
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, 256, 320);
                ctx.strokeStyle = PALETTE.ink;
                ctx.lineWidth = 14;
                ctx.strokeRect(7, 7, 242, 306);
                ctx.fillStyle = accent;
                ctx.fillRect(24, 24, 208, 44);
                ctx.fillStyle = PALETTE.ink;
                ctx.font = "900 32px 'DejaVu Sans', sans-serif";
                ctx.textAlign = "center";
                lines.forEach((line, i) => {
                  ctx.fillText(line, 128, 128 + i * 48);
                });
                // Cute dumbbell doodle at bottom of poster
                ctx.fillStyle = PALETTE.ink;
                ctx.fillRect(78, 258, 100, 12);
                ctx.fillRect(62, 240, 20, 48);
                ctx.fillRect(174, 240, 20, 48);
              }
              const texture = new THREE.CanvasTexture(canvas);
              texture.needsUpdate = true;
              return texture;
            }, [lines.join("|"), bg, accent]);
    
            useEffect(() => {
              return () => tex.dispose();
            }, [tex]);
    
            return (
              <mesh position={position}>
                <planeGeometry args={size} />
                <meshBasicMaterial map={tex} />
              </mesh>
            );
          };
